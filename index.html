<style>

  .seg{display:flex;background:#eceef6;border-radius:12px;padding:3px;margin-bottom:12px}
  .segb{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  .segb.on{background:#fff;color:var(--indigo);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .composer{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .composer input{width:100%;border:0;font-size:13.5px;outline:none;background:transparent}
  .post{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}
  .post .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .av{width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;background:var(--indigo)}
  .post .who{font-size:13.5px;font-weight:600}.post .when{font-size:11.5px;color:var(--muted)}
  .post .body{font-size:13.5px;color:#2a2e3d;line-height:1.42}
  .post .acts{display:flex;gap:16px;margin-top:9px;font-size:12.5px;color:var(--muted);font-weight:600;cursor:pointer}
  .tagchip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef0ff;color:#3730a3;cursor:pointer}
  .tabbar{position:absolute;bottom:0;left:0;right:0;height:66px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex}

  .tab .e{font-size:20px;filter:grayscale(1);opacity:.55}
  .tab.on{color:var(--indigo)}.tab.on .e{filter:none;opacity:1}

(function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");

/* État persistant */
const KEY='persua_app_v1';
let ST=JSON.parse(localStorage.getItem(KEY)||'{}');
ST.done=ST.done||{}; ST.quiz=ST.quiz||{}; ST.gestes=ST.gestes||{}; ST.test=ST.test||false; ST.posts=ST.posts||[];
function save(){localStorage.setItem(KEY,JSON.stringify(ST));}

/* Le parcours (7 modules réels) */
const MOD=[
 {id:"m1",num:"Module 1",icon:"🧠",t:"Les fondements neuro-comportementaux",sub:"Comment le cerveau de l'acheteur décide vraiment",
  neuro:"Le cerveau décide en deux temps : une réaction émotionnelle rapide, puis une justification lente. L'émotion arbitre, la raison habille.",
  L:[
   {id:"m1l1",t:"Les 3 cerveaux",k:"Survie, émotion, raison : trois couches. L'émotion tranche avant que la raison n'arrive.",x:"Avant de convaincre, rassure. Un cerveau en alerte n'achète jamais."},
   {id:"m1l2",t:"Comment une décision d'achat se forme",k:"Le client ressent d'abord, puis cherche des arguments pour valider son ressenti.",x:"Donne l'émotion en premier, les arguments viennent renforcer après."},
   {id:"m1l3",t:"Le rôle de l'amygdale : émotion avant raison",k:"L'amygdale déclenche l'alerte avant même que tu aies fini ta phrase.",x:"Baisse la menace : rythme lent, ton posé, zéro pression."},
   {id:"m1l4",t:"Neurotransmetteurs : dopamine, sérotonine, cortisol",k:"Dopamine = envie, sérotonine = confiance, cortisol = stress qui bloque l'achat.",x:"Crée l'anticipation (dopamine), jamais la pression (cortisol)."},
   {id:"m1l5",t:"Le cerveau du vendeur : stress, performance, flow",k:"Ton propre stress se transmet. Le cerveau le plus stable prend le contrôle.",x:"Respire avant d'entrer. Ton état est ton premier argument."}
  ],
  Q:[{q:"Qui décide en premier chez l'acheteur ?",o:["La raison et les chiffres","L'émotion et le ressenti","Le prix"],a:1},
     {q:"Un client au cortisol élevé (stressé)...",o:["achète plus vite","se ferme et reporte","négocie mieux"],a:1}]},

 {id:"m2",num:"Module 2",icon:"🧲",t:"L'infiltration subconsciente",sub:"La psychologie de l'acheteur",
  neuro:"L'essentiel de la décision se joue hors du champ conscient. On parle au ressenti, pas seulement à la logique.",
  L:[
   {id:"m2l1",t:"Conscient vs inconscient",k:"La majorité de la décision se joue avant la réflexion consciente.",x:"Adresse le ressenti autant que la logique."},
   {id:"m2l2",t:"Les 6 principes de Cialdini",k:"Réciprocité, engagement, preuve sociale, autorité, sympathie, rareté.",x:"Donne d'abord, montre les autres qui ont dit oui."},
   {id:"m2l3",t:"Les biais cognitifs qui déclenchent l'achat",k:"Ancrage, aversion à la perte, effet de halo orientent le choix.",x:"Ancre une référence haute avant d'annoncer ton prix."},
   {id:"m2l4",t:"Profils psychologiques : DISC",k:"D, I, S, C : chacun décide autrement. Lis le profil, adapte l'approche.",x:"Face à un C, des preuves ; face à un D, du résultat."},
   {id:"m2l5",t:"Douleur vs plaisir",k:"Éviter une douleur motive plus fort que gagner un plaisir.",x:"Fais ressentir le coût de l'inaction avant la solution."},
   {id:"m2l6",t:"Les heuristiques : raccourcis mentaux",k:"Le cerveau économise : il suit des règles rapides plutôt que d'analyser.",x:"Simplifie. Une offre claire bat une offre complète."}
  ],
  Q:[{q:"L'aversion à la perte, c'est...",o:["gagner motive plus que perdre","perdre fait plus mal que gagner ne fait plaisir","le prix n'importe pas"],a:1},
     {q:"Face à un profil C (Consciencieux), tu mises sur...",o:["l'enthousiasme","les preuves et la méthode","la pression"],a:1}]},

 {id:"m3",num:"Module 3",icon:"🎯",t:"Communication persuasive",sub:"Framing, reformulation, charge cognitive, voix",
  neuro:"Le cerveau suit le chemin de moindre effort. Moins de mots, plus d'images, plus de silences.",
  L:[
   {id:"m3l1",t:"Les mots qui activent le Système 1",k:"Des mots concrets et sensoriels parlent au cerveau rapide.",x:"Remplace 'optimiser' par 'gagner du temps'."},
   {id:"m3l2",t:"Un storytelling efficace",k:"Une histoire fait vivre le message, un argument le fait oublier.",x:"Raconte un cas client avant d'expliquer ta méthode."},
   {id:"m3l3",t:"Le framing",k:"Mêmes faits, cadrage différent, décision opposée.",x:"'90% de réussite' passe mieux que '10% d'échec'."},
   {id:"m3l4",t:"La reformulation",k:"Reprends ses mots, il se sent compris et baisse la garde.",x:"'Si je comprends bien, ton vrai enjeu c'est X ?'"},
   {id:"m3l5",t:"La charge cognitive",k:"Trop d'infos = fatigue = report. Moins tu charges, plus il décide.",x:"Une idée par phrase. Coupe un argument sur deux."},
   {id:"m3l6",t:"Le non-verbal",k:"Ton corps parle avant ta bouche, et il détecte la congruence.",x:"Ralentis tes gestes, ouvre ta posture, respire."},
   {id:"m3l7",t:"La voix et le silence",k:"Le silence après une question fait parler le client.",x:"Pose ta question, puis tais-toi trois secondes."}
  ],
  Q:[{q:"La reformulation sert à...",o:["gagner du temps","faire sentir au client qu'il est compris","meubler"],a:1},
     {q:"Après une question puissante, tu...",o:["enchaînes vite","tiens le silence","donnes la réponse"],a:1}]},

 {id:"m4",num:"Module 4",icon:"🩺",t:"Le diagnostic clinique",sub:"Le processus de vente : découverte vers closing",
  neuro:"Le cerveau évalue en permanence risque vs récompense. Baisse le risque perçu, le oui devient logique.",
  L:[
   {id:"m4l1",t:"La découverte neuro",k:"Les bonnes questions font émerger le vrai besoin et la douleur.",x:"Creuse le coût du problème avant de parler solution."},
   {id:"m4l2",t:"Présentation de l'offre",k:"Structure claire = charge basse = décision facile.",x:"Problème, mécanisme, preuve, offre, dans cet ordre."},
   {id:"m4l3",t:"Gestion des objections",k:"Une objection est une info manquante ou une peur, pas un refus.",x:"Fais dire l'objection à voix haute, puis traite la peur."},
   {id:"m4l4",t:"Le closing neuropsychologique",k:"On n'achète pas quand le risque perçu dépasse le désir.",x:"Garantie, étape test, preuve : baisse le risque avant de closer."},
   {id:"m4l5",t:"La négociation par l'aversion à la perte",k:"Ce qu'on risque de perdre pèse plus que ce qu'on peut gagner.",x:"Rappelle ce qu'il perd à ne rien faire, sans menacer."},
   {id:"m4l6",t:"Urgence et rareté",k:"La rareté vraie accélère, la fausse détruit la confiance.",x:"N'utilise l'urgence que si elle est réelle."}
  ],
  Q:[{q:"Une objection, c'est d'abord...",o:["un non définitif","une info qui manque ou une peur","une baisse de prix"],a:1},
     {q:"Pour closer, tu dois surtout...",o:["baisser le prix","réduire le risque perçu","insister"],a:1}]},

 {id:"m5",num:"Module 5",icon:"🏛️",t:"L'architecture de l'offre",sub:"Expérience client et fidélisation",
  neuro:"La mémoire garde les pics émotionnels et la fin, pas la moyenne. Ton delivery se joue sur ces moments.",
  L:[
   {id:"m5l1",t:"Dopamine et fidélisation",k:"L'anticipation d'une récompense fait revenir le client.",x:"Crée une prochaine étape désirable après l'achat."},
   {id:"m5l2",t:"L'effet de pic et de fin",k:"On retient le pic émotionnel et la fin, pas la moyenne.",x:"Soigne le dernier moment de chaque interaction."},
   {id:"m5l3",t:"Confiance et ocytocine",k:"La confiance se construit par la constance et l'attention.",x:"Tiens tes petites promesses, elles bâtissent la grande."},
   {id:"m5l4",t:"Boucles de récompense et fidélité",k:"Des micro-récompenses régulières ancrent l'habitude.",x:"Récompense l'engagement, pas seulement l'achat."},
   {id:"m5l5",t:"Transformer un client en ambassadeur",k:"Un client fier de son choix le défend et le partage.",x:"Aide-le à un résultat qu'il a envie de raconter."}
  ],
  Q:[{q:"L'effet de pic et de fin dit qu'on retient...",o:["la moyenne","le pic émotionnel et la fin","le début"],a:1},
     {q:"La confiance durable vient de...",o:["une grosse promesse","la constance dans les petites","le prix bas"],a:1}]},

 {id:"m6",num:"Module 6",icon:"🛡️",t:"La maîtrise des résistances",sub:"Script neuro-optimisé et cas concrets",
  neuro:"Face à la résistance, on ne pousse pas plus fort : on enlève la friction et la menace.",
  L:[
   {id:"m6l1",t:"Le modèle SONCASE",k:"Sécurité, Orgueil, Nouveauté, Confort, Argent, Sympathie, Écologie.",x:"Détecte le levier dominant, parle sa langue."},
   {id:"m6l2",t:"Le script de vente neuro-optimisé",k:"Une structure éprouvée libère ton attention pour écouter.",x:"Accroche, découverte, gap, mécanisme, preuve, close."},
   {id:"m6l3",t:"Atelier : reformuler un pitch",k:"Un bon pitch se coupe plus qu'il ne s'ajoute.",x:"Reprends ton pitch, enlève 30% des mots."},
   {id:"m6l4",t:"Cas #1 : B2B, cycle long",k:"Décision multiple, rationnelle : outille ton champion interne.",x:"Donne-lui les arguments pour te vendre sans toi."},
   {id:"m6l5",t:"Cas #2 : B2C, achat impulsif",k:"Émotion forte, décision rapide : réduis les frictions.",x:"Enlève les étapes, garde l'élan."},
   {id:"m6l6",t:"Cas #3 : téléphone et visio",k:"Sans le corps, la voix et le rythme portent tout.",x:"Ralentis, souris (ça s'entend), laisse des silences."},
   {id:"m6l7",t:"Checklist neuro-vente",k:"Préparer, c'est réduire la charge le jour J.",x:"Avant chaque RDV : profil, douleur-reine, preuve à dégainer."}

let QA=null;
function openQuiz(mId){const m=M(mId);QA={mId,ans:{}};
  setM('Quiz · '+m.num,m.Q.map((q,qi)=>`<div class="card"><div class="nm" style="font-size:14px;margin-bottom:8px">${qi+1}. ${q.q}</div>${q.o.map((o,oi)=>`<div class="qopt" onclick="ansQ(${qi},${oi},this)">${o}</div>`).join('')}</div>`).join('')+`<button class="cta" onclick="submitQuiz('${mId}')">Valider mes réponses</button><div id="qres" style="text-align:center;margin-top:10px;font-size:13px"></div>`);
  openModal();
}
function ansQ(qi,oi,el){QA.ans[qi]=oi;el.parentElement.querySelectorAll('.qopt').forEach(x=>x.classList.remove('on'));el.classList.add('on');}
function submitQuiz(mId){const m=M(mId);let sc=0;m.Q.forEach((q,qi)=>{if(QA.ans[qi]===q.a)sc++;});const pass=sc>=Math.ceil(m.Q.length*0.5);const r=document.getElementById('qres');
  if(pass){ST.quiz[mId]=true;save();refreshHeader();r.innerHTML='<span style="color:#16a34a;font-weight:700">✓ '+sc+'/'+m.Q.length+' · Module validé ! Le suivant est débloqué.</span>';setTimeout(function(){closeModal();go('parcours');},1300);}
  else r.innerHTML='<span style="color:#dc2626;font-weight:700">'+sc+'/'+m.Q.length+' · Il te manque un point, relis et réessaie.</span>';
}
