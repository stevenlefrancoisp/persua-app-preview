<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>Persua · mon parcours</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{--indigo:#4f46e5;--indigo-d:#3730a3;--ink:#0e1020;--muted:#54596b;--line:#eceef6;
    --bg:#f6f7fb;--card:#fff;--green:#16a34a;--amber:#d97706;--red:#dc2626;--warm:#f59e0b;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0e1020;color:var(--ink)}
  .device{max-width:420px;height:100vh;height:100svh;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
  @media(min-width:440px){body{display:flex;align-items:center;justify-content:center;padding:18px}
    .device{height:860px;border-radius:44px;border:11px solid #0b0c16;box-shadow:0 30px 80px rgba(0,0,0,.5)}}
  .statusbar{min-height:34px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;padding-left:20px;padding-right:20px;font-size:13px;font-weight:600;color:#fff;background:var(--indigo-d)}
  .appbar{background:linear-gradient(135deg,var(--indigo-d),var(--indigo));color:#fff;padding:10px 18px 18px}
  .appbar .hi{font-size:20px;font-weight:700;letter-spacing:-.3px}
  .appbar .sub{font-size:12px;color:#cdd0f2}
  .hdrrow{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
  .chip{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 12px;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
  .chip b{font-size:15px}
  .screen{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px calc(84px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  h3.sh{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:16px 4px 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px}
  .nm{font-size:15px;font-weight:600}.mt{font-size:12.5px;color:var(--muted)}
  .axrow{display:flex;align-items:center;gap:10px;margin:9px 0}
  .axrow .lb{width:82px;font-size:12.5px;font-weight:600}
  .axrow .bar{flex:1;height:8px;border-radius:5px;background:#eceef6;overflow:hidden}
  .axrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),#818cf8)}
  .axrow .vv{width:30px;text-align:right;font-size:12px;color:var(--muted);font-weight:600}
  .geste{background:linear-gradient(135deg,#eef0ff,#f5f6ff);border:1px solid #e0e3ff}
  .geste .k{font-size:11px;font-weight:700;color:var(--indigo);text-transform:uppercase;letter-spacing:.4px}
  .geste .txt{font-size:15px;font-weight:600;margin-top:5px;line-height:1.35}
  .hero-cta{background:linear-gradient(135deg,#3730a3,#4f46e5 55%,#6d63ff);color:#fff;border-radius:20px;padding:32px 22px;margin-bottom:14px;cursor:pointer;box-shadow:0 14px 34px rgba(79,70,229,.30)}
  .hero-cta .big{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.06}
  .hero-cta .sub{font-size:13.5px;color:#dcdcf7;margin-top:10px;line-height:1.45}
  .hero-cta .go{display:inline-block;margin-top:18px;background:rgba(255,255,255,.16);border-radius:12px;padding:11px 17px;font-size:14px;font-weight:700;color:#fff}
  .mod{display:flex;align-items:center;gap:12px;margin-bottom:11px}
  .node{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none;color:#fff}
  .n-done{background:var(--green)}.n-cur{background:var(--indigo);box-shadow:0 0 0 5px #e0e3ff}.n-lock{background:#cbd0dc}
  .modc{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
  .modc .t{font-size:14px;font-weight:600}.modc .s{font-size:12px;color:var(--muted);margin-top:2px}
  .pbar{height:6px;border-radius:4px;background:#eceef6;overflow:hidden;margin-top:7px}.pbar i{display:block;height:100%;background:var(--indigo)}
  .lrow{display:flex;gap:11px;align-items:center;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
  .chk2{width:30px;height:30px;border-radius:9px;background:#eef0ff;color:var(--indigo);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:14px}
  .chk2.ok{background:var(--green);color:#fff}
  .lrow .g{flex:1;font-size:13.5px;font-weight:500}
  .hab{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .hab:last-child{border-bottom:0}
  .chk{width:26px;height:26px;border-radius:8px;border:2px solid #d3d8e4;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
  .hab.done .chk{background:var(--green);border-color:var(--green)}
  .hab.done .ht{text-decoration:line-through;color:var(--muted)}
  .ht{font-size:14px;font-weight:600}
  .habhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
  .streakbig{font-size:13px;color:var(--warm);font-weight:700}
  .feu{display:flex;gap:8px;margin:10px 0}
  .feu div{flex:1;border-radius:12px;padding:10px;text-align:center;font-size:12px;font-weight:700}
  .go{background:#dcfce7;color:#166534}.ad{background:#fef3c7;color:#92400e}.ev{background:#fee2e2;color:#991b1b}
  .obj{background:#0e1020;color:#fff;border-radius:14px;padding:13px;margin-bottom:11px}
  .obj .q{font-size:14px;font-weight:600}.obj .a{font-size:13px;color:#cdd0f2;margin-top:8px;line-height:1.45}
  .taccard .row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
  .taccard .row:last-child{border-bottom:0}
  .taccard .q{font-size:13px;font-weight:600;flex:none;width:96px}.taccard .r{font-size:12.5px;color:#2a2e3d}
  .bub{max-width:82%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.4;margin-bottom:9px}
  .me{background:var(--indigo);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
  .co{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
  .coachbar{display:flex;gap:8px;margin-top:6px}
  .coachbar input{flex:1;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:16px;background:#fff}
  .coachbar button{background:var(--indigo);color:#fff;border:0;border-radius:12px;padding:0 15px;font-size:16px}
  .cta{display:block;width:100%;margin-top:6px;background:var(--indigo);color:#fff;font-size:13.5px;font-weight:600;padding:12px;border-radius:13px;border:0;text-align:center;cursor:pointer}
  .rr{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
  .rr:last-child{border-bottom:0}.rr .g{flex:1}.rr .rl{font-size:11px;color:var(--indigo);font-weight:700}
  .overlay{position:absolute;inset:0;background:var(--bg);z-index:20;transform:translateY(100%);transition:transform .28s ease;display:flex;flex-direction:column}
  .overlay.open{transform:translateY(0)}
  .ov-bar{background:#0e1020;color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700}
  .ov-bar .x{background:rgba(255,255,255,.15);border:0;color:#fff;width:30px;height:30px;border-radius:9px;font-size:16px;cursor:pointer}
  .ov-body{flex:1;overflow-y:auto;padding:16px 16px calc(86px + env(safe-area-inset-bottom))}
  .pchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .pchip{background:#eef0ff;color:#3730a3;font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px}
  .plabel{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
  .soncas{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .soncas>div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px}
  .qopt{border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:13px;margin-top:8px;cursor:pointer;background:#fff;line-height:1.4}
  .scalebar{display:flex;gap:7px}
  .scalebar .seg{flex:1;text-align:center;padding:15px 0;border:1px solid var(--line);border-radius:12px;font-weight:800;font-size:16px;color:var(--muted);cursor:pointer;background:#fff;transition:all .15s}
  .scalebar .seg.on{background:var(--indigo);color:#fff;border-color:var(--indigo);transform:translateY(-2px)}
  .scaleends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px}
  .profil-round{text-align:center;cursor:pointer;flex:none}
  .pr-circle{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;margin:0 auto;border:2px solid rgba(255,255,255,.4)}
  .pr-lbl{font-size:10px;color:#cdd0f2;margin-top:3px;font-weight:700}
  .kgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .kwide{grid-column:1/-1}
  .kcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}
  .klab{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800;line-height:1.3}
  .kbig{font-size:34px;font-weight:800;color:var(--indigo);letter-spacing:-1px;margin-top:6px}
  .kbig span{font-size:17px;color:var(--muted);font-weight:700}
  .ksub{font-size:11.5px;color:var(--muted);margin-top:4px}
  .khbar{display:flex;align-items:center;gap:9px;margin:8px 0}
  .khbar .n{width:76px;font-size:12px;font-weight:600}
  .khbar .t{flex:1;height:9px;border-radius:5px;background:#eef0f4;overflow:hidden}
  .khbar .t i{display:block;height:100%;border-radius:5px}
  .khbar .v{width:36px;text-align:right;font-size:11.5px;font-weight:700;color:var(--muted)}
  .qopt.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
  .fiche{font-size:13.5px;line-height:1.6;color:#2a2e3d}
  .fiche .lead{font-size:14px;color:#0e1020}
  .fiche h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--indigo);margin:18px 0 7px;font-weight:800}
  .fiche p{margin:0 0 10px}
  .fiche ul{margin:0 0 10px;padding-left:18px}
  .fiche li{margin-bottom:6px}
  .seg{display:flex;background:#eceef6;border-radius:12px;padding:3px;margin-bottom:12px}
  .segb{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  .segb.on{background:#fff;color:var(--indigo);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .composer{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .composer input{width:100%;border:0;font-size:16px;outline:none;background:transparent}
  .post{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}
  .post .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .av{width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;background:var(--indigo)}
  .post .who{font-size:13.5px;font-weight:600}.post .when{font-size:11.5px;color:var(--muted)}
  .post .body{font-size:13.5px;color:#2a2e3d;line-height:1.42}
  .post .acts{display:flex;gap:16px;margin-top:9px;font-size:12.5px;color:var(--muted);font-weight:600;cursor:pointer}
  .tagchip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef0ff;color:#3730a3;cursor:pointer}
  .tabbar{position:absolute;bottom:0;left:0;right:0;min-height:66px;padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;z-index:30}
  .modnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .modnav button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--indigo);cursor:pointer}
  .modnav button:disabled{opacity:.35;color:var(--muted)}
  .vthumb{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4f46e5,#3730a3);box-shadow:0 10px 26px rgba(79,70,229,.28)}
  .vthumb.h1{background:linear-gradient(135deg,#0ea5e9,#4f46e5)}
  .vthumb.h2{background:linear-gradient(135deg,#6d63ff,#8b5cf6)}
  .vthumb.h3{background:linear-gradient(135deg,#4f46e5,#0e1020)}
  .vthumb.h4{background:linear-gradient(135deg,#7c3aed,#4f46e5)}
  .vthumb.locked{background:linear-gradient(135deg,#94a3b8,#64748b);cursor:default}
  .vthumb-play{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.92);color:#4f46e5;display:flex;align-items:center;justify-content:center;font-size:23px;padding-left:4px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .vthumb-cap{position:absolute;left:0;right:0;bottom:0;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff}
  .vthumb-num{font-size:11px;opacity:.85;font-weight:700}
  .vthumb-title{font-size:15px;font-weight:700;line-height:1.2;margin-top:2px}
  .vthumb-badge{font-size:11.5px;color:#dcdcf7;margin-top:6px;font-weight:600}
  .vthumb-done{position:absolute;top:10px;right:10px;background:#16a34a;color:#fff;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;z-index:2}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--muted);cursor:pointer;font-weight:600}
  .tab .e{font-size:20px;filter:grayscale(1);opacity:.72}
  .tab.on{color:var(--indigo)}.tab.on .e{filter:none;opacity:1}
  .pop{animation:slideUp .38s ease both}
  @keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .bob{display:inline-block;animation:bob 1.9s ease-in-out infinite}
  @keyframes bob{0%,55%,100%{transform:translateY(0)}25%{transform:translateY(-4px)}}
  .xppop{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:#16a34a;color:#fff;font-weight:800;font-size:15px;padding:10px 18px;border-radius:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:xpFly 1.3s ease forwards;pointer-events:none}
  @keyframes xpFly{0%{opacity:0;transform:translateX(-50%) translateY(8px) scale(.9)}18%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-24px)}}
  #onboard{position:absolute;inset:0;z-index:50;background:linear-gradient(160deg,#3730a3,#4f46e5);display:flex;align-items:center;justify-content:center;padding:26px}
  .ob-card{background:#fff;border-radius:22px;padding:28px 22px 22px;text-align:center;max-width:320px;width:100%}
  .ob-emoji{font-size:52px;margin-bottom:8px}
  .ob-title{font-size:20px;font-weight:800;color:var(--ink);margin-bottom:8px}
  .ob-text{font-size:14px;color:#4a4f60;line-height:1.5;margin-bottom:18px}
  .ob-dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
  .ob-dots span{width:7px;height:7px;border-radius:50%;background:#d7dbe6;transition:all .2s}
  .ob-dots span.on{background:var(--indigo);width:20px;border-radius:4px}
  .ob-skip{margin-top:12px;color:var(--muted);font-size:13px;cursor:pointer}
  #splash{position:absolute;inset:0;z-index:70;background:linear-gradient(160deg,#3730a3,#4f46e5 58%,#6d63ff);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;cursor:pointer;transition:opacity .45s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .brand{color:rgba(255,255,255,.8);font-size:13px;font-weight:800;letter-spacing:4px;margin-bottom:26px}
  #splash .cm{color:#fff;font-size:38px;font-weight:800;letter-spacing:-.8px;line-height:1.04}
  #splash .tag{color:#dcdcf7;font-size:14px;margin-top:16px}
  #splash .arrow{margin-top:38px;color:#fff;background:rgba(255,255,255,.16);border-radius:14px;padding:14px 30px;font-size:15px;font-weight:700}
  #auth{position:absolute;inset:0;z-index:80;background:linear-gradient(160deg,#3730a3,#4f46e5 58%,#6d63ff);display:none;align-items:center;justify-content:center;padding:26px}
  .auth-card{background:#fff;border-radius:22px;padding:26px 22px;width:100%;max-width:340px}
  .auth-brand{color:var(--indigo);font-size:13px;font-weight:800;letter-spacing:4px;text-align:center;margin-bottom:10px}
  .auth-t{font-size:20px;font-weight:800;color:var(--ink);text-align:center;margin-bottom:18px}
  .auth-card input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:16px;margin-bottom:10px;background:#fff}
  .auth-err{font-size:12.5px;color:#dc2626;min-height:16px;margin-bottom:6px;text-align:center}
  .auth-switch{text-align:center;margin-top:14px;color:var(--indigo);font-size:13px;font-weight:600;cursor:pointer}
  .auth-card select{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:16px;margin-bottom:10px;background:#fff;color:var(--ink)}
  .ob-photo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px}
  .ob-av{width:84px;height:84px;border-radius:50%;background:#eef0ff;display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid var(--line);overflow:hidden}
  .ob-pick{color:var(--indigo);font-size:13px;font-weight:600;cursor:pointer}
  .acctiers{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  /* --- Briques portées (check-in, journal, ressources, coach) --- */
  .moodrow{display:flex;gap:6px;margin-top:10px}
  .moodb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 3px;cursor:pointer;min-height:44px}
  .moodb .moode{font-size:22px;line-height:1}.moodb .ml{font-size:10.5px;color:var(--ink);opacity:.75;line-height:1.15;text-align:center;font-weight:600}
  .moodb.on{border-color:var(--indigo);background:#eef0ff}.moodb.on .ml{color:var(--indigo);font-weight:700}
  .jinp{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;background:#fff;font-family:inherit}
  textarea.jinp{resize:vertical}
  .jres{display:flex;gap:6px}.jresb{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 4px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;min-height:44px}
  .jresb.on{border-color:var(--rc);color:var(--rc);background:color-mix(in srgb,var(--rc) 10%,#fff)}
  .jtags{display:flex;flex-wrap:wrap;gap:6px}.jtag{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 11px;font-size:12px;color:var(--muted);cursor:pointer}
  .jtag.on{border-color:var(--indigo);background:#eef0ff;color:var(--indigo);font-weight:700}
  .jbadge{display:inline-block;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;margin-right:5px;margin-top:3px}

/* ===== Supabase : si configuré -> vraie app (auth + backend), sinon -> démo localStorage ===== */
const SUPA_URL='https://rkbvnploxblebwprzvdg.supabase.co'; const SUPA_ANON='sb_publishable_3pFq-QH1oD9Oi0ziqvWMJw_0X77pr74';   /* clé publishable = publique, RLS protège */
const isSupa = !!(SUPA_URL && SUPA_ANON && window.supabase);
const sb = isSupa ? window.supabase.createClient(SUPA_URL, SUPA_ANON) : null;
let syncT=null;
function syncRemote(){ if(!isSupa||!sb._uid) return; clearTimeout(syncT); syncT=setTimeout(function(){
  sb.from('profiles').update({ app_progress:{done:ST.done,quiz:ST.quiz,gestes:ST.gestes,exoDone:ST.exoDone,assist:ST.assist,rdv:ST.rdv,seen:ST.seen,levelForce:ST.levelForce,lastDay:ST.lastDay}, streak:ST.streak }).eq('id',sb._uid).then(function(){},function(){});
},800); }
async function loadUserData(){
  var u=(await sb.auth.getUser()).data.user; if(!u) return; sb._uid=u.id;
  var r=await sb.from('profiles').select('*').eq('id',u.id).single(); var prof=r.data;
  if(prof){
    if(typeof prof.streak==='number') ST.streak=prof.streak;
    if(prof.positioning && Object.keys(prof.positioning).length){ ST.diagAns=prof.positioning; try{ST.diag=computeDiag(prof.positioning);ST.diagDone=true;}catch(e){} }
    if(prof.app_progress) Object.keys(prof.app_progress).forEach(function(k){ ST[k]=prof.app_progress[k]; });
    window._fn=prof.first_name||'';
    window._ln=prof.last_name||'';
    window._onbDone=!!prof.onboarding_done;
    ST.coach = prof.role==='coach';
    var ob=prof.onboarding||{};
    if(ob.avatar_url){ST.avatar=ob.avatar_url;window._avatar=ob.avatar_url;}
    window._sector=ob.sector||''; window._sectorOther=ob.sectorOther||'';
  }
  /* Porte d'accès : le coach passe toujours ; sinon il faut un grant actif (payé ou accordé). Fail-closed. */
  window._access = ST.coach; window._tier = ST.coach?'immersion':'academie';
  if(!ST.coach && u.email){
    var _em=u.email.toLowerCase();
    var ag=await sb.from('access_grants').select('active,tier').eq('email',_em).maybeSingle();
    if(ag.error){var _c=ag.error.code;window._access=(_c==='42P01'||_c==='PGRST205'||_c==='PGRST202');}
    else{window._access=!!(ag.data&&ag.data.active);if(ag.data&&ag.data.tier)window._tier=ag.data.tier;}
  }
  var rb=await sb.from('bilans').select('*').eq('user_id',u.id).order('taken_at');
  if(rb.data) ST.bilans=rb.data.map(function(b){return {t:new Date(b.taken_at).getTime(),d:b.decouverte,o:b.objections,c:b.closing,m:b.calme};});
  /* ressources partagées (tous) */
  try{ var rr=await sb.from('resources').select('id,title,description,icon,url,sort').order('sort'); if(rr.data) ST.resources=rr.data; }catch(e){}
  if(ST.coach){
    /* Vue coach : inscrits + agrégats humeur/journal + statut d'accès croisé */
    var rs=await sb.from('profiles').select('id,first_name,email,streak,role,created_at').eq('role','eleve');
    var students=(rs.data||[]).map(function(s){return {id:s.id,first_name:s.first_name,email:(s.email||''),streak:s.streak,created_at:s.created_at,lastMood:null,lastMoodDay:'',journalCount:0,hasAccess:false,tier:null};});
    var byId={},byEmail={}; students.forEach(function(s){byId[s.id]=s;if(s.email)byEmail[s.email.toLowerCase()]=s;});
    var ac=await sb.from('checkins').select('user_id,day,mood');
    (ac.data||[]).forEach(function(c){var s=byId[c.user_id];if(s&&(!s.lastMoodDay||c.day>s.lastMoodDay)){s.lastMoodDay=c.day;s.lastMood=c.mood;}});
    var aj=await sb.from('journal_entries').select('user_id,occurred_at');
    (aj.data||[]).forEach(function(j){var s=byId[j.user_id];if(s)s.journalCount++;});
    var ag=await sb.from('access_grants').select('email,active,tier');
    (ag.data||[]).forEach(function(g){var s=byEmail[(g.email||'').toLowerCase()];if(s){s.hasAccess=!!g.active;s.tier=g.tier||'academie';}});
    ST.students=students;
  }else{
    /* Vue élève : son journal + ses check-ins */
    var rj=await sb.from('journal_entries').select('*').eq('user_id',u.id).order('occurred_at',{ascending:false});
    if(rj.data) ST.journal=rj.data;
    var rc=await sb.from('checkins').select('day,mood').eq('user_id',u.id);
    if(rc.data){ST.checkins={};rc.data.forEach(function(c){ST.checkins[c.day]=c.mood;});}
  }
  save();
}
const KEY='persua_app_v1';
let ST=JSON.parse(localStorage.getItem(KEY)||'{}');
ST.done=ST.done||{}; ST.quiz=ST.quiz||{}; ST.gestes=ST.gestes||{}; ST.test=ST.test||false; ST.posts=ST.posts||[]; ST.eleve=ST.eleve||false; ST.bilans=ST.bilans||[]; ST.assist=ST.assist||{}; ST.rdv=ST.rdv||{}; ST.seen=ST.seen||false; ST.diagAns=ST.diagAns||{}; ST.diag=ST.diag||null; ST.diagDone=ST.diagDone||false; ST.streak=ST.streak||0; ST.lastDay=ST.lastDay||0; ST.exoDone=ST.exoDone||{};
ST.checkins=ST.checkins||{}; ST.journal=ST.journal||[]; ST.resources=ST.resources||[]; ST.coach=ST.coach||false; ST.students=ST.students||[];
function save(){localStorage.setItem(KEY,JSON.stringify(ST));if(isSupa)syncRemote();}
/* Par défaut tout est ouvert (toi, aucun réglage). Le lien partagé à la communauté finit par #eleve : il active le mode élève (déblocage par niveau). #open pour revenir en accès complet. */
(function(){var h=(location.hash+location.search).toLowerCase();if(h.indexOf('eleve')>=0||h.indexOf('student')>=0){ST.eleve=true;save();}if(h.indexOf('open')>=0||h.indexOf('admin')>=0){ST.eleve=false;save();}if(h.indexOf('boost')>=0){ST.streak=367;ST.lastDay=Math.floor(Date.now()/86400000);ST.levelForce=327;ST.eleve=false;save();}})();

/* Contenu réel de la formation (vidéos + quiz) injecté depuis l'espace membre */
const COURSE = [{"id": "m1", "num": "Module 1", "icon": "🧠", "title": "Les fondements neuro-comportementaux", "subtitle": "Comment le cerveau de l'acheteur (et le tien) décide vraiment", "gated": true, "videos": [{"id": "m1v1", "num": "Vidéo 1", "title": "Les 3 cerveaux", "videoUrl": "https://www.skool.com/persua-7488/classroom/7d5cfb37?md=23fbfa2063c04aa7b5e1ebaac868a0e0"}, {"id": "m1v2", "num": "Vidéo 2", "title": "Comment une décision d'achat se forme", "videoUrl": "https://www.skool.com/persua-7488/classroom/7d5cfb37?md=87e724a52edf48ceadd07726fb42c204"}, {"id": "m1v3", "num": "Vidéo 3", "title": "Le rôle de l'amygdale : émotion avant raison", "videoUrl": "https://www.skool.com/persua-7488/classroom/7d5cfb37?md=e3fdd6106af34293a5632c66201c4d29"}, {"id": "m1v4", "num": "Vidéo 4", "title": "Neurotransmetteurs clés : dopamine, sérotonine, cortisol", "videoUrl": "https://www.skool.com/persua-7488/classroom/7d5cfb37?md=e5ebbc473d404e6e86a4f57a254487a7"}, {"id": "m1v5", "num": "Vidéo 5", "title": "Le cerveau du vendeur : stress, performance, flow", "videoUrl": "https://www.skool.com/persua-7488/classroom/7d5cfb37?md=d5f6c04455de4a35a02bed65efd86b66"}, {"id": "m1f1", "num": "Fiche", "title": "Fiche neuro : à lire et garder", "type": "fiche", "fiche": "<p class=\"lead\">Ton prospect ne réagit pas à la réalité. Il réagit à ce que son cerveau avait prédit une fraction de seconde avant. Comprends ça, et tu arrêtes de vendre des bénéfices dans le vide.<\/p><h4>Le cerveau devine, il ne reçoit pas<\/h4><p>Le cerveau ne réceptionne pas l'information, il la prédit, puis il compare à la réalité. Si ça colle, il ne dépense rien. Si ça cloche, il corrige, et ça lui coûte de l'énergie. Son obsession : minimiser la surprise.<\/p><ul><li>Tu descends un escalier sans regarder. Une marche en trop que tu n'avais pas prévue, et tu titubes : erreur de prédiction.<\/li><li>Ton frigo fait du bruit, puis tu ne l'entends plus. Le bruit n'a pas changé, ta prédiction l'a classé inutile.<\/li><li>Tu lis un texte plein de fautes sans les voir. Ton cerveau lit ce qu'il a prédit, pas les lettres.<\/li><\/ul><h4>En vente, ça change tout<\/h4><p>Il n'achète pas ce qui lui ferait le plus plaisir, il achète ce qu'il peut prédire. Le même vin annoncé à 90 euros a vraiment meilleur goût qu'à 10 euros : le cortex orbitofrontal s'active plus fort. Le McDo noté 3,6 gagne contre le resto inconnu noté 4,5, parce qu'on sait exactement ce qu'on va manger.<\/p><h4>Sur le terrain<\/h4><p>Avant de gonfler tes promesses, réduis l'incertitude. Rends le résultat concret et prévisible : un cas client chiffré, une étape test, un livrable visible. Un cerveau qui peut prédire ton résultat passe à l'action.<\/p>"}], "quiz": [{"q": "Fin de RDV. Ton prospect, souriant depuis le début, te dit : \"Envoyez-moi la plaquette, je vais réfléchir.\" Ton offre était solide, ta logique imparable. Quelle est la lecture la plus probable ?", "o": ["Son néocortex manque de preuves : envoie une plaquette plus complète avec un comparatif chiffré", "C'est une objection de fin de cycle : son limbique a dit oui, sa raison cherche juste à confirmer", "Tu as parlé au mauvais cerveau : l'émotion n'a jamais été allumée, la logique seule ne signe pas", "Il te compare à un concurrent : relance-le vite avec un avantage exclusif"], "a": 2}, {"q": "5e minute de RDV. Tu n'as pas encore parlé de son problème que ton prospect attaque : \"De toute façon, c'est trop cher ces trucs-là.\" Que t'indique le MOMENT de cette objection ?", "o": ["Un vrai blocage : elle arrive avant l'émotion, reviens à la sécurité et au ressenti, pas aux chiffres", "Un bon signe : sa raison teste ton offre parce que son limbique a déjà dit oui", "Qu'il faut la traiter immédiatement avec ton argumentaire ROI avant qu'elle s'installe", "Qu'il te teste : ignore-la poliment et continue ton déroulé pour montrer ta solidité"], "a": 0}, {"q": "Tu veux placer la question \"Imaginez dans 6 mois si c'était réglé...\". D'après le module, quand la poser et pourquoi ?", "o": ["En fin d'entretien, pour créer l'élan émotionnel juste avant de closer", "Dès les premières secondes, pour capter l'attention avant que les objections arrivent", "Après tes preuves et références, pour que la projection soit crédible aux yeux du néocortex", "Au milieu de l'entretien : la dopamine sert à créer le désir, pas à closer"], "a": 3}, {"q": "Ton prospect enchaîne les questions pointues d'un ton sec, presque pour te piéger. Quelle lecture neurochimique et quelle réponse ?", "o": ["Son cortisol est trop haut : propose de reporter le rendez-vous à un moment plus calme", "Sa sérotonine n'est pas activée : valorise sincèrement ses questions pour passer du test à la coopération", "Sa dopamine est lancée : il chasse l'information, accélère vers la démonstration", "Son néocortex a pris la main : réponds point par point avec tes chiffres les plus solides"], "a": 1}, {"q": "Pour débloquer une signature qui traîne, tu annonces : \"Attention, l'offre se termine vendredi.\" Que prédit le module ?", "o": ["Pic de cortisol : menace perçue, mode survie, il reporte ou il fuit", "Pic de dopamine : l'anticipation de perdre l'offre déclenche enfin le désir d'agir", "Ça fonctionne si son limbique a déjà dit oui : l'urgence aide juste sa raison à trancher", "Ça fonctionne uniquement si l'échéance est réelle et vérifiable par le prospect"], "a": 0}, {"q": "RDV de 20 minutes avec un dirigeant pressé qui t'annonce d'entrée : \"Allez droit au but.\" Que fais-tu des 90 premières secondes ?", "o": ["Tu obéis : pitch direct, il vient de te donner la permission de sauter l'échauffement", "Tu ouvres avec ton chiffre le plus fort pour marquer son néocortex tout de suite", "Tu vas vite mais dans le bon ordre : une phrase sur sa réalité, la pression retirée, l'alarme d'abord", "Tu prends quand même 5 minutes de small talk : sans lien humain, rien ne passe"], "a": 2}, {"q": "Ton prospect doute. Tu hésites entre sortir ton tableau comparatif ou raconter l'histoire d'un client dans sa situation. Pourquoi le module tranche pour l'histoire ?", "o": ["Parce qu'une histoire est une preuve sociale qui rassure le néocortex mieux qu'un tableau", "Parce que le limbique travaille par association : elle déclenche une reconnaissance émotionnelle, pas une preuve", "Parce qu'elle t'évite le débat de chiffres, terrain où un concurrent sera toujours meilleur", "Parce que comparer des offres réveille trop tôt les objections du néocortex"], "a": 1}, {"q": "Ce contrat peut sauver ton trimestre. En plein RDV, tu t'entends réciter ton pitch sans vraiment écouter les réponses. Que se passe-t-il et que fais-tu ?", "o": ["Manque de préparation : réapprends ton argumentaire pour le dérouler sans y penser", "C'est le trac normal du vendeur, il disparaîtra avec l'expérience, continue", "Baisse l'enjeu mentalement en te répétant que ce contrat n'a pas d'importance", "Cortisol : ton accès au cortex préfrontal se réduit, réancre-toi avec une question ouverte et de l'écoute réelle"], "a": 3}, {"q": "Démarrage raté : tu sens ton prospect fermé dès les premières minutes. Ensuite, chacun de tes arguments, même excellent, rebondit sans effet. Pourquoi ?", "o": ["Biais de confirmation émotionnelle : le verdict de son amygdale teinte tout, tes arguments sont lus à charge", "Tes arguments sont trop faibles pour ce profil : il en faut de plus percutants", "Son néocortex a déjà choisi un concurrent : tu joues la roue de secours", "Il manque de dopamine : place une projection à 6 mois pour rallumer le désir"], "a": 0}, {"q": "Après ta relance insistante, ton prospect jusque-là plutôt ouvert se met à enchaîner les objections en rafale. Que lis-tu ?", "o": ["Sa raison confirme un oui émotionnel : traite chaque objection une par une, tu es proche de signer", "Le \"combattre\" du fight-or-flight : ta pression a activé son amygdale, retire-la explicitement", "Il entre en négociation : c'est le moment de lâcher une concession pour conclure", "Il a un profil analytique : donne-lui plus de données techniques pour le nourrir"], "a": 1}, {"q": "En fin d'échange, ton prospect lâche : \"Je ne sais pas pourquoi, mais je le sens bien.\" D'après Damasio, que se passe-t-il ?", "o": ["Méfiance : une décision sans justification logique se rétracte, verrouille avec un récap chiffré", "C'est de l'intuition, agréable mais sans valeur : attends la validation rationnelle avant de te réjouir", "Le marqueur somatique : cette sensation physique précède le choix, la décision est en train de se prendre", "C'est sa dopamine qui parle : attention, l'anticipation retombe vite après le rendez-vous"], "a": 2}, {"q": "Pourquoi le module s'appuie-t-il sur les travaux de Damasio pour affirmer que la logique seule ne fait jamais signer ?", "o": ["Parce que les émotions sont traitées deux fois plus vite que la logique", "Parce que trop de logique fatigue le cerveau et le pousse à reporter", "Parce que les acheteurs cachent leurs vraies motivations derrière des arguments rationnels", "Parce que sans accès aux émotions, on ne décide plus rien, même le plus simple"], "a": 3}, {"q": "Avant un RDV décisif, tu fixes ton intention. Laquelle met ton cerveau dans les conditions du flow d'après le module ?", "o": ["\"Signer aujourd'hui\" : un objectif ambitieux mobilise toutes tes ressources", "\"Comprendre son vrai problème en 15 minutes\" : précis et comportemental", "\"Réussir la vente\" : clair, simple et orienté résultat", "\"Rester calme quoi qu'il arrive\" : la gestion du stress avant tout"], "a": 1}, {"q": "Dès la 2e minute, ton prospect te demande : \"Montrez-moi ce que vous proposez.\" Tu déroules ta présentation... et il se referme. Qu'enseigne le module ?", "o": ["Tu as présenté trop tôt : son reptilien évaluait encore, il lui fallait 3 à 5 minutes de sécurité", "Ta présentation ciblait mal son secteur : personnalise davantage tes supports", "Il a demandé, tu as bien fait : c'est le contenu qui a péché, pas le moment", "Il fallait ouvrir par le limbique : une histoire émotionnelle avant toute chose"], "a": 0}, {"q": "RDV très agréable, rires, excellent contact... et aucune signature. D'après la vidéo sur les neurotransmetteurs, qu'est-ce qui a probablement manqué ?", "o": ["La sérotonine : malgré l'ambiance, il ne s'est pas senti assez respecté dans son statut", "Un peu de cortisol : une tension saine pousse à décider, trop de confort endort", "La dopamine : sans projection, aucune anticipation, donc aucun désir d'agir", "Le néocortex : il manquait les preuves et les chiffres pour justifier l'achat"], "a": 2}, {"q": "Ton prospect adore ton offre, il est convaincu qu'elle l'aiderait, et pourtant il n'achète pas. Selon le fonctionnement prédictif du cerveau, la cause la plus probable ?", "o": ["Tu n'as pas assez projeté le plaisir futur qu'il va ressentir", "Son cerveau ne peut pas prédire le résultat : l'incertitude est trop haute, il reste sur ce qu'il connaît", "Ton prix est trop élevé pour lui", "Il ne t'a pas assez vu, il manque de preuve sociale"], "a": 1}, {"q": "Deux groupes goûtent exactement le même vin, l'un annoncé à 10 euros, l'autre à 90 euros. Que montre l'imagerie cérébrale ?", "o": ["Aucune différence réelle, c'est juste un biais de langage", "Le cerveau du groupe 90 euros active vraiment plus les zones du plaisir : le vin lui semble meilleur", "Le groupe 10 euros trouve le vin meilleur car il est détendu", "Les deux groupes notent le vin à l'identique"], "a": 1}]}, {"id": "m2", "num": "Module 2", "icon": "🧲", "title": "L'infiltration subconsciente", "subtitle": "La psychologie de l'acheteur : 95% des décisions sont émotionnelles", "gated": true, "videos": [{"id": "m2v1", "num": "Vidéo 1", "title": "Conscient vs inconscient : 95% des décisions sont émotionnelles", "videoUrl": "https://www.skool.com/persua-7488/classroom/6764bdd0?md=bf2e7e7ab0b64170ac13943f04e8fc05"}, {"id": "m2v2", "num": "Vidéo 2", "title": "Les 6 principes d'influence de Cialdini appliqués à la vente", "videoUrl": "https://www.skool.com/persua-7488/classroom/6764bdd0?md=dee5b0f6dcff4aef8490852dd2d1fb5d"}, {"id": "m2v3", "num": "Vidéo 3", "title": "Les biais cognitifs qui déclenchent l'achat", "videoUrl": "https://www.skool.com/persua-7488/classroom/6764bdd0?md=d2b64bb952e7416cb58cc66aa581d59f"}, {"id": "m2v4", "num": "Vidéo 4", "title": "Profils psychologiques clients : DISC et personnalités d'achat", "videoUrl": "https://www.skool.com/persua-7488/classroom/6764bdd0?md=3792c5db40534dafbde111afe5333fd9"}, {"id": "m2v5", "num": "Vidéo 5", "title": "Douleur vs plaisir : la vraie mécanique de motivation", "videoUrl": "https://www.skool.com/persua-7488/classroom/6764bdd0?md=7297dec26679439ea209cf2b418b6fa0"}, {"id": "m2v6", "num": "Vidéo 6", "title": "Les heuristiques : raccourcis mentaux et décision rapide", "videoUrl": "https://www.skool.com/persua-7488/classroom/6764bdd0?md=822f215d8a5b47f6a423e014ccefa852"}, {"id": "m2f1", "num": "Fiche", "title": "Fiche neuro : à lire et garder", "type": "fiche", "fiche": "<p class=\"lead\">Chaque profil a une peur au volant. Tu ne la vois pas, mais c'est elle qui freine ou qui signe. Repère-la en dix minutes, désamorce-la avec la bonne phrase.<\/p><h4>Les 4 peurs qui pilotent l'achat<\/h4><ul><li><b>Rouge (dominant)<\/b> : peur de l'échec. Rends-lui le contrôle, va au résultat : \"c'est vous qui décidez\".<\/li><li><b>Jaune (influent)<\/b> : peur du rejet. Valorise-le, mets-le en avant, garde de la relation.<\/li><li><b>Vert (stable)<\/b> : peur du changement. Rassure sur la continuité et le suivi, ne le bouscule jamais.<\/li><li><b>Bleu (consciencieux)<\/b> : peur de mal faire. Apporte des preuves et des chiffres. Ne dis jamais \"pas de problème\" : le cerveau ne traite pas la négation.<\/li><\/ul><h4>Détecter vite : écoute sa question<\/h4><p>\"C'est quoi le résultat concret ?\" = rouge. \"Qui d'autre l'a fait ?\" = jaune. \"Comment vous allez nous accompagner ?\" = vert. \"Quelles données le prouvent ?\" = bleu.<\/p><h4>La règle de platine<\/h4><p>Communique avec l'autre comme LUI a besoin, pas comme toi tu as besoin. La plupart se plantent là : ils vendent dans leur propre couleur.<\/p><h4>Sur le terrain<\/h4><p>Avant ton prochain RDV, note la couleur probable et sa peur. Prépare une phrase qui la désamorce.<\/p>"}], "quiz": [{"q": "Ton prospect le plus cartésien arrive en RDV avec son cahier des charges de 40 pages et exige un comparatif chiffré ligne par ligne. Que se passe-t-il réellement dans sa tête au moment de décider ?", "o": ["C'est un profil purement rationnel : le comparatif le plus rigoureux emportera la décision", "Les chiffres ne servent à rien avec lui : mets le cahier des charges de côté et parle uniquement émotion", "Son Système 2 épluchera tes chiffres, mais il ne fera que rationaliser ce que son Système 1 aura déjà décidé", "Son conscient traite 11 millions de bits par seconde : plus tu lui donnes de données, mieux il décidera"], "a": 2}, {"q": "Fin de RDV sur une décision complexe à multiples critères. Ton prospect te dit : « Je ne tranche pas maintenant, je vous reviens lundi. » D'après l'expérience Dijksterhuis, quelle est la bonne lecture ?", "o": ["Sur un choix complexe, l'inconscient qui travaille décide mieux : ce délai peut jouer pour toi si son Système 1 a capté les bons signaux", "Un choix complexe exige de la réflexion consciente : envoie-lui un dossier comparatif complet à éplucher ce week-end", "C'est une objection déguisée : verrouille un engagement avant qu'il quitte la salle", "Plus il attend, plus le statu quo le ramènera à l'état actuel : pousse une décision à chaud"], "a": 0}, {"q": "Il te reste réellement deux places dans ta prochaine session de formation. Comment utiliser cette rareté selon Cialdini ?", "o": ["Rappelle-la à chaque relance pour maintenir la tension jusqu'à la signature", "N'en parle pas : évoquer la rareté revient à mettre la pression, et le cerveau s'en méfie", "Garde l'info pour le closing et sors-la au moment où il hésite, pour déclencher la décision", "Dis la contrainte une seule fois, vraie et précise, sans pression"], "a": 3}, {"q": "Premier RDV avec un dirigeant que tu veux convaincre de ton expertise. Comment installes-tu ton autorité selon Cialdini ?", "o": ["Ouvre sur ton parcours, tes certifications et tes années d'expérience pour cadrer ta légitimité", "Arrive avec une insight sur son secteur et nomme ses problèmes avant lui par tes questions", "Cite d'entrée tes 200 clients pour asseoir ta crédibilité", "Commence par un compliment sincère pour créer la sympathie, l'autorité suivra naturellement"], "a": 1}, {"q": "Ton prospect, une PME de 25 personnes, hésite. Tu as en références deux grands groupes prestigieux et trois PME de sa taille dans son secteur. Que mets-tu en avant ?", "o": ["Les trois PME similaires : la similitude démultiplie l'effet de la preuve sociale", "Les grands groupes : leur prestige rassure et tire la perception vers le haut", "Le volume total de tes clients, pour montrer la solidité de ta structure", "Les grands groupes d'abord pour impressionner, puis les PME pour la proximité"], "a": 0}, {"q": "Depuis le début du RDV, ton prospect revient sur le prix sans raison apparente, alors que tu n'as même pas fini de présenter. Quelle lecture et quelle action ?", "o": ["Il teste ta solidité : tiens ton prix ferme et ne bouge pas d'un euro", "Le prix dépasse réellement son budget : propose une version allégée de l'offre", "Il est ancré sur un chiffre entendu ailleurs : demande par rapport à quoi il compare", "Sa douleur n'est pas assez conscientisée : repars sur le coût de l'inaction à 12 mois"], "a": 2}, {"q": "Tu dois présenter une offre à 18 000€ par an. Comment structures-tu l'annonce d'après l'effet de cadrage ?", "o": ["Annonce 18 000€ dès l'ouverture : poser l'ancre haute en premier joue pour toi", "Construis d'abord la valeur, puis présente l'investissement en petit format : 50€ par jour", "Donne les deux formats, 50€ par jour et 18 000€ par an, par souci de transparence", "Annonce le prix avec une remise de lancement pour adoucir la première impression"], "a": 1}, {"q": "Ton prospect lâche : « On a déjà essayé un truc comme ça, ça n'a pas marché. » Que fais-tu ?", "o": ["Tu démontres point par point en quoi ta solution est différente de ce qu'il a testé", "Tu sors une référence client de son secteur pour contrebalancer son expérience", "Tu acquiesces et tu passes au point suivant pour ne pas cristalliser le blocage", "Tu explores ce qui a échoué : combattre la croyance de front ne ferait que la renforcer"], "a": 3}, {"q": "RDV chaleureux, aucun désaccord exprimé, et en partant ton prospect te dit : « Je vais en parler à mon associé. » Quelle lecture DISC ?", "o": ["Profil S : ce peut être un non qu'il n'ose pas dire ; ralentis, rassure sur l'accompagnement, ne force jamais", "Profil I : son enthousiasme va retomber, décroche un engagement avant qu'il sorte", "Bon signal d'engagement : propose de rencontrer l'associé et fixe une date de closing ferme", "Profil C : il lui manque des preuves, envoie un dossier chiffré à transmettre à l'associé"], "a": 0}, {"q": "Face à un prospect silencieux qui analyse chacun de tes supports, tu sèches sur une question technique pointue. Que fais-tu ?", "o": ["Tu donnes une réponse approximative mais assurée : montrer une hésitation détruirait ton autorité", "Tu réchauffes l'échange avec une histoire client vivante pour sortir du registre technique", "Tu dis que tu ne sais pas et que tu reviendras avec la réponse exacte : l'approximation détruit la confiance d'un C", "Tu prends son silence pour du désintérêt et tu requalifies son besoin"], "a": 2}, {"q": "Prospect expansif, plein de projets de croissance. Tu déroules tes questions sur le coût de l'inaction et tu le sens se refermer. Pourquoi ?", "o": ["Sa douleur est latente : insiste, la douleur est neurologiquement plus puissante que le plaisir", "C'est un profil tourné vers l'opportunité : le discours douleur le ferme, bascule sur une vision inspirante qui active la dopamine", "Biais de confirmation : il protège une croyance, demande-lui d'où vient sa réaction", "Tu as touché juste : ce recul montre qu'il conscientise enfin le problème"], "a": 1}, {"q": "« Oui, c'est un vrai sujet, on en parle souvent en interne. Mais là, on a d'autres priorités. » À quel niveau de douleur est ce prospect, et que fais-tu ?", "o": ["Niveau 2, consciente : il ne signera pas en l'état, aide-le à mesurer l'impact réel avec la question des 12 mois", "Niveau 3, active : il en parle, donc il cherche une solution, envoie ta proposition", "Niveau 1, latente : le problème n'est pas conscientisé, repars de zéro en découverte", "C'est du statu quo : découpe le changement en dix petits pas rassurants"], "a": 0}, {"q": "Tu prépares une soutenance devant un comité de décision. Tu as une étude statistique robuste et une belle histoire client. D'après l'heuristique de disponibilité, que mets-tu en avant ?", "o": ["L'étude statistique : un comité décide collectivement, donc rationnellement", "Les chiffres d'abord pour l'autorité, l'histoire ensuite en illustration secondaire", "La moyenne de tes résultats clients, pour rester strictement factuel", "L'histoire client en récit court, avant, déclic, après : elle pèsera plus que la statistique"], "a": 3}, {"q": "Pour faciliter l'entrée de nouveaux clients, tu envisages une remise de 30% sur ta prochaine offre. Bonne idée ?", "o": ["Oui, si tu la limites dans le temps : tu actives la rareté en plus du prix attractif", "Non : sans valeur établie, un prix bas éveille la méfiance et un rabais confirme la médiocrité", "Oui : un premier prix réduit crée un petit oui qui engage pour la suite", "Oui, en version essai : le prospect touche la solution et l'effet de dotation fait le reste"], "a": 1}, {"q": "Quel appariement entre moteur de motivation et neurochimie est exact ?", "o": ["Approche : cortisol, le carburant du désir ; évitement : dopamine, l'alarme de survie", "Approche : adrénaline ; évitement : dopamine et cortisol", "Approche : dopamine, moteur du désir ; évitement : cortisol et adrénaline, moteur de la survie", "Les deux systèmes produisent de la dopamine, à des doses différentes"], "a": 2}, {"q": "Un prospect ouvre le RDV : \"Concrètement ça donne quoi, et en combien de temps ? Je vous ai réservé 20 minutes.\" Quel profil, et quel réflexe ?", "o": ["Jaune : raconte-lui une belle histoire d'un autre client", "Rouge (peur de l'échec) : va droit au résultat et au ROI, respecte ses 20 minutes", "Vert : prends le temps de créer du lien avant tout", "Bleu : sors immédiatement un tableau de données exhaustif"], "a": 1}, {"q": "Un profil vert (stable) hésite en fin de RDV. Sa peur dominante et ton geste ?", "o": ["Peur de l'échec : rends-lui le contrôle", "Peur du changement : rassure sur la continuité et le suivi, ne le bouscule pas", "Peur du rejet : mets-le en avant devant les autres", "Peur de mal faire : accumule les preuves techniques"], "a": 1}, {"q": "Ton produit livre plus lentement qu'un concurrent, et le prospect le sait. La meilleure carte, façon anti-vente ?", "o": ["Le nier pour ne pas t'affaiblir", "L'esquiver et parler d'autre chose", "L'avouer d'emblée puis ramener sur sa vraie priorité", "Dire que le délai n'a aucune importance"], "a": 2}, {"q": "Gros RDV dans 10 jours avec un dirigeant. Le geste qui maximise le plus tes chances AVANT le rendez-vous ?", "o": ["Préparer un argumentaire produit béton", "Lui envoyer une analyse courte et personnalisée de sa situation, sans rien demander", "L'appeler pour confirmer l'heure", "Préparer une remise agressive"], "a": 1}]}, {"id": "m3", "num": "Module 3", "icon": "🎯", "title": "Communication persuasive", "subtitle": "Framing, reformulation, charge cognitive, non-verbal, voix", "gated": true, "videos": [{"id": "m3v1", "num": "Vidéo 1", "title": "Les mots qui activent le Système 1", "videoUrl": "https://www.skool.com/persua-7488/classroom/1e7d3b68?md=63d89f0fcc424999a2058ee2da55c111"}, {"id": "m3v2", "num": "Vidéo 2", "title": "Un storytelling efficace", "videoUrl": "https://www.skool.com/persua-7488/classroom/1e7d3b68?md=c0a9e678d7844f3ea2a5d2ee46cab40f"}, {"id": "m3v3", "num": "Vidéo 3", "title": "Le framing : mêmes faits, autre décision", "videoUrl": "https://www.skool.com/persua-7488/classroom/1e7d3b68?md=696462c068d24762bc1bc8a0fa4035d7"}, {"id": "m3v4", "num": "Vidéo 4", "title": "La reformulation : ses mots valent dix fois les tiens", "videoUrl": "https://www.skool.com/persua-7488/classroom/1e7d3b68?md=88eeac044d40446fb733d8b068bd0c2d"}, {"id": "m3v5", "num": "Vidéo 5", "title": "La charge cognitive : en dire moins pour vendre plus", "videoUrl": "https://www.skool.com/persua-7488/classroom/1e7d3b68?md=c64e270bf0544d3c8368d09104053df5"}, {"id": "m3v6", "num": "Vidéo 6", "title": "Le non-verbal : ton corps parle avant toi", "videoUrl": "https://www.skool.com/persua-7488/classroom/1e7d3b68?md=f29c1833c4154c50ace6896480f0a415"}, {"id": "m3v7", "num": "Vidéo 7", "title": "La voix et le silence", "videoUrl": "https://www.skool.com/persua-7488/classroom/1e7d3b68?md=9a92a8c3e41447c480b283ca9f75dced"}, {"id": "m3f1", "num": "Fiche", "title": "Fiche neuro : à lire et garder", "type": "fiche", "fiche": "<p class=\"lead\">Un bon vendeur parle moins de 30 pour cent du temps. Dans sa bouche, il n'y a que trois choses : des questions, des reformulations, des histoires. Le reste est du bruit.<\/p><h4>Tes 3 seuls outils<\/h4><ul><li><b>Questions<\/b> : elles gardent le prospect actif et te donnent la matière.<\/li><li><b>Reformulations<\/b> : il se sent compris, il baisse la garde.<\/li><li><b>Histoires<\/b> : un cas client parle à l'émotion et se retient. Un argument s'oublie.<\/li><\/ul><p>Ratio de référence : 80 pour cent d'écoute, 20 pour cent de parole.<\/p><h4>Ton pitch, dans le bon ordre<\/h4><p>Neuf pitchs sur dix commencent par \"qui je suis et mon entreprise\". C'est l'erreur, ça n'intéresse pas ton interlocuteur. Commence par la promesse, ce que tu apportes d'essentiel. Qui tu es vient en quatrième. Prépare trois formats : 15 secondes, 2 minutes, 20 minutes.<\/p><h4>Sur le terrain<\/h4><p>Prépare une histoire par objection récurrente. Quand elle arrive, tu ne débats pas, tu racontes, puis tu demandes : \"voyez-vous une raison pour que ça marche pour lui et pas pour vous ?\"<\/p>"}], "quiz": [{"q": "Tu ouvres ton rendez-vous par : \"Nous accompagnons les PME depuis 15 ans et nos process ont fait leurs preuves.\" Ton prospect hoche la tête poliment puis jette un œil à son téléphone. Que vient-il de se passer dans sa tête ?", "o": ["Son Système 2 a jugé l'argument trop léger : ajoute des références et des chiffres pour crédibiliser ton ancienneté", "Le message était trop simple pour un dirigeant : il attend un discours plus construit avant d'engager son attention", "Son Système 1 a décroché : tu parles de toi et en abstrait, or il ne traite vraiment que ce qui concerne le prospect", "Il manque un contraste avant/après, le seul format capable de tenir son attention au-delà de 30 secondes"], "a": 2}, {"q": "En plein pitch, tu glisses : \"Sur vos 10 derniers devis restés sans relance, combien ont fini par signer ?\" Ton prospect se redresse d'un coup. Quel mécanisme vient de jouer ?", "o": ["La surprise : son Système 1 détecte ce qui change, et un chiffre inattendu ou un paradoxe le réveille", "La question a forcé son Système 2 à faire un calcul rationnel, et c'est ce calcul qui a capté son attention", "Tu as activé son aversion à la perte : toute question sur des devis perdus déclenche l'alarme du cerveau", "Une question ouverte crée de la confiance : il se redresse parce qu'il se sent enfin écouté"], "a": 0}, {"q": "Tu déroules tes arguments chiffrés et ton prospect contre-argumente chaque point. Tu passes sur l'histoire d'un dirigeant qui lui ressemble, même blocage, et il se penche en avant pour connaître la suite. Pourquoi ce basculement ?", "o": ["Le cas client apporte la preuve concrète qui manquait à tes chiffres, et son Système 2 la juge plus crédible qu'une promesse", "L'histoire a simplifié la décision : tu as réduit la charge intrinsèque, donc son cerveau peut enfin comparer", "Les récits endorment la vigilance : son Système 2 s'est mis en veille, c'est le moment de closer", "Un argument, son Système 2 le filtre ; une histoire, son Système 1 la vit : projection et anticipation tiennent son attention"], "a": 3}, {"q": "Tu annonces : \"Avec nous, tu pourrais économiser 2 000 euros par mois.\" Le prospect sourit, note le chiffre et conclut par \"je vais réfléchir\". D'après la règle de distribution, où est l'erreur ?", "o": ["Le chiffre est trop rond pour être crédible : donne une fourchette précise, calculée avec lui pendant la découverte", "Cadre gain posé sur le statu quo : reformule en fuite, \"chaque mois sans solution, 2 000 euros partent\", une perte pèse presque deux fois plus lourd", "La peur devait porter sur ta solution : \"sans notre accompagnement, tu continueras de perdre\", c'est là que le cadre perte frappe le plus fort", "L'économie est bien cadrée, le problème vient d'ailleurs : il manquait un silence de cinq à huit secondes après le chiffre"], "a": 1}, {"q": "Ton associé te souffle : \"Gonfle un peu le coût de son problème, le cadre perte frappera plus fort.\" Que réponds-tu d'après le module ?", "o": ["Non : le framing change le cadre, jamais les faits, c'est la ligne entre influence et manipulation", "Oui, tant que tu restes sur le statu quo : c'est exactement là que le cadre perte est prévu par la règle de distribution", "Oui, si le prospect valide l'ordre de grandeur en séance : un chiffre accepté devient un signal interne, donc vrai pour lui", "Non : gonfle plutôt le gain de ta solution, exagérer une perte déclenche l'alarme et braque le Système 1"], "a": 0}, {"q": "Ton prospect lâche : \"Je perds mes ventes entre le premier rendez-vous et la relance, ça me bouffe.\" Tu réponds : \"OK, donc tu as un problème de pipe et de nurturing.\" Il se referme. Qu'est-ce qui vient de casser ?", "o": ["Tu as reformulé trop tôt : la reformulation se garde pour la synthèse de fin de rendez-vous", "Le jargon est trop technique pour lui : simplifie le vocabulaire et il se sentira à nouveau à l'aise", "Tu as sauté le niveau 2 : il fallait chiffrer le coût du problème avant de reformuler la situation", "Tu as traduit ses mots dans ta grille : tes mots sont un signal externe passé au scepticisme, il se sent plaqué, pas compris"], "a": 3}, {"q": "En fin de découverte, tu dis : \"Tu m'as dit que ça représentait deux ventes perdues par mois.\" Quel levier actives-tu exactement ?", "o": ["Le niveau 1 de la reformulation : tu reposes les faits de sa situation avec ses termes exacts", "L'affect labeling : tu mets un mot sur ce qu'il ressent et l'intensité redescend d'un cran", "Le niveau 2 : tu réactives l'aversion à la perte avec son propre calcul, pas le tien", "Le cadre perte du framing : c'est toi qui transformes son économie en fuite d'argent"], "a": 2}, {"q": "Rendez-vous tendu : ton prospect ressasse sa mauvaise expérience avec un prestataire précédent. Tu poses : \"J'ai l'impression que cette situation te frustre pas mal.\" Que va-t-il probablement se passer ?", "o": ["Risqué : pointer une émotion négative l'amplifie, mieux vaut recentrer vite la conversation sur du positif", "Sa frustration va baisser d'un cran sans qu'il décide de se calmer : une émotion nommée est une émotion qui se calme", "Ça ne marchera que s'il confirme l'émotion à voix haute : sinon ton mot reste un signal externe sans effet", "Tu viens d'utiliser le niveau 3 de la reformulation : il va se projeter dans le désir, la vie d'après"], "a": 1}, {"q": "Tu présentes trois offres avec options, un deck de vingt slides et tes meilleurs chiffres en rafale. Le prospect est attentif vingt minutes, puis conclut : \"Je vais réfléchir.\" Quel est le vrai diagnostic ?", "o": ["La décision était trop complexe en elle-même : la charge intrinsèque a dépassé son budget, tu ne pouvais rien y faire", "Il manquait de charge pertinente : ajoute un calcul de retour sur investissement pour l'aider à comparer", "Son Système 1 a pris le relais de la décision et il est parti comparer avec un concurrent moins cher", "Ta charge extrinsèque a saturé sa mémoire de travail : Système 2 disjoncté, retour à l'option par défaut, ne rien faire"], "a": 3}, {"q": "En découverte, tu enchaînes : \"Comment tu gères tes relances aujourd'hui, et d'ailleurs, qui décide du budget chez toi ?\" Il ne répond qu'à la question du budget. Pourquoi ?", "o": ["Deux questions enchaînées, et la première disparaît : sa mémoire de travail n'a gardé que la dernière", "La question du budget active son aversion à la perte : le cerveau traite toujours l'argent en priorité", "Il esquive la question des relances parce qu'elle le met en difficulté : creuse, c'est là que ça fait mal", "Question trop ouverte : commence par des questions fermées pour installer un rythme de réponses"], "a": 0}, {"q": "Tu doutes de ton nouveau prix, alors tu bosses ta posture et ton sourire avant le rendez-vous. À l'annonce du montant, ton débit accélère et le prospect recule légèrement. Que dit le module ?", "o": ["Sa transition posturale est une réaction normale au prix : tiens le silence cinq à huit secondes et elle passera", "La cohérence ne se simule pas : ton corps publie ton doute, et ça se règle avant, conviction retrouvée ou offre réparée", "Ta posture était bonne mais il manquait la synchronisation : cale ton débit sur le sien dès les cinq premières minutes", "Le problème est vocal, pas corporel : tu as annoncé le montant avec une fin de phrase montante"], "a": 1}, {"q": "Face à un prospect au débit lent et aux gestes rares, tu copies chacun de ses mouvements dans la seconde pour créer du lien. L'ambiance devient bizarre. Quelle est la bonne lecture ?", "o": ["La synchronisation se joue surtout à la voix : c'est ton débit qu'il fallait caler, pas tes gestes", "Tu aurais dû faire l'inverse : c'est au prospect de se régler sur ton état, pas à toi de suivre le sien", "L'effet caméléon fonctionne discrètement : tu calibres le rythme et l'ouverture, tu ne singes pas", "Le mimétisme était bon mais trop tardif : la synchronisation doit être installée dans les cinq premières minutes"], "a": 2}, {"q": "Ton prospect arrive stressé : débit mitraillette, gestes nerveux, il veut \"faire vite\". Ton réflexe commercial serait de matcher son énergie pour créer du rapport. Que fais-tu ?", "o": ["Tu restes ancré : posture stable, respiration basse, rythme posé. Sous stress, son état se règle sur le tien, pas sur tes mots", "Tu cales ton débit sur le sien, comme le prévoit la synchronisation, puis vous ralentirez ensemble progressivement", "Tu écourtes et tu recales un rendez-vous : un cerveau stressé retombe toujours sur l'option par défaut", "Tu montes ton énergie au même niveau pour créer le lien, puis tu redescends une fois la connexion établie"], "a": 0}, {"q": "Tu annonces \"c'est 4 000 euros\" avec la voix qui monte en fin de phrase, tu tiens deux secondes de blanc puis tu enchaînes sur les bénéfices. Il attaque la négociation. Quelles erreurs viens-tu d'empiler ?", "o": ["Une seule vraie erreur : le blanc de deux secondes lui a laissé le temps de douter, il fallait enchaîner tout de suite", "Fin de phrase montante et justification après le prix : ton montant est devenu une question, et chaque mot ajouté est lu comme un doute", "Tu n'as pas assez articulé le chiffre : un prix mâché signale qu'on n'y croit pas, d'où la négociation", "Le prix est tombé trop tôt : sans reformulation du coût de son problème juste avant, tout montant paraît cher"], "a": 1}, {"q": "Tu demandes : \"Concrètement, ça te coûte combien par mois, ce problème ?\" Il lève les yeux, silence de six secondes. Tu reformules ta question pour l'aider. Bonne ou mauvaise idée ?", "o": ["Bonne : reformuler soulage sa mémoire de travail et lui prouve ta théorie de l'esprit", "Bonne, à condition de proposer une fourchette chiffrée : un cerveau guidé calcule plus vite qu'un cerveau seul", "Mauvaise : il calculait le coût de son problème, ce calcul travaille pour toi, et parler par-dessus sature sa charge au pire moment", "Mauvaise, mais pour une autre raison : le silence ne se tient qu'après le prix et après un closing, pas en découverte"], "a": 2}, {"q": "Tu prépares ton pitch. Par quoi commencer pour ne pas perdre ton interlocuteur ?", "o": ["Qui tu es et la présentation de ton entreprise", "La promesse : ce que tu apportes d'essentiel à sa situation", "Tes tarifs et tes conditions", "Ton process de mise en oeuvre"], "a": 1}, {"q": "Ton prospect vient de poser une objection. Le meilleur outil à sortir en premier ?", "o": ["Un contre-argument solide pour la démonter", "Une reformulation puis une question ouverte pour isoler la vraie crainte", "Une remise pour débloquer", "Une nouvelle fonctionnalité qu'il ne connaissait pas"], "a": 1}, {"q": "En pleine présentation, le prospect se touche l'oreille et recule légèrement sur sa chaise. Tu...", "o": ["continues ton argumentaire, il écoute", "accélères vers le prix pendant qu'il t'écoute", "marques une pause et vas chercher l'objection non dite", "hausses le ton pour capter son attention"], "a": 2}, {"q": "Pour savoir comment il produit ses reportings sans déclencher sa réactance, tu demandes...", "o": ["\"Vous avez des soucis avec vos reportings, non ?\"", "\"Comment produisez-vous vos reportings aujourd'hui ?\"", "\"J'imagine que ça vous prend un temps fou ?\"", "\"Vous ne trouvez pas ça beaucoup trop lent ?\""], "a": 1}]}, {"id": "m4", "num": "Module 4", "icon": "🩺", "title": "Le diagnostic clinique", "subtitle": "Le processus de vente neuroscientifique : découverte → closing", "gated": true, "videos": [{"id": "m4v1", "num": "Vidéo 1", "title": "La découverte neuro : activer la douleur et le désir", "videoUrl": "https://www.skool.com/persua-7488/classroom/b4374723?md=287bc0058d214766b77f7e93b9bed1ff"}, {"id": "m4v2", "num": "Vidéo 2", "title": "Présentation de l'offre : structurer pour le cerveau", "videoUrl": "https://www.skool.com/persua-7488/classroom/b4374723?md=872987478533451b9e460f61e9a132ad"}, {"id": "m4v3", "num": "Vidéo 3", "title": "Gestion des objections : rassurer le cerveau en alerte", "videoUrl": "https://www.skool.com/persua-7488/classroom/b4374723?md=5803c5f05f0248359e32c480879237f5"}, {"id": "m4v4", "num": "Vidéo 4", "title": "Le closing neuropsychologique : réduire le risque perçu", "videoUrl": "https://www.skool.com/persua-7488/classroom/b4374723?md=c7e03acdb2664a158a908ae0cae33666"}, {"id": "m4v5", "num": "Vidéo 5", "title": "La négociation basée sur l'aversion à la perte", "videoUrl": "https://www.skool.com/persua-7488/classroom/b4374723?md=783de507c48b488ea326cc3e58edcd30"}, {"id": "m4v6", "num": "Vidéo 6", "title": "Urgence et rareté : activer sans manipuler", "videoUrl": "https://www.skool.com/persua-7488/classroom/b4374723?md=9f482bd86be84185bd4f2d87b46c01ba"}, {"id": "m4f1", "num": "Fiche", "title": "Fiche neuro : à lire et garder", "type": "fiche", "fiche": "<p class=\"lead\">Sous pression, ton cortisol monte et tu improvises. Un rail te libère l'esprit pour écouter. Voici la structure, étape par étape, avec la phrase à dire.<\/p><h4>Le script C.L.O.S.E.R<\/h4><ul><li><b>Clarify<\/b> : pourquoi il a pris ce RDV. \"Qu'est-ce qui vous a poussé à réserver cet échange aujourd'hui ?\"<\/li><li><b>Label<\/b> : reformule sa problématique avec SES mots, attends un oui net.<\/li><li><b>Overview<\/b> : ce qu'il a déjà tenté et raté. \"Depuis combien de temps ? Qu'avez-vous essayé ?\" Puis déculpabilise.<\/li><li><b>Sell the vacation<\/b> : vends la destination vécue, pas le billet. Le résultat, pas les fonctionnalités.<\/li><li><b>Explain concerns<\/b> : traite les objections écran de fumée.<\/li><li><b>Reinforce<\/b> : verrouille dans les 24 heures. Promets moins, délivre plus.<\/li><\/ul><h4>Les 3 craintes derrière toute objection<\/h4><p>Derrière \"trop cher\", \"je réfléchis\", \"pas le moment\", il n'y a que trois manques de confiance : en TOI, en ton PRODUIT, en ton ENTREPRISE. Ton job : trouver lequel, puis rassurer sur celui-là seul. Tu ne désamorces jamais une menace que tu n'as pas localisée.<\/p><h4>Sur le terrain<\/h4><p>\"Je vais réfléchir\" est une info qui manque, pas un non. Demande : \"qu'est-ce qui vous manque pour être certain ?\", puis tais-toi.<\/p>"}], "quiz": [{"q": "En RDV, ton prospect répond tranquillement à tes questions factuelles : effectif, outils, organisation. Tu en es à ta huitième question de ce type et l'échange reste plat. Que se passe-t-il ?", "o": ["Rien d'anormal : il faut cartographier toute la situation avant d'oser parler des problèmes", "Il est en Système 1 et tu dois le faire basculer en Système 2 pour qu'il analyse sa situation", "Tu le maintiens en Système 2 factuel : au-delà de 2-3 questions de situation, le reste devait être préparé en amont", "Tu crées du rapport de confiance, la partie émotionnelle viendra naturellement ensuite"], "a": 2}, {"q": "Ton prospect lâche : \"oui, on perd pas mal de temps avec la ressaisie, c'est pénible\". Tu enchaînes aussitôt sur ta solution. Qu'est-ce que tu viens de rater ?", "o": ["L'implication : sans mesure de ce que ça lui coûte, \"j'ai un problème\" ne pèse rien face au statu quo", "Le ROI : tu aurais dû chiffrer toi-même le coût de sa ressaisie pour appuyer là où ça fait mal", "Rien : la douleur est sortie, il faut battre le fer tant qu'il est chaud avant qu'elle retombe", "La question de désir : il fallait d'abord lui faire imaginer sa vie sans ressaisie"], "a": 0}, {"q": "Question d'implication posée, ton prospect calcule : \"entre les erreurs et le temps perdu, ça doit nous coûter 40 000 euros par an\". Quel est ton coup d'après ?", "o": ["Tu présentes ton offre : la douleur est chiffrée par lui-même, les conditions sont réunies", "Tu affines son estimation avec tes propres chiffres pour crédibiliser le montant", "Tu creuses encore la douleur : plus le montant grossit, plus l'aversion à la perte travaille", "Tu bascules sur le désir : \"si c'était réglé demain, qu'est-ce qui changerait ?\" pour remonter la courbe"], "a": 3}, {"q": "Découverte réussie, ton prospect est ému en parlant de son équipe qui sature. Tu ouvres ta présentation par vos 15 ans d'expérience et vos références pour asseoir ta crédibilité. Quel est l'effet réel ?", "o": ["Tu rassures son amygdale : la confiance d'abord, l'émotion pourra ensuite s'appuyer dessus", "Tu forces la bascule en Système 2 : l'analyse froide fait retomber l'émotion que tu venais de construire", "Tu actives la preuve sociale au bon moment, avant qu'il ne compare avec tes concurrents", "Tu perds un peu de temps mais sans conséquence : la douleur mesurée en découverte reste acquise"], "a": 1}, {"q": "Fin de présentation, tu conclus par un poli : \"alors, qu'en pensez-vous ?\". Pourquoi c'est une erreur ?", "o": ["Tu rallumes le mode analyse : tu lui demandes littéralement de critiquer ton offre", "La question est trop vague, il fallait demander ce qui lui plaît le plus dans l'offre", "Aucune erreur : une question ouverte montre l'écoute et laisse la décision au prospect", "Tu aurais dû annoncer le prix d'abord, une invitation sans prix n'engage à rien"], "a": 0}, {"q": "Tu as deux cas clients : une grosse boîte connue avec des résultats spectaculaires, et une PME du même secteur que ton prospect avec des résultats corrects. Ton prospect dirige une PME. Tu montres quoi ?", "o": ["La grosse référence : le prestige crédibilise et fait le travail de réassurance", "Les deux : plus tu empiles de preuves, plus la validation est solide", "La PME similaire : la ressemblance déclenche l'identification, bien plus que le spectaculaire", "Une statistique agrégée sur tous tes clients : plus fiable qu'une histoire isolée"], "a": 2}, {"q": "Ton offre a 12 fonctionnalités et ton prospect semble intéressé. Pour maximiser la valeur perçue avant d'annoncer le prix, tu décides de tout lui montrer. Que prédit le module ?", "o": ["L'équation valeur-prix devient plus favorable, condition clé d'un closing naturel", "Sa mémoire de travail sature au-delà de 3-4 éléments : surchargé, il ne dit pas oui, il reporte", "Il restera en Système 1 émerveillé si tu enchaînes les démonstrations avec rythme", "Ça fonctionne s'il a un profil analytique qui aime l'exhaustivité"], "a": 1}, {"q": "\"C'est trop cher.\" Tu as un comparatif ROI béton dans ta sacoche et une furieuse envie de le sortir. Quel est ton tout premier geste selon le protocole ?", "o": ["Sortir le ROI : une objection prix se traite par la démonstration de valeur chiffrée", "Demander tout de suite \"trop cher comparé à quoi ?\" pour reprendre la main", "Réancrer la valeur avant de reparler du prix, comme en négociation", "Une pause de 2 secondes : elle empêche ta défensive automatique de prendre le volant"], "a": 3}, {"q": "\"Je dois en parler à mon associé avant de décider.\" Quelle est la lecture du module, et la bonne réponse ?", "o": ["Objection de processus : il ne veut pas porter seul la décision, équipe-le pour vendre en interne", "Objection de timing : explore le coût de l'attente plutôt que le calendrier", "Une excuse polie pour sortir du RDV : reviens à la douleur pour vérifier qu'elle est réelle", "Demande un RDV à trois : personne ne défendra ton offre mieux que toi face à l'associé"], "a": 0}, {"q": "Ton prospect soupire : \"on a déjà essayé un outil comme ça, ça n'a rien changé\". Tu classes ça comment, et tu fais quoi ?", "o": ["Objection de valeur : retourne à la valeur avant de reparler du prix", "Un défi technique : démontre point par point en quoi ta solution diffère de l'ancienne", "Objection de peur, biais de statu quo : nomme la peur et réduis le risque concrètement", "Objection de processus : implique les utilisateurs qui ont vécu le premier échec"], "a": 2}, {"q": "Douleur chiffrée par le prospect, valeur validée par lui, confiance visible : les trois conditions sont là et il est enthousiaste. Quel closing choisis-tu ?", "o": ["Réduction du risque : propose un premier pas limité, on ne brusque jamais une décision", "Confirmation : \"on est alignés, quelle est la prochaine étape concrète de ton côté ?\"", "Coût de l'inaction : \"attendre 3 mois, qu'est-ce que ça aura coûté ?\" pour verrouiller", "Closing de vérité : vérifie qu'aucun frein caché ne dort avant d'avancer"], "a": 1}, {"q": "Tu annonces ton prix, posture ancrée. Silence. Sept secondes passent, l'inconfort monte. Tu fais quoi ?", "o": ["Rien, tu attends : la question ouverte n'arrive qu'à 10 secondes, et jamais d'arguments dans le silence", "Tu rappelles calmement le bénéfice principal pour l'aider à trancher", "Tu proposes un paiement en plusieurs fois pour lever le blocage évident", "Tu poses tout de suite une question ouverte : 7 secondes de silence, c'est déjà une alerte"], "a": 0}, {"q": "Ton prospect convaincu demande 15 % de remise. Tu acceptes dans la seconde pour sécuriser la signature. Qu'est-ce qui vient de se passer ?", "o": ["Il se sent gagnant : la réciprocité de ton geste va accélérer sa signature", "Tu as bien joué si ta marge l'absorbe : le prix est une variable d'ajustement comme une autre", "Tu as calmé son aversion à la perte : il a évité de payer trop cher, il est rassuré", "Ta propre aversion à la perte a cédé en premier, et son cerveau conclut que ton prix initial était gonflé"], "a": 3}, {"q": "\"Il faut faire un effort sur le prix.\" Tu as accueilli sans céder et réancré la valeur chiffrée. Avant toute concession, que dois-tu encore déterminer ?", "o": ["La contrepartie exacte que tu vas exiger en échange de la remise", "Le plancher que ta marge autorise pour ne pas vendre à perte", "Si le blocage vient du budget global, de la trésorerie, ou d'un doute sur la valeur", "S'il a une offre concurrente moins chère sur la table"], "a": 2}, {"q": "Tu n'as réellement que 2 créneaux d'accompagnement ce mois-ci. Tu le dis, ton prospect hésite, alors tu le répètes deux fois de plus dans l'échange. Verdict ?", "o": ["Correct : la rareté est authentique, donc la marteler ne pose aucun problème", "Erreur : même vraie, la deuxième fois signale l'anxiété et la troisième la pression", "Erreur : la disponibilité du vendeur n'est pas une source d'urgence authentique", "Correct : l'aversion à la perte a besoin de répétition pour s'installer"], "a": 1}, {"q": "En fin de RDV : \"C'est clair, c'est intéressant, je vais réfléchir.\" Le meilleur premier geste ?", "o": ["Sortir une remise limitée dans le temps", "Demander \"qu'est-ce qui vous manque aujourd'hui pour être certain de prendre la bonne décision ?\" puis te taire", "Renvoyer une plaquette plus complète", "Le laisser réfléchir et le relancer dans trois jours"], "a": 1}, {"q": "Un prospect dit \"c'est trop cher\". Selon le modèle des 3 craintes, tu dois d'abord identifier...", "o": ["S'il a réellement le budget", "Laquelle des trois confiances manque : en toi, en ton produit, ou en ton entreprise", "Son profil DISC exact", "Son planning de décision"], "a": 1}, {"q": "Objection \"c'est trop cher\". Le tout premier temps, avant le moindre argument ?", "o": ["Sortir ton comparatif chiffré", "Proposer une remise pour débloquer", "Aller dans le sens (\"je comprends, c'est un vrai budget\") pour baisser la tension", "Changer de sujet et y revenir plus tard"], "a": 2}, {"q": "Le prospect veut \"améliorer son CA\". Pour toucher son vrai moteur, tu descends vers...", "o": ["son besoin de surface, c'est suffisant pour vendre", "sa motivation profonde puis sa raison personnelle, souvent ancienne", "son budget disponible", "son planning de décision"], "a": 1}, {"q": "Le prospect est d'accord sur le fond mais sans urgence. Sans fabriquer de fausse urgence, tu...", "o": ["répètes que le prix va bientôt monter", "envoies trois relances par semaine", "pars de sa date cible et co-construis un rétroplanning des étapes", "offres un bonus de dernière minute"], "a": 2}]}, {"id": "m5", "num": "Module 5", "icon": "🏛️", "title": "L'architecture de l'offre", "subtitle": "Expérience client & fidélisation", "gated": true, "videos": [{"id": "m5v1", "num": "Vidéo 1", "title": "Dopamine et fidélisation : créer l'envie de revenir", "videoUrl": "https://www.skool.com/persua-7488/classroom/0c8f7c05?md=3dc34a5a7f4346b09523ecc63e441165"}, {"id": "m5v2", "num": "Vidéo 2", "title": "L'effet de pic et de fin : ce dont le client se souviendra", "videoUrl": "https://www.skool.com/persua-7488/classroom/0c8f7c05?md=eef507af098a4c49a79593ed72770bdb"}, {"id": "m5v3", "num": "Vidéo 3", "title": "Confiance et ocytocine : bâtir des relations durables", "videoUrl": "https://www.skool.com/persua-7488/classroom/0c8f7c05?md=b90629ab427b4647b3d31a49d60c11b2"}, {"id": "m5v4", "num": "Vidéo 4", "title": "Boucles de récompense et programmes de fidélité", "videoUrl": "https://www.skool.com/persua-7488/classroom/0c8f7c05?md=3ebd81dceaa0403ab8db7b9bbbed3c19"}, {"id": "m5v5", "num": "Vidéo 5", "title": "Transformer un client en ambassadeur grâce à la psychologie sociale", "videoUrl": "https://www.skool.com/persua-7488/classroom/0c8f7c05?md=d9308c063dea4fff901fdbd215296075"}, {"id": "m5f1", "num": "Fiche", "title": "Fiche neuro : à lire et garder", "type": "fiche", "fiche": "<p class=\"lead\">Ton client ne retient pas la moyenne de ton accompagnement. Il retient deux choses : le pic émotionnel et la fin. Et son cerveau adore ce qu'il peut prédire.<\/p><h4>Pic et fin<\/h4><p>Soigne le dernier moment de chaque interaction, c'est lui qui reste. Un bon closing suivi d'une fin tiède efface le closing.<\/p><h4>Les 24 heures qui décident<\/h4><p>Juste après l'achat, le cerveau cherche à confirmer qu'il a bien fait. Promets moins, délivre plus : un message de bienvenue, un bonus non annoncé. Ces 24 heures décident s'il devient fidèle ou s'il doute.<\/p><h4>La prévisibilité fidélise<\/h4><p>Un produit correct mais 100 pour cent prévisible fidélise plus qu'un excellent mais incohérent. Le Doliprane, c'est du paracétamol deux à trois fois plus cher, on le reprend parce qu'on connaît le résultat. Zéro surprise, zéro doute.<\/p><h4>Sur le terrain<\/h4><p>Après chaque étape, annonce la suivante précisément. Une prochaine action datée réduit l'incertitude et ramène le client.<\/p>"}], "quiz": [{"q": "48h après avoir signé, ton client t'envoie un mail avec des questions pointues qu'il n'avait jamais posées et un « tu es sûr que c'est la bonne solution pour nous ? ». Quelle est la bonne lecture ?", "o": ["Un concurrent est passé derrière toi : reprends rendez-vous pour redéfendre ton offre point par point avant qu'il ne bascule", "Ton closing a été trop rapide : il faut re-vendre les bénéfices tant que la décision est encore chaude", "C'est la dissonance cognitive des 24 à 72h : son cerveau cherche à valider sa décision, traite le doute de front avec un message humain", "Ne réponds pas trop vite pour ne pas paraître inquiet : ce genre de doute retombe tout seul en quelques jours"], "a": 2}, {"q": "Tu démarres une mission de 6 mois dont le premier livrable majeur tombe au mois 3. D'après le module, que fais-tu ?", "o": ["Tu planifies une quick win, même petite, dans les 2 premières semaines : sans premier résultat tangible, le doute a le temps de laisser des traces", "Tu avances le livrable majeur au mois 2 quitte à réduire le périmètre : c'est la taille du premier résultat qui réengage le client", "Tu envoies un point d'avancement détaillé chaque semaine : un client bien informé n'a aucune raison de douter de son investissement", "Tu offres une surprise positive dès la première semaine pour compenser neurologiquement l'attente du livrable"], "a": 0}, {"q": "Tu prépares un bilan trimestriel. Ton client a trois problèmes bloquants à régler d'urgence. Comment structures-tu la réunion ?", "o": ["Tu attaques par les trois problèmes puisqu'ils sont urgents, et tu gardes les réussites pour la fin afin de soigner la dernière impression", "Tu commences par mesurer le chemin parcouru, puis tu ouvres sur les pr
