oblèmes : sinon tu actives le système d'évitement avant le système d'approche", "Tu alternes un problème puis une réussite pour que la moyenne émotionnelle de la réunion reste positive", "Tu laisses le client choisir l'ordre du jour : son cerveau se sentira en contrôle et donc en sécurité"], "a": 1}, {"q": "Mission A : un retard sérieux au milieu, mais un dernier mois brillant et une clôture soignée. Mission B : irréprochable de bout en bout, terminée par un simple envoi de facture. Six mois plus tard, laquelle génère des recommandations ?", "o": ["La B : le cerveau garde la trace de l'ensemble des moments, et son ensemble est objectivement meilleur", "Aucune : un retard sérieux tue la recommandation, et une facture n'a jamais empêché un client content de parler", "La B, à condition que le résultat chiffré soit supérieur : c'est le résultat final qui fait parler un client", "La A : le cerveau résume l'expérience à son pic et à sa fin, le retard du milieu pèse peu dans le souvenir"], "a": 3}, {"q": "Tu veux créer un pic mémorable pour ton meilleur client. D'après les trois critères du module, quelle action a le plus de chances de marcher ?", "o": ["Une remise surprise de 10 % sur sa prochaine facture : inattendue et directement valorisable dans ses comptes", "Un dîner dans un grand restaurant pour marquer le coup à la fin de la mission", "Une note manuscrite, envoyée sans occasion, qui relie son résultat à ce qu'il t'avait confié compter vraiment pour lui", "Un reporting mensuel d'un niveau de détail qui écrase celui de tous ses autres prestataires"], "a": 2}, {"q": "Fin de collaboration : ton client n'a atteint que 80 % de l'objectif. Comment mènes-tu la dernière réunion ?", "o": ["Tu la consacres aux 20 % manquants avec un plan d'action : c'est la preuve de ton exigence jusqu'au bout", "Tu montres le delta en chiffres concrets, tu reconnais ce qu'il a investi en temps, énergie et courage, puis tu ouvres la suite sans pression", "Tu termines sur une proposition de renouvellement avec une remise limitée dans le temps pour transformer l'élan en signature", "Tu restes factuel et sobre : célébrer 80 % d'un objectif, c'est risquer de perdre ta crédibilité"], "a": 1}, {"q": "En séminaire, un formateur affirme : « offre un petit cadeau dès le premier rendez-vous, ça libère l'ocytocine, l'hormone de la confiance, et le client te fait confiance ». Que répond ce module ?", "o": ["C'est vrai : le don sans contrepartie immédiate est justement un des cinq comportements déclencheurs de confiance", "C'est vrai sur le fond, mais le geste doit venir après la première vente, une fois la compétence prouvée", "C'est faux : la confiance est rationnelle, elle repose uniquement sur l'accumulation de preuves de compétence", "C'est un raccourci trompeur : l'ocytocine n'est pas un interrupteur, des résultats n'ont pas tenu à la reproduction ; la confiance se construit preuve après preuve, par la sécurité"], "a": 3}, {"q": "Tu as fait une erreur qui coûte deux semaines de délai à ton client. Il ne s'en est pas encore rendu compte. Que fais-tu ?", "o": ["Tu l'admets de front : la vulnérabilité authentique construit la confiance, et minimiser une difficulté est interprété comme une trahison", "Tu compenses discrètement par un geste commercial sans t'étendre sur l'erreur : les actes valent mieux que les excuses", "Tu attends de voir s'il le remarque : soulever un problème qu'il n'a pas vu, c'est créer une inquiétude inutile", "Tu expliques les causes externes du retard pour protéger ta crédibilité technique, puis tu présentes ton plan de rattrapage"], "a": 0}, {"q": "Un concurrent approche ton client de trois ans avec la même prestation 15 % moins chère. Ton client décline sans même te demander de t'aligner. Qu'est-ce qui l'a retenu ?", "o": ["La qualité technique de ton travail : un client bien servi n'a aucune raison rationnelle de partir", "La peur du risque : changer de prestataire est objectivement dangereux pour son activité", "La réserve de confiance accumulée et l'attachement : dans sa tête le changement coûte, l'aversion à la perte fait le reste", "Les gestes commerciaux forts que tu lui as faits : la générosité ponctuelle verrouille la relation"], "a": 2}, {"q": "Ton associé propose un programme de fidélité : « 1 point par euro dépensé, cadeau fixe garanti à 500 points ». Quelle est la critique du module ?", "o": ["Le seuil est trop lointain : à 100 points, le client serait récompensé plus vite et plus souvent", "Il récompense la dépense au lieu de l'engagement, et un cadeau fixe et prévisible crée moins d'anticipation qu'une récompense variable et des paliers", "Il manque un avantage immédiat à l'inscription : le cerveau préfère toujours une récompense immédiate à une récompense différée", "Rien à redire : c'est simple et lisible, et le cerveau aime les règles claires"], "a": 1}, {"q": "Depuis six mois, tu envoies chaque vendredi un point d'avancement que ton client attend. Cette semaine, tu ne l'envoies pas. D'après les travaux de Schultz, que se passe-t-il dans son cerveau ?", "o": ["Un signal dopaminergique négatif : la récompense annoncée par le signal manque, son cerveau produit de la déception", "Rien de particulier : une absence d'information n'est pas une information pour le cerveau", "Un effet de manque qui augmente son désir : l'imprévisibilité rend la récompense encore plus puissante", "Une simple baisse d'attention : il ne le remarquera que si le projet a réellement pris du retard"], "a": 0}, {"q": "Ton travail est impeccable, tes livrables irréprochables, et pourtant tes clients restent tièdes entre deux résultats. Quel est le diagnostic du module ?", "o": ["La valeur perçue est trop basse : monte tes prix pour que l'engagement suive l'investissement", "Il manque un programme de fidélité formel, avec points et niveaux, pour structurer l'engagement", "La qualité ne suffit plus : il te faut un grand geste spectaculaire qui marque durablement la relation", "La relation est riche en routine mais pauvre en récompenses explicites : nomme la progression, célèbre les jalons"], "a": 3}, {"q": "Fin d'un bilan très positif avec un dirigeant. Tu veux ouvrir la porte aux recommandations. Quelle formulation choisis-tu ?", "o": ["« Est-ce que tu connais d'autres dirigeants qui cherchent à progresser comme toi ? »", "« À qui pourrais-tu me présenter dans ton réseau ? » : une demande directe et assumée passe toujours mieux", "Aucune : un client vraiment satisfait recommande spontanément, demander casse la sincérité de la démarche", "« Si tu es content, tu penseras à moi ? » : léger, sans pression, dans l'esprit de l'ouverture vers la suite"], "a": 0}, {"q": "Deux clients ont obtenu le même résultat et se disent aussi satisfaits l'un que l'autre. Le premier te mentionne spontanément dans des conversations où ton nom n'avait aucune raison d'apparaître, le second ne parle jamais de toi. Quelle est la différence ?", "o": ["Le premier est plus extraverti : l'ambassadorat est d'abord une affaire de tempérament", "Travailler avec toi fait désormais partie de l'identité du premier : il se recommande lui-même à travers toi", "Le premier a une histoire plus facile à raconter parce que son secteur est plus visible", "Le premier a reçu plus d'attentions de ta part : la réciprocité l'oblige à te renvoyer l'ascenseur"], "a": 1}, {"q": "Tu dis à un client engagé : « tu es exactement le profil pour qui cette approche fait une vraie différence ». Quel mécanisme actives-tu ?", "o": ["La réciprocité : valorisé, il se sentira redevable et voudra te rendre la pareille", "La récompense surprise : un compliment inattendu déclenche un pic de dopamine qui le réengage", "La cohérence identitaire : comme dans l'expérience du vote de Cialdini, son cerveau va chercher à confirmer cette identité", "L'aversion à la perte : il ne voudra pas risquer de perdre ce statut de client à part"], "a": 2}, {"q": "Ton client vient de signer. Quel moment soignes-tu en priorité pour la fidélité ?", "o": ["La moyenne de la prestation sur toute la durée", "La toute fin de chaque interaction et les 24 premières heures après l'achat", "Le milieu de l'accompagnement", "Le niveau de prix pratiqué"], "a": 1}, {"q": "Deux offres : une excellente mais floue sur le déroulé, une correcte mais 100 pour cent prévisible. Laquelle fidélise le mieux selon le cerveau ?", "o": ["L'excellente floue, car le potentiel de plaisir est plus haut", "La prévisible : le cerveau préfère réduire l'incertitude", "Ça dépend uniquement du prix", "Les deux fidélisent de la même façon"], "a": 1}, {"q": "Tu as trois offres. Pour que ton offre standard à 12k paraisse raisonnable, tu présentes d'abord...", "o": ["l'offre standard directement", "l'entrée de gamme la moins chère", "le premium à 18k", "le prix moyen du marché"], "a": 2}, {"q": "Ton client vient de signer. Pour ancrer sa fidélité, dans les 24 heures tu...", "o": ["le laisses tranquille, il vient de payer", "lui envoies un message de bienvenue et un bonus non annoncé", "lui renvoies la facture détaillée", "attends son premier retour avant d'agir"], "a": 1}]}, {"id": "m6", "num": "Module 6", "icon": "🛡️", "title": "La maîtrise des résistances", "subtitle": "Script neuro-optimisé & cas pratiques (B2B, B2C, distanciel)", "gated": true, "videos": [{"id": "m6v0", "num": "Vidéo 1", "title": "Le modèle SONCASE : les 7 leviers de motivation d'achat"}, {"id": "m6v1", "num": "Vidéo 2", "title": "Le script de vente neuro-optimisé : structure complète", "videoUrl": "https://www.skool.com/persua-7488/classroom/35209095?md=f5cf04bbc60342958853421448e332a9"}, {"id": "m6v2", "num": "Vidéo 3", "title": "Atelier : analyser et reformuler ton pitch", "type": "atelier", "calUrl": "https://cal.com/steven-lfrs-persua/atelier-pitch"}, {"id": "m6v3", "num": "Vidéo 4", "title": "Atelier : vente B2B, cycle long", "type": "atelier", "calUrl": "https://cal.com/steven-lfrs-persua/atelier-b2b"}, {"id": "m6v4", "num": "Vidéo 5", "title": "Atelier : vente B2C, émotion immédiate", "type": "atelier", "calUrl": "https://cal.com/steven-lfrs-persua/atelier-b2c"}, {"id": "m6v5", "num": "Vidéo 6", "title": "Atelier : vente par téléphone et visio", "type": "atelier", "calUrl": "https://cal.com/steven-lfrs-persua/atelier-distance"}, {"id": "m6v6", "num": "Vidéo 7", "title": "La checklist : préparer chaque rendez-vous", "type": "fiche", "fiche": "<p class=\"lead\">Les pilotes utilisent une checklist avant chaque décollage. Pas parce qu'ils ne savent pas piloter : parce que sous pression, le cerveau oublie. Même l'expert. En rendez-vous, le cortisol monte, ta mémoire de travail sature, et tes meilleurs réflexes s'effacent au moment exact où tu en as besoin. Cette checklist prend cinq minutes et t'assure d'entrer dans chaque rendez-vous avec tous les leviers activés.<\/p><h4>Avant le rendez-vous<\/h4><p><b>Préparation personnelle<\/b><\/p><ul><li>Deux minutes de respiration lente, montre en main. Ton calme se transmet au prospect avant tes mots.<\/li><li>Un objectif unique et comportemental. Pas « signer » : « comprendre le vrai problème en profondeur ».<\/li><li>Reconnecte-toi à ta conviction sincère sur la valeur de ce que tu proposes.<\/li><\/ul><p><b>Préparation prospect<\/b><\/p><ul><li>Son profil DISC probable, son moteur probable (douleur ou plaisir), sa douleur la plus vraisemblable.<\/li><li>Un cas client similaire en tête pour la preuve.<\/li><li>Deux questions préparées par niveau : situation, problème, implication, désir.<\/li><\/ul><p><b>Préparation du cadre<\/b><\/p><ul><li>En présentiel : apparence et supports cohérents avec ton positionnement.<\/li><li>En visio : cadre, lumière et son irréprochables, notifications coupées.<\/li><\/ul><h4>Pendant le rendez-vous<\/h4><p><b>Ancrage<\/b><\/p><ul><li>Ai-je signalé l'absence de pression ?<\/li><li>Mon prospect s'est-il détendu (épaules, respiration, débit de parole) ?<\/li><li>Suis-je moi-même calme et présent ?<\/li><\/ul><p><b>Découverte<\/b><\/p><ul><li>Est-ce que je parle moins de 30 % du temps ?<\/li><li>Est-ce que j'utilise ses mots à lui ?<\/li><li>A-t-il mesuré lui-même le coût de son problème et verbalisé son désir ?<\/li><\/ul><p><b>Présentation<\/b><\/p><ul><li>Ai-je commencé par le miroir de sa situation ?<\/li><li>Est-ce que je présente des transformations, pas des fonctionnalités ?<\/li><li>Ai-je raconté une histoire client ?<\/li><\/ul><p><b>Closing<\/b><\/p><ul><li>Les trois conditions sont-elles réunies : douleur mesurée, valeur perçue, confiance établie ?<\/li><li>Ai-je choisi le closing adapté au profil ?<\/li><li>Ai-je tenu les huit secondes de silence après le prix ?<\/li><\/ul><h4>Après le rendez-vous<\/h4><p><b>Analyse<\/b><\/p><ul><li>Quel profil ai-je identifié ? Quel levier a fonctionné, lequel manquait ?<\/li><li>La découverte est-elle allée jusqu'à l'implication ?<\/li><\/ul><p><b>Actions<\/b><\/p><ul><li>Décision prise : message de bienvenue sous 24 heures.<\/li><li>Pas encore de décision : une prochaine micro-action, datée.<\/li><li>Dans tous les cas : noter la douleur principale et les mots exacts du prospect.<\/li><\/ul><h4>Comment l'utiliser<\/h4><ul><li><b>Débutant<\/b> : parcours la checklist entière, par écrit, avant et après chaque rendez-vous.<\/li><li><b>Intermédiaire<\/b> : avant et après ; pendant, fais confiance à ton intégration et note deux ou trois observations.<\/li><li><b>Avancé<\/b> : elle est intégrée. Tu l'utilises surtout après, pour maintenir ton niveau d'exigence.<\/li><\/ul><p><b>Exercice<\/b> : imprime-la, garde-la sur ton bureau, et remplis la partie « après » à chaud dès la fin de ton prochain rendez-vous, avant même d'ouvrir tes mails.<\/p>"}], "quiz": [{"q": "Que t'indique le levier SONCASE dominant d'un client ?", "o": ["Comment il prend ses décisions", "Pourquoi il achète : sa motivation dominante", "Son budget disponible"], "a": 1}, {"q": "Face à un client au levier Sécurité, quel est le bon réflexe ?", "o": ["Mettre en avant la nouveauté de l'offre", "Apporter garanties, preuves et références", "Accélérer vers le closing pour éviter les doutes"], "a": 1}, {"q": "À 12 minutes de rendez-vous, ton prospect vient de nommer sa douleur et semble prêt à écouter ton offre. Tu es tenté d'ouvrir ta présentation. Que dit la structure en 7 phases ?", "o": ["Bascule maintenant : l'émotion est active, et le pont sert justement à la garder pendant la transition", "Présente une seule transformation tout de suite pour battre le fer tant qu'il est chaud, tu détailleras après", "Reste en découverte : descends vers la douleur, puis fais-lui verbaliser son désir, sinon tu présentes dans le vide", "Réduis ta présentation à un seul des trois temps pour compenser la découverte écourtée"], "a": 2}, {"q": "Ton prospect vient de verbaliser son désir. Tu prends alors trois minutes pour lancer ton partage d'écran en parlant de tout et de rien, puis tu démarres ta présentation. Quelle est la lecture neuro ?", "o": ["Tu as raté le pont : l'émotion a refroidi pendant la bascule et tu présentes à froid", "Aucun impact : la présentation en 3 temps et la preuve sociale vont relancer l'émotion", "Bonne pratique : cette pause logistique calme l'amygdale juste avant la présentation", "Utile : ce temps mort laisse son Système 2 analyser tranquillement ce qu'il vient de dire"], "a": 0}, {"q": "Tu demandes « Comment prenez-vous vos décisions sur ce type de projet ? ». Réponse : « Je compare plusieurs offres en détail, je vérifie tous les chiffres, et je ne décide jamais à chaud. » Comment pilotes-tu la suite ?", "o": ["Tu raccourcis le rendez-vous, tu files à la découverte et tu vises un closing de confirmation", "Tu ralentis tout, tu multiplies la validation et tu proposes un démarrage progressif", "Tu prépares un closing de réduction du risque pour sécuriser une décision en fin de séance", "Tu sors des données solides, tu laisses de la place à ses questions et tu n'attends pas de décision en séance"], "a": 3}, {"q": "Ton offre a six bénéfices différenciants et ton prospect est bien engagé. En phase de présentation, que fais-tu de ces six bénéfices ?", "o": ["Tu les présentes tous : plus la valeur perçue est haute, plus le closing sera simple derrière", "Transformation principale, une preuve sociale ciblée, deux compléments maximum : au-delà, il sature et reporte", "Tu les présentes tous, mais espacés de silences pour laisser sa mémoire de travail respirer", "Tu n'en gardes qu'un seul, comme pour un profil D, quel que soit le profil en face"], "a": 1}, {"q": "Un collègue te lit son pitch : 12 ans d'expérience, 200 entreprises accompagnées, +25% de résultats. Tout est vrai, et pourtant tu ne ressens rien. Quel est le diagnostic ?", "o": ["Exact de bout en bout, mais aucune image : il ne parle qu'au Système 2, il informe sans rien faire ressentir", "Les références manquent de poids : avec des chiffres plus impressionnants, le déclic se ferait naturellement", "Il manque une histoire client chiffrée en ouverture : la preuve sociale est le levier absent de ce pitch", "Le pitch est trop court : il faudrait détailler la méthodologie pour rassurer le Système 2 du prospect"], "a": 0}, {"q": "Tu as réécrit ton pitch avec les 5 filtres et tu arrives à la dernière phrase, face à un prospect attentif. Laquelle choisis-tu ?", "o": ["« On se cale un rendez-vous pour voir comment ça s'appliquerait chez vous ? »", "« En résumé, la transformation principale que j'apporte à mes clients, c'est ça. »", "« C'est quoi, le moment où vous sentez que vous perdez des ventes qui auraient dû être gagnées ? »", "« Un client de votre secteur a vécu exactement cette situation, je vous raconte ? »"], "a": 2}, {"q": "En rendez-vous B2B, ton prospect lâche : « On a déjà investi dans une formation il y a deux ans, ça n'a rien donné. » Que fais-tu ?", "o": ["Tu enchaînes sur ce qui te différencie précisément de ce prestataire pour créer le contraste", "Tu creuses ce qui n'avait pas fonctionné, en annonçant que c'est pour ne pas reproduire les mêmes erreurs", "Tu rassures tout de suite : avec ta méthode, ce scénario ne peut pas se reproduire", "Tu notes le point et tu y reviendras plus tard, une fois l'ancrage de sécurité bien installé"], "a": 1}, {"q": "Comité B2B : Thomas le directeur commercial (profil C), le DRH et le PDG. Tu as préparé un dossier d'études de cas ultra chiffré. Comment gères-tu la réunion ?", "o": ["Tu déroules le dossier chiffré pour tous : en comité, c'est la rigueur rationnelle qui emporte la décision", "Tu concentres ton discours sur le PDG : c'est lui qui signe, les deux autres suivront sa position", "Tu laisses Thomas porter le dossier en interne : un pair convainc toujours mieux qu'un vendeur", "Tu gardes les chiffres pour Thomas, tu parles accompagnement des équipes au DRH et ROI daté au PDG"], "a": 3}, {"q": "Ton comité B2B se dit convaincu, mais repousse la signature de mois en mois sans objection claire. Quelle lecture, et quelle riposte ?", "o": ["Biais de statu quo : tu proposes un pilote réversible avec trois volontaires, mesuré ensemble, qui plafonne la perte possible", "Manque d'urgence : tu poses une offre à durée limitée pour forcer l'arbitrage avant la fin du mois", "ROI pas assez démontré : tu retravailles le calcul présenté au PDG avec des projections plus ambitieuses", "Cycle qui s'enlise : tu demandes une décision ferme, quitte à perdre le deal, pour sortir du flou"], "a": 0}, {"q": "Cycle long : ta prochaine réunion avec le comité est dans six semaines. Qu'est-ce qui entretient le mieux l'élan d'ici là ?", "o": ["Une relance par semaine pour vérifier où en est le dossier et rester présent dans les esprits", "Le silence : tu as semé, insister maintenant réactiverait la méfiance héritée du passé", "Une veille sectorielle envoyée spontanément et un client similaire qui accepte d'être contacté", "Une proposition ajustée avec un geste commercial pour redonner une bonne raison d'avancer"], "a": 2}, {"q": "B2C coaching haut de gamme : tu arrives au moment du prix et tu sais que le « c'est un gros investissement » va tomber. Que fais-tu juste avant d'annoncer le chiffre ?", "o": ["Rien de spécial : tu annonces le prix et tu tiens le silence de huit secondes, c'est lui qui travaille", "Tu nommes la réaction à l'avance et tu déplaces le critère : la direction d'abord, le prix ensuite", "Tu réactives l'identité désirée pour que son circuit de la récompense amortisse le chiffre", "Tu découpes le montant en mensualités pour réduire la perte perçue au moment de l'annonce"], "a": 1}, {"q": "Fin d'entretien B2C, ta prospecte te dit : « Je vais y réfléchir. » D'après le module, quelle est ta meilleure carte ?", "o": ["« Juste une question honnête : y a-t-il quelque chose qui vous retient que vous n'avez pas encore dit ? »", "Tu respectes son rythme et tu proposes un rappel sous 48h, la fenêtre où la décision se joue", "Tu reformules la version d'elle-même dans six mois pour raviver son circuit de la récompense", "Tu redemandes si c'est le bon moment pour elle, indépendamment de la logistique"], "a": 0}, {"q": "En visio, ton prospect raconte son problème en détail depuis deux minutes. Où poses-tu ton regard, et comment montres-tu ton écoute ?", "o": ["Caméra en continu : c'est le seul moyen de garder un vrai contact visuel à distance", "Tu hoches la tête et tu souris comme en présentiel, le non-verbal passe très bien à l'écran", "Tu prends des notes sur papier hors champ pour lui montrer que ce qu'il dit compte", "Tu regardes l'écran pendant qu'il parle et tu poses des marqueurs verbaux : « je note ça », « continuez »"], "a": 3}, {"q": "Au téléphone, tu parles à ton débit habituel, celui qui passe très bien en présentiel, et tu te sens calme. Quel est le problème ?", "o": ["Aucun : ton calme se transmet par corégulation, le débit n'a pas d'importance au téléphone", "Tu devrais plutôt accélérer : sans visuel, un rythme trop posé fait décrocher l'attention", "Ta parole arrive plus pressée qu'elle ne part : ralentis de 10 à 15% et articule plus nettement", "Le débit est bon, c'est le volume qu'il faut monter pour compenser la distance"], "a": 2}, {"q": "Cinq minutes avant un rendez-vous décisif, tu sens la pression monter. Que prévoit la checklist neuro-vente ?", "o": ["Tu relis une dernière fois toute ta présentation pour sécuriser ta mémoire de travail", "Deux minutes de respiration lente montre en main, et un objectif comportemental unique comme « comprendre le vrai problème »", "Tu te fixes l'objectif de signer aujourd'hui : un but clair canalise le stress", "Tu visualises le rendez-vous réussi pour activer ton propre circuit de la récompense"], "a": 1}, {"q": "\"Je dois d'abord en parler à mon associé.\" La meilleure suite ?", "o": ["\"Pas de souci, rappelez-moi quand c'est fait\"", "\"Et qu'est-ce qui se passe si votre associé vous déconseille d'y aller ?\" pour révéler sa vraie crainte", "Réciter trois arguments de plus pour le convaincre", "Proposer une remise pour accélérer"], "a": 1}, {"q": "Deal B2B à plusieurs interlocuteurs. Le vrai risque si tu n'impliques pas le décideur final ?", "o": ["Aucun, ton champion interne suffit", "Ton taux de closing chute fortement : la plupart des décisions B2B se prennent en équipe", "Tu gagnes du temps en évitant un interlocuteur", "Il signera quand même sur recommandation"], "a": 1}, {"q": "Dans un bon script d'appel, juste après avoir clarifié le besoin, l'étape suivante est de...", "o": ["reformuler sa problématique avec SES mots et obtenir un oui net", "présenter ton prix pour cadrer", "dérouler la liste de tes fonctionnalités", "closer directement, il est chaud"], "a": 0}]}, {"id": "m7", "num": "Module 7", "icon": "🚀", "title": "Performance & développement du vendeur", "subtitle": "Stress, intelligence émotionnelle, mindset, plan d'action", "gated": true, "videos": [{"id": "m7v1", "num": "Vidéo 1", "title": "Gestion du stress : le cortisol, ennemi n°1 du vendeur", "videoUrl": "https://www.skool.com/persua-7488/classroom/da77a1fd?md=614a9b9a97e7424c86b90392588fd400"}, {"id": "m7v2", "num": "Vidéo 2", ». Que s'est-il probablement passé ?", "o": ["Ton pitch était trop technique : il fallait simplifier le discours pour le remettre à l'aise.", "Il a senti que tu cherchais à vendre : il fallait annoncer ton objectif dès le départ.", "Son cerveau a capté tes signaux de stress sans les identifier, et il a mis ce malaise sur le compte de ton offre.", "Il n'était pas le vrai décisionnaire et cherchait une porte de sortie polie."], "a": 2}, {"q": "Avant un rendez-vous décisif, tu sens une tension nette mais tu restes lucide et concentré. Ton collègue te conseille de « te détendre complètement » avant d'entrer. D'après la loi de Yerkes-Dodson, que fais-tu ?", "o": ["Tu gardes cette tension modérée : à ce dosage, elle réveille l'énergie et aiguise l'attention.", "Tu suis son conseil : moins il y a de stress, mieux le cortex préfrontal fonctionne.", "Tu pars marcher 20 minutes sans téléphone pour redescendre à zéro avant d'entrer.", "Tu montes encore d'un cran : plus l'enjeu est haut, plus l'activation doit l'être."], "a": 0}, {"q": "Un deal important traîne depuis six semaines : le prospect ne dit ni oui ni non, et tu y penses en fond toute la journée. Quelle est la parade enseignée dans le module ?", "o": ["Relancer plus souvent pour forcer une réponse rapide, dans un sens ou dans l'autre.", "Accepter l'incertitude : elle fait partie du métier, il faut apprendre à vivre avec.", "Te reconnecter à la signature pour transformer ce stress en motivation.", "Créer de la clarté toi-même : décider toi-même quand ce deal est mort."], "a": 3}, {"q": "Pendant ta présentation, ton prospect était penché en avant et posait des questions. Depuis deux minutes, il s'est redressé, répond plus court, son ton a baissé. Que t'enseigne le pilier de l'empathie ?", "o": ["Accélérer vers la conclusion avant qu'il ne refroidisse complètement.", "Cette transition d'état (énergie, posture, ton) est le signal à percevoir au-delà de ses mots.", "Continuer ta présentation : tant qu'il ne formule pas d'objection, rien n'est perdu.", "Ressentir son inconfort comme le tien pour créer une vraie connexion émotionnelle."], "a": 1}, {"q": "Un prospect te lance sèchement : « Franchement, votre offre est deux fois trop chère. » Tu sens la moutarde monter. D'après la pratique du pilier de la régulation émotionnelle, que fais-tu dans la seconde qui suit ?", "o": ["Deux secondes de pause, puis la question : « quelle est la réponse la plus utile ici ? »", "Tu nommes ton agacement à voix haute devant lui pour en réduire l'intensité.", "Tu supprimes l'agacement et tu réponds avec un sourire parfaitement professionnel.", "Tu réponds du tac au tac pour montrer que le prix ne te fait pas peur."], "a": 0}, {"q": "Tu t'évalues sur les quatre piliers : conscience de soi 4/5, régulation 4/5, empathie 3/5, compétences sociales 2/5. Tu adores le contact et tu es à l'aise en soirée réseau. Que travailles-tu en priorité ?", "o": ["L'empathie : c'est le fondement de tout, donc toujours la priorité.", "La conscience de soi : sans elle, impossible de progresser sur les trois autres.", "Les compétences sociales : ton pilier le plus faible définit ton plafond de performance.", "L'empathie et les compétences sociales en parallèle, pour progresser plus vite."], "a": 2}, {"q": "Tu sors d'un rendez-vous raté : le prospect a coupé court au bout de vingt minutes. Ton premier réflexe : « je suis nul en découverte ». Si tu restes sur cette lecture, que se passe-t-il dans ton cerveau ?", "o": ["Rien de particulier : c'est de la lucidité, et la lucidité fait progresser.", "Il lit l'échec comme une menace et passe en mode défense, où tu apprends mal.", "Il consolidera quand même la leçon pendant la nuit, quelle que soit ta lecture.", "Il renforce malgré tout les connexions de la découverte, même sur un rendez-vous raté."], "a": 1}, {"q": "Trois semaines que tu répètes la même trame de découverte, et tu la déroules maintenant plus vite, plus fluide, sans y penser. Quel mécanisme du module explique ce gain "Pendant ta minute de reconnexion à la conviction, tu n'arrives pas à répondre à « pourquoi ce que je propose va vraiment aider cette personne ». Que t'enseigne le module ?", "o": ["Passe cette composante et compense avec une visualisation plus longue.", "Force une réponse positive : la conviction se construit en la répétant.", "Remplace la question par ton intention comportementale du jour.", "C'est une information précieuse en soi : prends-la au sérieux."], "a": 3}, {"q": "Journée marathon : sept rendez-vous enchaînés, dix minutes de battement entre chaque. Comment adaptes-tu ta préparation mentale ?", "o": ["Un rituel allégé de deux minutes entre chaque interaction.", "Le rituel complet de six minutes avant le premier rendez-vous, qui couvre toute la journée.", "Le rituel complet la veille au soir et le matin même.", "Respiration 4-6 seule : l'intention unique se fixe le matin pour toute la journée."], "a": 0}, {"q": "Un commercial de ton équipe finit la formation à fond : il veut appliquer la découverte, la présentation, les objections et les closings dès lundi. Que va-t-il probablement se passer, et pourquoi ?", "o": ["Il va progresser vite sur tout : l'enthousiasme du départ est le meilleur moment pour tout changer.", "Dans deux semaines, retour aux automatismes : le cerveau n'intègre qu'un ou deux nouveaux comportements à la fois.", "Il tiendra s'il a assez de volonté : c'est une question de discipline, pas de cerveau.", "Ça passera s'il dort suffisamment : le sommeil consolide tous les apprentissages en parallèle."], "a": 1}, {"q": "Tu construis ton plan d'action. Tu as tout compris du travail sur les objections et tu adores ce sujet, mais tes découvertes restent superficielles. Par quoi commences-tu tes deux premiers mois ?", "o": ["Les objections : démarrer par ce qu'on maîtrise déjà intellectuellement accélère les premières victoires.", "Un peu de tout, piloté par trois indicateurs hebdomadaires pour garder le cap.", "Les objections et la découverte ensemble : deux comportements, c'est exactement le maximum autorisé.", "La découverte : le diagnostic se base sur ce que tu appliques, pas sur ce que tu as compris."], "a": 3}, {"q": "Ce contrat peut sauver ton trimestre, tu DOIS le closer. Quel est le risque neuro ?", "o": ["Aucun, un objectif ambitieux mobilise tes ressources", "Ton énergie de besoin se sent et braque le prospect, ce qui baisse tes chances", "Tu vas mieux négocier sous la pression", "Ton prospect va te faire confiance plus vite"], "a": 1}, {"q": "Parler du prix te stresse. Le bon réflexe selon le corpus ?", "o": ["L'éviter le plus longtemps possible dans le RDV", "L'aborder tôt et calmement pour désamorcer : 53 pour cent des vendeurs n'osent pas", "Attendre que le prospect le demande de lui-même", "Gonfler le prix puis lâcher une remise"], "a": 1}, {"q": "Un dirigeant pressé t'annonce \"allez droit au but, j'ai 20 minutes\". Tes 90 premières secondes ?", "o": ["Pitch direct, il t'a donné la permission de sauter l'échauffement", "Ouvrir avec ton meilleur chiffre pour le marquer", "Aller vite mais dans le bon ordre : sa réalité, la pression retirée, l'alarme d'abord", "Prendre quand même 5 minutes de small talk"], "a": 2}]}];
const MOD = COURSE.map(m=>({id:m.id,num:m.num,icon:m.icon,t:m.title,sub:m.subtitle,V:m.videos||[],Q:m.quiz||[]}));
function M(id){return MOD.find(m=>m.id===id);}
function iType(v){return v.type||'video';}
function isBlocking(v){return (iType(v)==='video'&&!!v.videoUrl)||iType(v)==='fiche';}
function reqV(m){return m.V.filter(isBlocking);}
function vDone(m){return reqV(m).filter(v=>ST.done[v.id]).length;}
function allWatched(m){const r=reqV(m);return r.length>0 && r.every(v=>ST.done[v.id]);}
const LV=[0,300,620,960,1280,1560,1820];   // XP TOTAL requis pour débloquer M1..M7 (quiz validé + usage de l'app)
function xp(){return Object.keys(ST.done).length*25 + Object.keys(ST.quiz).length*100 + Object.keys(ST.gestes).filter(function(k){return ST.gestes[k];}).length*10 + Object.keys(ST.assist||{}).length*15 + (ST.bilans?ST.bilans.length*30:0) + Object.keys(ST.rdv||{}).length*40;}
function levelOf(x){let n=1;for(let i=0;i<LV.length;i++){if(x>=LV[i])n=i+1;}return n;}
function level(){return ST.levelForce||levelOf(xp());}
function openLevelInfo(){

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function shufOpts(q){var idx=q.o.map(function(_,i){return i;});shuffle(idx);return {ax:q.ax,q:q.q,o:idx.map(function(i){return q.o[i];}),a:idx.indexOf(q.a)};}

  var diagHTML='';try{if(FE.prof.positioning&&Object.keys(FE.prof.positioning).length){var d=computeDiag(FE.prof.positioning);diagHTML='<div class="card"><div class="plabel">Diagnostic</div><div class="nm">'+esc(d.arch.name)+' · '+esc(d.type)+'</div><div class="mt">DISC '+d.dom+'/'+d.sec+' · maillon faible : '+(d.weakest?esc(d.weakest.label)+' ('+d.weakest.score+'/5)':'n/a')+'</div></div>';}}catch(e){}
  var apiNote=location.hostname.indexOf('github.io')>=0?'<div class="mt" style="margin-top:6px">La génération IA s\'active une fois l\'app déployée sur le domaine. Ici tu peux écrire l\'analyse à la main.</div>':'';
  setM('Fiche · '+esc(s.first_name||s.email||'Élève'),
    '<div class="card"><div class="plabel">Dernier bilan · 4 axes</div>'+bilHTML+'</div>'+
    diagHTML+
    '<h3 class="sh">Journal de vente · '+FE.journal.length+'</h3><div class="card">'+jHTML+'</div>'+
    '<h3 class="sh">Humeurs récentes</h3><div class="card">'+cHTML+'</div>'+
    '<h3 class="sh">🧠 Analyse IA (privée · l\'élève ne la voit jamais)</h3>'+
    '<div class="card"><textarea id="ca-text" class="caform" rows="8" placeholder="Analyse du profil…">'+esc(FE.analysis)+'</textarea>'+
    (FE.analysisAt?'<div class="mt" style="margin-top:6px">Dernière MAJ : '+new Date(FE.analysisAt).toLocaleDateString('fr-FR')+'</div>':'')+apiNote+
    '<div style="display:flex;gap:8px;margin-top:12px"><button class="cta" style="background:#eef0ff;color:#3730a3" onclick="saveAnalyse()">Sauvegarder</button><button class="cta" onclick="genAnalyse()">⚡ Générer (IA)</button></div></div>'+
    '<button class="cta" style="margin-top:12px;background:#eef0ff;color:#3730a3" onclick="closeModal()">← Retour</button>');
  document.querySelector('#modal .ov-body').scrollTop=0;
}
function saveAnalyse(){
  var t=((document.getElementById('ca-text')||{}).value||'');FE.analysis=t;
  if(isSupa&&sb._uid)sb.from('coach_analyses').upsert({user_id:FE.s.id,analysis:t,updated_at:new Date().toISOString()}).then(function(r){toastMini(r&&r.error?'Échec sauvegarde':'Analyse sauvegardée ✅');},function(){toastMini('Échec sauvegarde');});
  else toastMini('Sauvegarde dispo avec le backend.');
}
function buildAnalysePayload(){
  var pos=FE.prof.positioning||{};var qa=[];try{qa=POSQ.map(function(q){var v=pos[q.id];var ans=v;if(q.kind!=='scale'&&q.options){var o=q.options.find(function(x){return x.tag===v;});ans=o?o.label:v;}return {section:q.section,question:q.title,answer:ans||''};});}catch(e){}
  var diag=null;try{var d=computeDiag(pos);diag={type:d.type+' ('+d.nickname+')',archetype:{name:d.arch.name},disc:d.dom+' dominant, '+d.sec+' secondaire ('+d.disc.label+')',funnel:d.funnel.map(function(f){return f.label+' '+f.score+'/5';}).join(' · '),maillonFaible:d.weakest?d.weakest.label+' ('+d.weakest.score+'/5)':null,forces:[d.disc.force],anglesMorts:[d.disc.vigilance],moteur:d.moteur,soncas:(d.son||[]).map(function(x){return x.label;}).join(', '),affinites:''};}catch(e){}
  return {studentName:FE.prof.first_name||FE.s.first_name||'',qa:qa,diagnostic:diag,onboarding:FE.prof.onboarding||{}};
}
async function genAnalyse(){
  var box=document.getElementById('ca-text'); if(!box)return;
  if(!isSupa){toastMini('Génération dispo avec le backend.');return;}
  var payload=buildAnalysePayload(),prev=FE.analysis;
  box.value='Génération en cours…';
  try{
    var sess=(await sb.auth.getSession()).data.session,token=sess&&sess.access_token;
    var res=await fetch('/api/coach-analysis',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(payload)});
    if(!res.ok){box.value=prev;toastMini(res.status===404?'Génération IA dispo en prod (Vercel).':'Erreur '+res.status);return;}
    var reader=res.body.getReader(),dec=new TextDecoder(),full='';
    while(true){var ch=await reader.read();if(ch.done)break;full+=dec.decode(ch.value,{stream:true});box.value=full;box.scrollTop=box.scrollHeight;}
    FE.analysis=full;saveAnalyse();
  }catch(e){box.value=prev;toastMini('Génération indisponible ici.');}
}

/* Entraînement : jeu d'apprentissage, correction immédiate à chaque carte (sans note, sans blocage) */
let TR=null;
function qForVideo(m,vId){var vids=m.V.filter(function(v){return iType(v)==='video';});var j=vids.findIndex(function(v){return v.id===vId;});if(j<0)return m.Q;var per=Math.max(1,Math.ceil(m.Q.length/(vids.length||1)));var s=m.Q.slice(j*per,j*per+per);return s.length?s:m.Q.slice(0,per);}
function openTrain(mId){TR={mId:mId,vId:null,qs:M(mId).Q,i:0,ans:{},rev:{},score:0};renderTrain();openModal();}
function openTrainV(mId,vId){TR={mId:mId,vId:vId,qs:qForVideo(M(mId),vId),i:0,ans:{},rev:{},score:0};renderTrain();openModal();}
function renderTrain(){
  const m=M(TR.mId),qs=TR.qs,q=qs[TR.i],last=TR.i===qs.length-1,rev=!!TR.rev[TR.i],picked=TR.ans[TR.i];
  const v=TR.vId?m.V.find(x=>x.id===TR.vId):null;
  const vlink=(v&&v.videoUrl)?`<div class="card" style="background:#eef0ff;border-color:#e0e3ff;padding:11px"><div class="mt" style="color:#3730a3;font-weight:600">Exercice sur : ${v.title}</div><button class="cta" style="margin-top:8px;background:#4f46e5" onclick="window.open('${v.videoUrl}','_blank','noopener')">▶ Revoir la vidéo ↗</button></div>`:'';
  setM('Exercice · '+m.num,`
    ${vlink}
    <div class="mt" style="margin-bottom:8px">Carte ${TR.i+1} / ${qs.length} · score ${TR.score}</div>
    <div class="pbar" style="margin-bottom:14px"><i style="width:${Math.round(TR.i/qs.length*100)}%"></i></div>
    <div class="card"><div class="nm" style="font-size:14px;line-height:1.5">${q.q}</div>
      ${q.o.map((o,oi)=>{let st='';if(rev){if(oi===q.a)st='background:#dcfce7;border-color:#16a34a;color:#166534;font-weight:600';else if(oi===picked)st='background:#fee2e2;border-color:#dc2626;color:#991b1b';}return `<div class="qopt" style="${st}" onclick="pickTrain(${oi})">${o}</div>`;}).join('')}
      ${rev?`<div class="mt" style="margin-top:10px;font-weight:700;color:${picked===q.a?'#166534':'#991b1b'}">${picked===q.a?'✓ Juste. Tu as capté le mécanisme.':"✗ Presque. La bonne réponse est en vert, relis-la, c'est comme ça qu'on apprend."}</div>`:`<div class="mt" style="margin-top:8px">Choisis, la correction s'affiche direct.</div>`}
    </div>
    <button class="cta" style="${rev?'':'opacity:.45;pointer-events:none'}" onclick="${last?'finishTrain()':'trainNav()'}">${last?'Voir mon récap':'Carte suivante →'}</button>`);
  document.querySelector('#modal .ov-body').scrollTop=0;
}
function pickTrain(oi){if(TR.rev[TR.i])return;TR.ans[TR.i]=oi;TR.rev[TR.i]=true;if(oi===TR.qs[TR.i].a)TR.score++;renderTrain();}
function trainNav(){TR.i++;renderTrain();}
function finishTrain(){const m=M(TR.mId),n=TR.qs.length,rejouer=TR.vId?`openTrainV('${TR.mId}','${TR.vId}')`:`openTrain('${TR.mId}')`;
  if(TR.vId){ST.exoDone=ST.exoDone||{};ST.exoDone[TR.vId]=true;save();}
  setM('Exercice · '+m.num,`
    <div class="card" style="text-align:center;background:#eef0ff;border-color:#e0e3ff">
      <div style="font-size:34px;font-weight:800;color:#3730a3">${TR.score}/${n}</div>
      <div class="mt" style="color:#3730a3;font-weight:600">C'est un entraînement, pas une note. Rejoue autant que tu veux : chaque erreur t'apprend le mécanisme.</div></div>
    <button class="cta" onclick="${rejouer}">🎮 Rejouer</button>
    <button class="cta" style="margin-top:8px;background:#eef0ff;color:#3730a3" onclick="openModule('${TR.mId}',${curMod.i})">← Retour au module</button>`);
  document.querySelector('#modal .ov-body').scrollTop=0;
}

/* Quiz réel, une question à la fois, avec correction */
let QZ=null;
function openQuiz(mId){QZ={mId,i:0,ans:{}};renderQ();openModal();}
function renderQ(){
  const m=M(QZ.mId),q=m.Q[QZ.i],last=QZ.i===m.Q.length-1,picked=QZ.ans[QZ.i];
  setM('Quiz · '+m.num,`
    <div class="mt" style="margin-bottom:8px">Question ${QZ.i+1} / ${m.Q.length}</div>
    <div class="pbar" style="margin-bottom:14px"><i style="width:${Math.round(QZ.i/m.Q.length*100)}%"></i></div>
    <div class="card"><div class="nm" style="font-size:14px;line-height:1.5">${q.q}</div>
      ${q.o.map((o,oi)=>`<div class="qopt ${picked===oi?'on':''}" onclick="pickQ(${oi})">${o}</div>`).join('')}</div>
    <div style="display:flex;gap:8px">
      ${QZ.i>0?'<button class="cta" style="background:#eef0ff;color:#3730a3" onclick="qnav(-1)">Précédent</button>':''}
      <button class="cta" style="${picked==null?'opacity:.45;pointer-events:none':''}" onclick="${last?`submitQuiz('${QZ.mId}')`:'qnav(1)'}">${last?'Voir mon score':'Suivant →'}</button>
    </div>`);
  document.querySelector('#modal .ov-body').scrollTop=0;
}
function pickQ(oi){QZ.ans[QZ.i]=oi;renderQ();}
function qnav(d){QZ.i+=d;renderQ();}
function submitQuiz(mId){
  const m=M(mId);let sc=0;m.Q.forEach((q,qi)=>{if(QZ.ans[qi]===q.a)sc++;});
  const need=Math.ceil(m.Q.length*0.7),pass=sc>=need;
  if(pass){var isNew=!ST.quiz[mId];ST.quiz[mId]=true;save();if(isNew)xpToast(100);refreshHeader();}
  setM('Résultat · '+m.num,`
    <div class="card" style="text-align:center;background:${pass?'#dcfce7':'#fee2e2'};border-color:${pass?'#bbf7d0':'#fecaca'}">
      <div style="font-size:34px;font-weight:800;color:${pass?'#166534':'#991b1b'}">${sc}/${m.Q.length}</div>
      <div class="mt" style="color:${pass?'#166534':'#991b1b'};font-weight:600">${pass?'Module validé, le suivant est débloqué.':'Il te faut '+need+'/'+m.Q.length+'. Revois les vidéos et réessaie.'}</div>
    </div>
    <h3 class="sh">Ta correction</h3>
    ${m.Q.map((q,qi)=>{const ok=QZ.ans[qi]===q.a;return `<div class="card"><div class="mt" style="font-weight:700;color:${ok?'#166534':'#991b1b'}">${ok?'✓ Juste':'✗ Faux'} · Q${qi+1}</div><div style="font-size:12.5px;margin:5px 0;color:#2a2e3d;line-height:1.45">${q.q}</div><div class="mt" style="color:#166534"><b>Bonne réponse :</b> ${q.o[q.a]}</div>${ok?'':`<div class="mt" style="color:#991b1b;margin-top:3px">Ta réponse : ${QZ.ans[qi]!=null?q.o[QZ.ans[qi]]:'(vide)'}</div>`}</div>`;}).join('')}
    <button class="cta" onclick="${pass?"closeModal();go('parcours')":`openQuiz('${mId}')`}" style="margin-top:6px">${pass?'Continuer le parcours':'Refaire le quiz'}</button>`);
}

/* ---- Moteur de diagnostic (réutilisé de app.persua-neurovente) ---- */
function diagAxis(ans,ids,a,b){var na=0,nb=0;ids.forEach(function(id){var raw=ans[id]||'';if(raw===a){na++;return;}if(raw===b){nb++;return;}var v=parseInt(raw,10);if(v===1||v===2)na+=3-v;else if(v===4||v===5)nb+=v-3;});return na>=nb?a:b;}
function computeDiag(ans){
  var type=diagAxis(ans,['ei1','ei2','ei3'],'E','I')+diagAxis(ans,['sn1','sn2','sn3'],'S','N')+diagAxis(ans,['tf1','tf2','tf3'],'T','F')+diagAxis(ans,['jp1','jp2','jp3'],'J','P');
  var t=DTYPES[type]||{nickname:'Profil unique',blurb:'Un profil rare et nuancé.'};
  var counts={D:0,I:0,S:0,C:0};POSQ.filter(function(q){return q.cat==='disc';}).forEach(function(q){var v=ans[q.id];if(v&&counts[v]!==undefined)counts[v]++;});
  var ranked=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];});
  var dom=ranked[0]||'D',sec=ranked[1]||'C';
  var funnel=Object.keys(DFUNL).map(function(key){return {key:key,label:DFUNL[key],score:parseInt(ans[key]||'0',10),module:DFUNM[key]};});
  var scored=funnel.filter(function(f){return f.score>0;});
  var weakest=scored.length?scored.reduce(function(a,b){return b.score<a.score?b:a;}):null;
  var sonCounts={};POSQ.filter(function(q){return q.cat==='soncas';}).forEach(function(q){var v=ans[q.id];if(v)sonCounts[v]=(sonCounts[v]||0)+1;});
  var sonTop=Object.keys(sonCounts).sort(function(a,b){return sonCounts[b]-sonCounts[a];}).filter(function(k){return DSON[k];}).slice(0,3).map(function(k){return {key:k,label:DSON[k].label,desc:DSON[k].desc};});
  return {type:type,nickname:t.nickname,blurb:t.blurb,dom:dom,sec:sec,disc:DDISC[dom],arch:DARCH[dom],funnel:funnel,weakest:weakest,son:sonTop,moteur:DMOT[ans['m_moteur']]||'ta réussite'};
}
/* ---- Déroulé des deux tests (personnalité + niveau terrain), réponses 1->5 en barre ---- */
function diagStart(){ST.diagAns=ST.diagAns||{};ST.DR={i:0};renderDiag();openModal();}
function renderDiag(){var i=ST.DR.i,q=POSQ[i],picked=ST.diagAns[q.id];
  var phase=(q.cat==='funnel')?'Test 2 · ton niveau terrain':'Test 1 · ton profil de vendeur';
  var body;
  if(q.kind==='scale'){
    body='<div class="scalebar">'+[1,2,3,4,5].map(function(v){return '<div class="seg '+(picked===(''+v)?'on':'')+'" onclick="diagAns(\''+q.id+'\',\''+v+'\')">'+v+'</div>';}).join('')+'</div><div class="scaleends"><span>'+(q.low||'')+'</span><span>'+(q.high||'')+'</span></div>';
  } else {
    body=q.options.map(function(o){return '<div class="qopt '+(picked===o.tag?'on':'')+'" onclick="diagAns(\''+q.id+'\',\''+o.tag+'\')">'+o.label+'</div>';}).join('');
  }
  var last=i===POSQ.length-1;
  setM('Diagnostic',`
    <div class="mt" style="margin-bottom:6px">${phase} · ${i+1}/${POSQ.length}</div>
    <div class="pbar" style="margin-bottom:16px"><i style="width:${Math.round((i+1)/POSQ.length*100)}%"></i></div>
    <div class="plabel">${q.section}</div>
    <div class="nm" style="font-size:16px;margin:6px 0 14px;line-height:1.4">${q.title}</div>
    ${body}
    <div style="display:flex;gap:8px;margin-top:18px">${i>0?'<button class="cta" style="background:#eef0ff;color:#3730a3" onclick="diagNav(-1)">Précédent</button>':''}
    <button class="cta" style="${picked==null?'opacity:.45;pointer-events:none':''}" onclick="diagNext()">${last?'Voir mon profil':'Suivant →'}</button></div>`);
  document.querySelector('#modal .ov-body').scrollTop=0;
}
function diagAns(id,val){ST.diagAns[id]=val;save();ST.DR.i=Math.min(POSQ.length-1,ST.DR.i);renderDiag();}
function diagNav(d){ST.DR.i+=d;renderDiag();}
function diagNext(){if(ST.DR.i<POSQ.length-1){ST.DR.i++;renderDiag();}else diagFinish();}
function diagFinish(){ST.diag=computeDiag(ST.diagAns);ST.diagDone=true;ST.test=true;save();refreshHeader();xpToast(60);if(isSupa&&sb._uid)sb.from('profiles').update({positioning:ST.diagAns,positioning_submitted_at:new Date().toISOString()}).eq('id',sb._uid).then(function(){},function(){});openProfil();}

}

function togGeste(id){var was=ST.gestes[id];ST.gestes[id]=!was;save();if(!was)xpToast(10);go('gestes');}
function markRdv(){var k='r'+dayNum();ST.rdv=ST.rdv||{};if(!ST.rdv[k]){ST.rdv[k]=true;save();xpToast(40);refreshHeader();}go('rdv');}
function amode(m,btn){document.getElementById('a-quick').style.display=m==='quick'?'':'none';document.getElementById('a-chat').style.display=m==='chat'?'':'none';btn.parentElement.querySelectorAll('.segb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function publier(){const el=document.getElementById('cinp');const v=el.value.trim();if(!v)return;ST.posts.unshift({av:"M",who:"Marc D. (toi)",when:"à l'instant",body:v,k:0,c:0});save();go('communaute');}

/* Tutoriel interactif au premier lancement */
const ONBOARD=[
 {e:"👋",t:"Bienvenue dans ton parcours",x:"Ta formation neurovente, en app. Voici comment ça marche, en 30 secondes."},
 {e:"🗺️",t:"Le parcours",x:"7 modules. Dans chacun : les vidéos, un exercice par vidéo, et un quiz de validation."},
 {e:"🔓",t:"Débloquer la suite",x:"Valider le quiz ne suffit pas. Il faut aussi utiliser l'app : gestes, assistant, séances. Tout te fait gagner de l'XP, et c'est l'XP qui ouvre le module suivant."},
 {e:"☀️",t:"Chaque jour",x:"Ton Assistant te donne un conseil et un défi qui changent tous les jours. Et tu coches tes gestes du jour."},
 {e:"📈",t:"Ta progression",x:"Chaque semaine, fais ton bilan. Ton radar et tes courbes montrent ton évolution sur les 4 axes."},
 {e:"🚀",t:"À toi de jouer",x:"Réserve tes séances avec Steven, échange dans la communauté, et progresse à ton rythme."}
];
let obStep=0;
function startOnboarding(){obStep=0;var o=document.createElement('div');o.id='onboard';document.querySelector('.device').appendChild(o);renderOnboard();}
function renderOnboard(){var o=document.getElementById('onboard');if(!o)return;var s=ONBOARD[obStep],last=obStep===ONBOARD.length-1;
  o.innerHTML=`<div class="ob-card pop"><div class="ob-emoji bob">${s.e}</div><div class="ob-title">${s.t}</div><div class="ob-text">${s.x}</div>
    <div class="ob-dots">${ONBOARD.map(function(_,i){return `<span class="${i===obStep?'on':''}"></span>`;}).join('')}</div>
    <button class="cta" onclick="obNext()">${last?"C'est parti":'Suivant'}</button>${last?'':'<div class="ob-skip" onclick="obDone()">passer</div>'}</div>`;
}
function obNext(){if(obStep<ONBOARD.length-1){obStep++;renderOnboard();}else obDone();}
function obDone(){ST.seen=true;save();var o=document.getElementById('onboard');if(o)o.remove();}

function enterApp(){var s=document.getElementById('splash');if(s){s.classList.add('hide');setTimeout(function(){s.style.display='none';},450);}
  if(isSupa){if(!ST.coach&&!window._onbDone){setTimeout(showOnboarding,350);}else{enterAppFlow();}return;}
  if(!ST.diagDone)setTimeout(diagStart,300);}
function showSplash(){var au=document.getElementById('auth');if(au)au.style.display='none';var s=document.getElementById('splash');if(s){s.classList.remove('hide');s.style.display='flex';s.style.opacity='';}}
function touchStreak(){var t=dayNum();if(ST.lastDay===t)return;if(ST.lastDay===t-1)ST.streak=(ST.streak||0)+1;else ST.streak=1;ST.lastDay=t;save();}
/* ---- Auth (vraie app, quand Supabase configuré) ---- */
function authErr(m){var e=document.getElementById('au-err');if(e)e.textContent=m;}
function showAuth(mode){mode=mode||'login';var o=document.getElementById('auth');o.style.display='flex';
  o.innerHTML=`<div class="auth-card"><div class="auth-brand">PERSUA</div><div class="auth-t">${mode==='login'?'Connexion':'Créer ton compte'}</div>
    <input id="au-email" type="email" inputmode="email" placeholder="Email" autocomplete="email">
    <input id="au-pass" type="password" placeholder="Mot de passe" autocomplete="${mode==='login'?'current-password':'new-password'}">
    <div id="au-err" class="auth-err"></div>
    <button class="cta" onclick="authSubmit('${mode}')">${mode==='login'?'Se connecter':'Créer mon compte'}</button>
    <div class="auth-switch" onclick="showAuth('${mode==='login'?'signup':'login'}')">${mode==='login'?'Pas encore de compte ? En créer un':'Déjà un compte ? Se connecter'}</div>
    ${mode==='login'?'<div class="auth-switch" style="opacity:.8" onclick="authForgot()">Mot de passe oublié ?</div>':''}</div>`;
}
function authForgot(){var email=(document.getElementById('au-email')||{}).value;if(!email){authErr('Entre ton email d\'abord.');return;}authErr('Envoi…');sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}).then(function(r){authErr(r.error?r.error.message:'Email envoyé. Regarde ta boîte (et tes spams), le lien ouvre l\'écran nouveau mot de passe.');});}
function showNewPassword(){var o=document.getElementById('auth');o.style.display='flex';o.innerHTML='<div class="auth-card"><div class="auth-brand">PERSUA</div><div class="auth-t">Nouveau mot de passe</div><input id="np-pass" type="password" placeholder="Nouveau mot de passe" autocomplete="new-password"><div id="au-err" class="auth-err"></div><button class="cta" onclick="submitNewPassword()">Valider</button></div>';}
function submitNewPassword(){var p=(document.getElementById('np-pass')||{}).value;if(!p||p.length<6){authErr('6 caractères minimum.');return;}authErr('…');sb.auth.updateUser({password:p}).then(function(r){if(r.error){authErr(r.error.message);return;}var au=document.getElementById('auth');if(au)au.style.display='none';loadUserData().then(afterLogin);});}
function authSubmit(mode){var email=(document.getElementById('au-email')||{}).value,pass=(document.getElementById('au-pass')||{}).value;
  if(!email||!pass){authErr('Email et mot de passe requis.');return;}authErr('…');
  var pr=mode==='login'?sb.auth.signInWithPassword({email:email,password:pass}):sb.auth.signUp({email:email,password:pass});
  pr.then(function(res){if(res.error){authErr(res.error.message);return;}
    if(mode==='signup'&&!res.data.session){authErr('Compte créé. Confirme ton email puis connecte-toi.');return;}
    loadUserData().then(afterLogin);
  },function(){authErr('Erreur, réessaie.');});
}
function logout(){if(isSupa&&sb){sb.auth.signOut().then(function(){location.reload();},function(){location.reload();});setTimeout(function(){location.reload();},1500);}else{location.reload();}}
/* ---- Onboarding 1re connexion (nom, prénom, photo, secteur) ---- */
const SECTORS=['Entrepreneur / Dirigeant','Commercial','Directeur commercial','Consultant / Freelance','Coach / Formateur','Autre'];
var _obFile=null,_obDataUrl='';
function showOnboarding(){
  var o=document.getElementById('auth');o.style.display='flex';
  var sec=window._sector||'';
  o.innerHTML='<div class="auth-card"><div class="auth-brand">PERSUA</div><div class="auth-t">On fait connaissance</div>'+
    '<div class="ob-photo"><div id="ob-av" class="ob-av"'+(_obDataUrl?' style="background-image:url('+_obDataUrl+');background-size:cover;background-position:center"':'')+'>'+(_obDataUrl?'':'📷')+'</div>'+
    '<label class="ob-pick">Ajouter ta photo<input id="ob-file" type="file" accept="image/*" style="display:none" onchange="obPreview(event)"></label></div>'+
    '<input id="ob-first" placeholder="Prénom" value="'+esc(window._fn||'')+'">'+
    '<input id="ob-last" placeholder="Nom" value="'+esc(window._ln||'')+'">'+
    '<select id="ob-sector" onchange="obSectorChange()">'+
      '<option value="">Ton secteur…</option>'+SECTORS.map(function(s){return '<option value="'+s+'"'+(sec===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select>'+
    '<input id="ob-other" placeholder="Précise ton secteur" value="'+esc(window._sectorOther||'')+'" style="'+(sec==='Autre'?'':'display:none')+'">'+
    '<div id="ob-err" class="auth-err"></div>'+
    '<button class="cta" onclick="submitOnboarding()">C\'est parti →</button></div>';
}
function obSectorChange(){var s=document.getElementById('ob-sector').value,o=document.getElementById('ob-other');if(o)o.style.display=(s==='Autre')?'':'none';}
function obPreview(ev){var f=ev.target.files&&ev.target.files[0];if(!f)return;_obFile=f;var r=new FileReader();r.onload=function(e){_obDataUrl=e.target.result;var av=document.getElementById('ob-av');if(av){av.style.backgroundImage='url('+_obDataUrl+')';av.style.backgroundSize='cover';av.style.backgroundPosition='center';av.textContent='';}};r.readAsDataURL(f);}
async function submitOnboarding(){
  var first=(document.getElementById('ob-first')||{}).value||'',last=(document.getElementById('ob-last')||{}).value||'';
  var sector=(document.getElementById('ob-sector')||{}).value||'',other=(document.getElementById('ob-other')||{}).value||'';
  if(!first.trim()){document.getElementById('ob-err').textContent='Ton prénom, au minimum.';return;}
  if(!sector){document.getElementById('ob-err').textContent='Choisis ton secteur.';return;}
  if(sector==='Autre'&&!other.trim()){document.getElementById('ob-err').textContent='Précise ton secteur.';return;}
  document.getElementById('ob-err').textContent='…';
  var avatar_url=window._avatar||'';
  try{
    if(_obFile&&isSupa&&sb._uid){
      var ext=(_obFile.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
      var path=sb._uid+'/avatar_'+Date.now()+'.'+ext;
      var up=await sb.storage.from('avatars').upload(path,_obFile,{upsert:true});
      if(!up.error) avatar_url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
    }
  }catch(e){}
  window._fn=first.trim();window._ln=last.trim();window._sector=sector;window._sectorOther=other.trim();
  if(avatar_url){ST.avatar=avatar_url;window._avatar=avatar_url;}
  window._onbDone=true;save();
  if(isSupa&&sb._uid){sb.from('profiles').update({first_name:first.trim(),last_name:last.trim(),onboarding_done:true,onboarding:{sector:sector,sectorOther:other.trim(),avatar_url:avatar_url}}).eq('id',sb._uid).then(function(){},function(){});}
  var au=document.getElementById('auth');if(au)au.style.display='none';
  enterAppFlow();
}
/* ---- Flux post-connexion ---- */
function enterAppFlow(){touchStreak();if(ST.coach){go('coach');return;}go('parcours');if(!ST.diagDone)setTimeout(diagStart,300);}
function afterLogin(){
  if((location.hash+location.search).toLowerCase().indexOf('boost')>=0){ST.streak=367;ST.levelForce=327;ST.lastDay=dayNum();save();}
  renderTabs(ST.coach?'coach':'parcours');if(!ST.coach&&!window._access){showNoAccess();return;}if(!ST.coach&&!window._onbDone){showSplash();return;}var au=document.getElementById('auth');if(au)au.style.display='none';enterAppFlow();}
function showNoAccess(){var o=document.getElementById('auth');o.style.display='flex';o.innerHTML='<div class="auth-card"><div class="auth-brand">PERSUA</div><div class="auth-t">Accès en attente</div><div class="mt" style="text-align:center;line-height:1.55">Ton compte est bien créé, mais l\'accès à la formation n\'est pas encore activé pour cet email. Si tu viens de régler, ça s\'active en quelques minutes. Sinon, écris à Steven pour débloquer ton accès.</div><button class="cta" style="margin-top:16px" onclick="location.reload()">↻ J\'ai réglé, rafraîchir</button><div class="auth-switch" onclick="logout()">Se déconnecter</div></div>';}
/* ---- Back-office coach : gestion des accès (access_grants) ---- */
var ACC=[];
const TIERS=[['academie','Académie'],['mentorat','Mentorat'],['immersion','Immersion']];
var _newTier='academie';
function tierLabel(t){var f=TIERS.find(function(x){return x[0]===t;});return f?f[1]:(t||'Académie');}
async function openAcces(){setM('Accès à la formation','<div class="mt">Chargement…</div>');openModal();try{var r=await sb.from('access_grants').select('email,active,tier,updated_at').order('updated_at',{ascending:false});ACC=r.data||[];}catch(e){ACC=[];}renderAcces();}
function renderAcces(){
  var list=ACC.length?ACC.map(function(g,i){return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="g" style="min-width:0"><div class="nm" style="word-break:break-all">'+esc(g.email)+'</div><div class="mt">'+(g.active?'✅ actif':'⏸️ suspendu')+' · '+esc(tierLabel(g.tier))+'</div></div><button class="cta" style="width:auto;margin:0;padding:8px 12px;'+(g.active?'background:#fee2e2;color:#991b1b':'')+'" onclick="toggleAcces('+i+')">'+(g.active?'Suspendre':'Activer')+'</button></div><div class="acctiers">'+TIERS.map(function(t){return '<button class="jtag '+(g.tier===t[0]?'on':'')+'" onclick="setAccesTier('+i+',\''+t[0]+'\')">'+t[1]+'</button>';}).join('')+'</div></div>';}).join(''):'<div class="card"><div class="mt">Aucun accès pour l\'instant.</div></div>';
  setM('Accès à la formation',
    '<div class="card"><div class="plabel">Ajouter un accès</div><input id="acc-email" class="jinp" type="email" inputmode="email" placeholder="email@eleve.com">'+
    '<div class="acctiers" style="margin-top:8px">'+TIERS.map(function(t,i){return '<button class="jtag '+(i===0?'on':'')+'" data-t="'+t[0]+'" onclick="pickNewTier(this)">'+t[1]+'</button>';}).join('')+'</div>'+
    '<button class="cta" style="margin-top:12px" onclick="addAcces()">Donner l\'accès</button></div>'+
    '<h3 class="sh">Les accès · '+ACC.length+'</h3>'+list);
}
function pickNewTier(btn){_newTier=btn.getAttribute('data-t');var p=btn.parentElement;p.querySelectorAll('.jtag').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');}
async function addAcces(){var em=(((document.getElementById('acc-email')||{}).value)||'').trim().toLowerCase();if(!em||em.indexOf('@')<1){toastMini('Email valide requis.');return;}var r=await sb.from('access_grants').upsert({email:em,active:true,tier:_newTier,source:'coach',updated_at:new Date().toISOString()});if(r.error){toastMini('Échec : '+r.error.message);return;}toastMini('Accès donné ✅');openAcces();}
async function toggleAcces(i){var g=ACC[i];if(!g)return;var r=await sb.from('access_grants').update({active:!g.active,updated_at:new Date().toISOString()}).eq('email',g.email);if(r.error){toastMini('Échec');return;}g.active=!g.active;renderAcces();}
async function setAccesTier(i,t){var g=ACC[i];if(!g)return;var r=await sb.from('access_grants').update({tier:t,updated_at:new Date().toISOString()}).eq('email',g.email);if(r.error){toastMini('Échec');return;}g.tier=t;renderAcces();toastMini('Niveau : '+tierLabel(t));}
/* ---- Démarrage ---- */
if(isSupa){
  var _sp=document.getElementById('splash');if(_sp)_sp.style.display='none';
  var _recovery=false;
  sb.auth.onAuthStateChange(function(event){if(event==='PASSWORD_RECOVERY'){_recovery=true;showNewPassword();}});
  sb.auth.getSession().then(function(res){
    if(_recovery)return;
    if(res.data&&res.data.session){loadUserData().then(afterLogin);}
    else{go('parcours');showAuth('login');}
  });
}else{
  touchStreak();
  go('parcours');
}
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js")})}</script>
