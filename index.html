  .post .body{font-size:13.5px;color:#2a2e3d;line-height:1.42}
  .post .acts{display:flex;gap:16px;margin-top:9px;font-size:12.5px;color:var(--muted);font-weight:600;cursor:pointer}
  .tagchip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef0ff;color:#3730a3;cursor:pointer}
  .tabbar{position:absolute;bottom:0;left:0;right:0;min-height:66px;padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--muted);cursor:pointer;font-weight:600}

  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

const KEY='persua_app_v1';

ST.done=ST.done||{}; ST.quiz=ST.quiz||{}; ST.gestes=ST.gestes||{}; ST.test=ST.test||false; ST.posts=ST.posts||[]; ST.eleve=ST.eleve||false; ST.bilans=ST.bilans||[];

/* Par défaut tout est ouvert (toi, aucun réglage). Le lien partagé à la communauté finit par #eleve : il active le mode élève (déblocage par niveau). #open pour revenir en accès complet. */

/* Contenu réel de la formation (vidéos + quiz) injecté depuis l'espace membre */
const COURSE = [{"id": "m1", "num": "Module 1", "icon": "🧠", "title": "Les fondements neuro-comportementaux", "subtitle": "Comment le cerveau de l'acheteur (et le tien) décide vraiment", "gated": true, "videos": [{"id": "m1v1", "num": "Vidéo 1", "title": "Les 3 cerveaux", "videoUrl": "https://www.skool.com/persua-7488/classroom/7d5cfb37?md=23fbfa2063c04aa7b5e1ebaac868a0e0"}, {"id": "m1v2", "num": "Vidéo 2", "title": "Comment une décision d'achat se forme", "videoUrl": "https://www.skool.com/persua-7488/classroom/7d5cfb37?md=87e724a52edf48ceadd07726fb42c204"}, {"id": "m1v3", "num": "Vidéo 3", "title": "Le rôle de l'amygdale : émotion avant raison", "videoUrl": "https://www.skool.com/persua-7488/classroom/7d5cfb37?md=e3fdd6106af34293a5632c66201c4d29"}, {"id": "m1v4", "num": "Vidéo 4", "title": "Neurotransmetteurs clés : dopamine, sérotonine, cortisol", "videoUrl": "https://www.skool.com/persua-7488/classroom/7d5cfb37?md=e5ebbc473d404e6e86a4f57a254487a7"}, {"id": "m1v5", "num": "Vidéo 5", "title": "Le cerveau du vendeur : stress, performance, flow", "videoUrl": "https://www.skool.com/persua-7488/classroom/7d5cfb37?md=d5f6c04455de4a35a02bed65efd86b66"}, {"id": "m1f1", "num": "Fiche", "title": "Fiche neuro : à lire et garder", "type": "fiche", "fiche": "<p class=\"lead\">Ton prospect ne réagit pas à la réalité. Il réagit à ce que son cerveau avait prédit une fraction de seconde avant. Comprends ça, et tu arrêtes de vendre des bénéfices dans le vide.<\/p><h4>Le cerveau devine, il ne reçoit pas<\/h4><p>Le cerveau ne réceptionne pas l'information, il la prédit, puis il compare à la réalité. Si ça colle, il ne dépense rien. Si ça cloche, il corrige, et ça lui coûte de l'énergie. Son obsession : minimiser la surprise.<\/p><ul><li>Tu descends un escalier sans regarder. Une marche en trop que tu n'avais pas prévue, et tu titubes : erreur de prédiction.<\/li><li>Ton frigo fait du bruit, puis tu ne l'entends plus. Le bruit n'a pas changé, ta prédiction l'a classé inutile.<\/li><li>Tu lis un texte plein de fautes sans les voir. Ton cerveau lit ce qu'il a prédit, pas les lettres.<\/li><\/ul><h4>En vente, ça change tout<\/h4><p>Il n'achète pas ce qui lui ferait le plus plaisir, il achète ce qu'il peut prédire. Le même vin annoncé à 90 euros a vraiment meilleur goût qu'à 10 euros : le cortex orbitofrontal s'active plus fort. Le McDo noté 3,6 gagne contre le resto inconnu noté 4,5, parce qu'on sait exactement ce qu'on va manger.<\/p><h4>Sur le terrain<\/h4><p>Avant de gonfler tes promesses, réduis l'incertitude. Rends le résultat concret et prévisible : un cas client chiffré, une étape test, un livrable visible. Un cerveau qui peut prédire ton résultat passe à l'action.<\/p>"}], "quiz": [{"q": "Fin de RDV. Ton prospect, souriant depuis le début, te dit : \"Envoyez-moi la plaquette, je vais réfléchir.\" Ton offre était solide, ta logique imparable. Quelle est la lecture la plus probable ?", "o": ["Son néocortex manque de preuves : envoie une plaquette plus complète avec un comparatif chiffré", "C'est une objection de fin de cycle : son limbique a dit oui, sa raison cherche juste à confirmer", "Tu as parlé au mauvais cerveau : l'émotion n'a jamais été allumée, la logique seule ne signe pas", "Il te compare à un concurrent : relance-le vite avec un avantage exclusif"], "a": 2}, {"q": "5e minute de RDV. Tu n'as pas encore parlé de son problème que ton prospect attaque : \"De toute façon, c'est trop cher ces trucs-là.\" Que t'indique le MOMENT de cette objection ?", "o": ["Un vrai blocage : elle arrive avant l'émotion, reviens à la sécurité et au ressenti, pas aux chiffres", "Un bon signe : sa raison teste ton offre parce que son limbique a déjà dit oui", "Qu'il faut la traiter immédiatement avec ton argumentaire ROI avant qu'elle s'installe", "Qu'il te teste : ignore-la poliment et continue ton déroulé pour montrer ta solidité"], "a": 0}, {"q": "Tu veux placer la question \"Imaginez dans 6 mois si c'était réglé...\". D'après le module, quand la poser et pourquoi ?", "o": ["En fin d'entretien, pour créer l'élan émotionnel juste avant de closer", "Dès les premières secondes, pour capter l'attention avant que les objections arrivent", "Après tes preuves et références, pour que la projection soit crédible aux yeux du néocortex", "Au milieu de l'entretien : la dopamine sert à créer le désir, pas à closer"], "a": 3}, {"q": "Ton prospect enchaîne les questions pointues d'un ton sec, presque pour te piéger. Quelle lecture neurochimique et quelle réponse ?", "o": ["Son cortisol est trop haut : propose de reporter le rendez-vous à un moment plus calme", "Sa sérotonine n'est pas activée : valorise sincèrement ses questions pour passer du test à la coopération", "Sa dopamine est lancée : il chasse l'information, accélère vers la démonstration", "Son néocortex a pris la main : réponds point par point avec tes chiffres les plus solides"], "a": 1}, {"q": "Pour débloquer une signature qui traîne, tu annonces : \"Attention, l'offre se termine vendredi.\" Que prédit le module ?", "o": ["Pic de cortisol : menace perçue, mode survie, il reporte ou il fuit", "Pic de dopamine : l'anticipation de perdre l'offre déclenche enfin le désir d'agir", "Ça fonctionne si son limbique a déjà dit oui : l'urgence aide juste sa raison à trancher", "Ça fonctionne uniquement si l'échéance est réelle et vérifiable par le prospect"], "a": 0}, {"q": "RDV de 20 minutes avec un dirigeant pressé qui t'annonce d'entrée : \"Allez droit au but.\" Que fais-tu des 90 premières secondes ?", "o": ["Tu obéis : pitch direct, il vient de te donner la permission de sauter l'échauffement", "Tu ouvres avec ton chiffre le plus fort pour marquer son néocortex tout de suite", "Tu vas vite mais dans le bon ordre : une phrase sur sa réalité, la pression retirée, l'alarme d'abord", "Tu prends quand même 5 minutes de small talk : sans lien humain, rien ne passe"], "a": 2}, {"q": "Ton prospect doute. Tu hésites entre sortir ton tableau comparatif ou raconter l'histoire d'un client dans sa situation. Pourquoi le module tranche pour l'histoire ?", "o": ["Parce qu'une histoire est une preuve sociale qui rassure le néocortex mieux qu'un tableau", "Parce que le limbique travaille par association : elle déclenche une reconnaissance émotionnelle, pas une preuve", "Parce qu'elle t'évite le débat de chiffres, terrain où un concurrent sera toujours meilleur", "Parce que comparer des offres réveille trop tôt les objections du néocortex"], "a": 1}, {"q": "Ce contrat peut sauver ton trimestre. En plein RDV, tu t'entends réciter ton pitch sans vraiment écouter les réponses. Que se passe-t-il et que fais-tu ?", "o": ["Manque de préparation : réapprends ton argumentaire pour le dérouler sans y penser", "C'est le trac normal du vendeur, il disparaîtra avec l'expérience, continue", "Baisse l'enjeu mentalement en te répétant que ce contrat n'a pas d'importance", "Cortisol : ton accès au cortex préfrontal se réduit, réancre-toi avec une question ouverte et de l'écoute réelle"], "a": 3}, {"q": "Démarrage raté : tu sens ton prospect fermé dès les premières minutes. Ensuite, chacun de tes arguments, même excellent, rebondit sans effet. Pourquoi ?", "o": ["Biais de confirmation émotionnelle : le verdict de son amygdale teinte tout, tes arguments sont lus à charge", "Tes arguments sont trop faibles pour ce profil : il en faut de plus percutants", "Son néocortex a déjà choisi un concurrent : tu joues la roue de secours", "Il manque de dopamine : place une projection à 6 mois pour rallumer le désir"], "a": 0}, {"q": "Après ta relance insistante, ton prospect jusque-là plutôt ouvert se met à enchaîner les objections en rafale. Que lis-tu ?", "o": ["Sa raison confirme un oui émotionnel : traite chaque objection une par une, tu es proche de signer", "Le \"combattre\" du fight-or-flight : ta pression a activé son amygdale, retire-la explicitement", "Il entre en négociation : c'est le moment de lâcher une concession pour conclure", "Il a un profil analytique : donne-lui plus de données techniques pour le nourrir"], "a": 1}, {"q": "En fin d'échange, ton prospect lâche : \"Je ne sais pas pourquoi, mais je le sens bien.\" D'après Damasio, que se passe-t-il ?", "o": ["Méfiance : une décision sans justification logique se rétracte, verrouille avec un récap chiffré", "C'est de l'intuition, agréable mais sans valeur : attends la validation rationnelle avant de te réjouir", "Le marqueur somatique : cette sensation physique précède le choix, la décision est en train de se prendre", "C'est sa dopamine qui parle : attention, l'anticipation retombe vite après le rendez-vous"], "a": 2}, {"q": "Pourquoi le module s'appuie-t-il sur les travaux de Damasio pour affirmer que la logique seule ne fait jamais signer ?", "o": ["Parce que les émotions sont traitées deux fois plus vite que la logique", "Parce que trop de logique fatigue le cerveau et le pousse à reporter", "Parce que les acheteurs cachent leurs vraies motivations derrière des arguments rationnels", "Parce que sans accès aux émotions, on ne décide plus rien, même le plus simple"], "a": 3}, {"q": "Avant un RDV décisif, tu fixes ton intention. Laquelle met ton cerveau dans les conditions du flow d'après le module ?", "o": ["\"Signer aujourd'hui\" : un objectif ambitieux mobilise toutes tes ressources", "\"Comprendre son vrai problème en 15 minutes\" : précis et comportemental", "\"Réussir la vente\" : clair, simple et orienté résultat", "\"Rester calme quoi qu'il arrive\" : la gestion du stress avant tout"], "a": 1}, {"q": "Dès la 2e minute, ton prospect te demande : \"Montrez-moi ce que vous proposez.\" Tu déroules ta présentation... et il se referme. Qu'enseigne le module ?", "o": ["Tu as présenté trop tôt : son reptilien évaluait encore, il lui fallait 3 à 5 minutes de sécurité", "Ta présentation ciblait mal son secteur : personnalise davantage tes supports", "Il a demandé, tu as bien fait : c'est le contenu qui a péché, pas le moment", "Il fallait ouvrir par le limbique : une histoire émotionnelle avant toute chose"], "a": 0}, {"q": "RDV très agréable, rires, excellent contact... et aucune signature. D'après la vidéo sur les neurotransmetteurs, qu'est-ce qui a probablement manqué ?", "o": ["La sérotonine : malgré l'ambiance, il ne s'est pas senti assez respecté dans son statut", "Un peu de cortisol : une tension saine pousse à décider, trop de confort endort", "La dopamine : sans projection, aucune anticipation, donc aucun désir d'agir", "Le néocortex : il manquait les preuves et les chiffres pour justifier l'achat"], "a": 2}, {"q": "Ton prospect adore ton offre, il est convaincu qu'elle l'aiderait, et pourtant il n'achète pas. Selon le fonctionnement prédictif du cerveau, la cause la plus probable ?", "o": ["Tu n'as pas assez projeté le plaisir futur qu'il va ressentir", "Son cerveau ne peut pas prédire le résultat : l'incertitude est trop haute, il reste sur ce qu'il connaît", "Ton prix est trop élevé pour lui", "Il ne t'a pas assez vu, il manque de preuve sociale"], "a": 1}, {"q": "Deux groupes goûtent exactement le même vin, l'un annoncé à 10 euros, l'autre à 90 euros. Que montre l'imagerie cérébrale ?", "o": ["Aucune différence réelle, c'est juste un biais de langage", "Le cerveau du groupe 90 euros active vraiment plus les zones du plaisir : le vin lui semble meilleur", "Le groupe 10 euros trouve le vin meilleur car il est détendu", "Les deux groupes notent le vin à l'identique"], "a": 1}]}, {"id": "m2", "num": "Module 2", "icon": "🧲", "title": "L'infiltration subconsciente", "subtitle": "La psychologie de l'acheteur : 95% des décisions sont émotionnelles", "gated": true, "videos": [{"id": "m2v1", "num": "Vidéo 1", "title": "Conscient vs inconscient : 95% des décisions sont émotionnelles", "videoUrl": "https://www.skool.com/persua-7488/classroom/6764bdd0?md=bf2e7e7ab0b64170ac13943f04e8fc05"}, {"id": "m2v2", "num": "Vidéo 2", "title": "Les 6 principes d'influence de Cialdini appliqués à la vente", "videoUrl": "https://www.skool.com/persua-7488/classroom/6764bdd0?md=dee5b0f6dcff4aef8490852dd2d1fb5d"}, {"id": "m2v3", "num": "Vidéo 3", "title": "Les biais cognitifs qui déclenchent l'achat", "videoUrl": "https://www.skool.com/persua-7488/classroom/6764bdd0?md=d2b64bb952e7416cb58cc66aa581d59f"}, {"id": "m2v4", "num": "Vidéo 4", "title": "Profils psychologiques clients : DISC et personnalités d'achat", "videoUrl": "https://www.skool.com/persua-7488/classroom/6764bdd0?md=3792c5db40534dafbde111afe5333fd9"}, {"id": "m2v5", "num": "Vidéo 5", "title": "Douleur vs plaisir : la vraie mécanique de motivation", "videoUrl": "https://www.skool.com/persua-7488/classroom/6764bdd0?md=7297dec26679439ea209cf2b418b6fa0"}, {"id": "m2v6", "num": "Vidéo 6", "title": "Les heuristiques : raccourcis mentaux et décision rapide", "videoUrl": "https://www.skool.com/persua-7488/classroom/6764bdd0?md=822f215d8a5b47f6a423e014ccefa852"}, {"id": "m2f1", "num": "Fiche", "title": "Fiche neuro : à lire et garder", "type": "fiche", "fiche": "<p class=\"lead\">Chaque profil a une peur au volant. Tu ne la vois pas, mais c'est elle qui freine ou qui signe. Repère-la en dix minutes, désamorce-la avec la bonne phrase.<\/p><h4>Les 4 peurs qui pilotent l'achat<\/h4><ul><li><b>Rouge (dominant)<\/b> : peur de l'échec. Rends-lui le contrôle, va au résultat : \"c'est vous qui décidez\".<\/li><li><b>Jaune (influent)<\/b> : peur du rejet. Valorise-le, mets-le en avant, garde de la relation.<\/li><li><b>Vert (stable)<\/b> : peur du changement. Rassure sur la continuité et le suivi, ne le bouscule jamais.<\/li><li><b>Bleu (consciencieux)<\/b> : peur de mal faire. Apporte des preuves et des chiffres. Ne dis jamais \"pas de problème\" : le cerveau ne traite pas la négation.<\/li><\/ul><h4>Détecter vite : écoute sa question<\/h4><p>\"C'est quoi le résultat concret ?\" = rouge. \"Qui d'autre l'a fait ?\" = jaune. \"Comment vous allez nous accompagner ?\" = vert. \"Quelles données le prouvent ?\" = bleu.<\/p><h4>La règle de platine<\/h4><p>Communique avec l'autre comme LUI a besoin, pas comme toi tu as besoin. La plupart se plantent là : ils vendent dans leur propre couleur.<\/p><h4>Sur le terrain<\/h4><p>Avant ton prochain RDV, note la couleur probable et sa peur. Prépare une phrase qui la désamorce.<\/p>"}], "quiz": [{"q": "Ton prospect le plus cartésien arrive en RDV avec son cahier des charges de 40 pages et exige un comparatif chiffré ligne par ligne. Que se passe-t-il réellement dans sa tête au moment de décider ?", "o": ["C'est un profil purement rationnel : le comparatif le plus rigoureux emportera la décision", "Les chiffres ne servent à rien avec lui : mets le cahier des charges de côté et parle uniquement émotion", "Son Système 2 épluchera tes chiffres, mais il ne fera que rationaliser ce que son Système 1 aura déjà décidé", "Son conscient traite 11 millions de bits par seconde : plus tu lui donnes de données, mieux il décidera"], "a": 2}, {"q": "Fin de RDV sur une décision complexe à multiples critères. Ton prospect te dit : « Je ne tranche pas maintenant, je vous reviens lundi. » D'après l'expérience Dijksterhuis, quelle est la bonne lecture ?", "o": ["Sur un choix complexe, l'inconscient qui travaille décide mieux : ce délai peut jouer pour toi si son Système 1 a capté les bons signaux", "Un choix complexe exige de la réflexion consciente : envoie-lui un dossier comparatif complet à éplucher ce week-end", "C'est une objection déguisée : verrouille un engagement avant qu'il quitte la salle", "Plus il attend, plus le statu quo le ramènera à l'état actuel : pousse une décision à chaud"], "a": 0}, {"q": "Il te reste réellement deux places dans ta prochaine session de formation. Comment utiliser cette rareté selon Cialdini ?", "o": ["Rappelle-la à chaque relance pour maintenir la tension jusqu'à la signature", "N'en parle pas : évoquer la rareté revient à mettre la pression, et le cerveau s'en méfie", "Garde l'info pour le closing et sors-la au moment où il hésite, pour déclencher la décision", "Dis la contrainte une seule fois, vraie et précise, sans pression"], "a": 3}, {"q": "Premier RDV avec un dirigeant que tu veux convaincre de ton expertise. Comment installes-tu ton autorité selon Cialdini ?", "o": ["Ouvre sur ton parcours, tes certifications et tes années d'expérience pour cadrer ta légitimité", "Arrive avec une insight sur son secteur et nomme ses problèmes avant lui par tes questions", "Cite d'entrée tes 200 clients pour asseoir ta crédibilité", "Commence par un compliment sincère pour créer la sympathie, l'autorité suivra naturellement"], "a": 1}, {"q": "Ton prospect, une PME de 25 personnes, hésite. Tu as en références deux grands groupes prestigieux et trois PME de sa taille dans son secteur. Que mets-tu en avant ?", "o": ["Les trois PME similaires : la similitude démultiplie l'effet de la preuve sociale", "Les grands groupes : leur prestige rassure et tire la perception vers le haut", "Le volume total de tes clients, pour montrer la solidité de ta structure", "Les grands groupes d'abord pour impressionner, puis les PME pour la proximité"], "a": 0}, {"q": "Depuis le début du RDV, ton prospect revient sur le prix sans raison apparente, alors que tu n'as même pas fini de présenter. Quelle lecture et quelle action ?", "o": ["Il teste ta solidité : tiens ton prix ferme et ne bouge pas d'un euro", "Le prix dépasse réellement son budget : propose une version allégée de l'offre", "Il est ancré sur un chiffre entendu ailleurs : demande par rapport à quoi il compare", "Sa douleur n'est pas assez conscientisée : repars sur le coût de l'inaction à 12 mois"], "a": 2}, {"q": "Tu dois présenter une offre à 18 000€ par an. Comment structures-tu l'annonce d'après l'effet de cadrage ?", "o": ["Annonce 18 000€ dès l'ouverture : poser l'ancre haute en premier joue pour toi", "Construis d'abord la valeur, puis présente l'investissement en petit format : 50€ par jour", "Donne les deux formats, 50€ par jour et 18 000€ par an, par souci de transparence", "Annonce le prix avec une remise de lancement pour adoucir la première impression"], "a": 1}, {"q": "Ton prospect lâche : « On a déjà essayé un truc comme ça, ça n'a pas marché. » Que fais-tu ?", "o": ["Tu démontres point par point en quoi ta solution est différente de ce qu'il a testé", "Tu sors une référence client de son secteur pour contrebalancer son expérience", "Tu acquiesces et tu passes au point suivant pour ne pas cristalliser le blocage", "Tu explores ce qui a échoué : combattre la croyance de front ne ferait que la renforcer"], "a": 3}, {"q": "RDV chaleureux, aucun désaccord exprimé, et en partant ton prospect te dit : « Je vais en parler à mon associé. » Quelle lecture DISC ?", "o": ["Profil S : ce peut être un non qu'il n'ose pas dire ; ralentis, rassure sur l'accompagnement, ne force jamais", "Profil I : son enthousiasme va retomber, décroche un engagement avant qu'il sorte", "Bon signal d'engagement : propose de rencontrer l'associé et fixe une date de closing ferme", "Profil C : il lui manque des preuves, envoie un dossier chiffré à transmettre à l'associé"], "a": 0}, {"q": "Face à un prospect silencieux qui analyse chacun de tes supports, tu sèches sur une question technique pointue. Que fais-tu ?", "o": ["Tu donnes une réponse approximative mais assurée : montrer une hésitation détruirait ton autorité", "Tu réchauffes l'échange avec une histoire client vivante pour sortir du registre technique", "Tu dis que tu ne sais pas et que tu reviendras avec la réponse exacte : l'approximation détruit la confiance d'un C", "Tu prends son silence pour du désintérêt et tu requalifies son besoin"], "a": 2}, {"q": "Prospect expansif, plein de projets de croissance. Tu déroules tes questions sur le coût de l'inaction et tu le sens se refermer. Pourquoi ?", "o": ["Sa douleur est latente : insiste, la douleur est neurologiquement plus puissante que le plaisir", "C'est un profil tourné vers l'opportunité : le discours douleur le ferme, bascule sur une vision inspirante qui active la dopamine", "Biais de confirmation : il protège une croyance, demande-lui d'où vient sa réaction", "Tu as touché juste : ce recul montre qu'il conscientise enfin le problème"], "a": 1}, {"q": "« Oui, c'est un vrai sujet, on en parle souvent en interne. Mais là, on a d'autres priorités. » À quel niveau de douleur est ce prospect, et que fais-tu ?", "o": ["Niveau 2, consciente : il ne signera pas en l'état, aide-le à mesurer l'impact réel avec la question des 12 mois", "Niveau 3, active : il en parle, donc il cherche une solution, envoie ta proposition", "Niveau 1, latente : le problème n'est pas conscientisé, repars de zéro en découverte", "C'est du statu quo : découpe le changement en dix petits pas rassurants"], "a": 0}, {"q": "Tu prépares une soutenance devant un comité de décision. Tu as une étude statistique robuste et une belle histoire client. D'après l'heuristique de disponibilité, que mets-tu en avant ?", "o": ["L'étude statistique : un comité décide collectivement, donc rationnellement", "Les chiffres d'abord pour l'autorité, l'histoire ensuite en illustration secondaire", "La moyenne de tes résultats clients, pour rester strictement factuel", "L'histoire client en récit court, avant, déclic, après : elle pèsera plus que la statistique"], "a": 3}, {"q": "Pour faciliter l'entrée de nouveaux clients, tu envisages une remise de 30% sur ta prochaine offre. Bonne idée ?", "o": ["Oui, si tu la limites dans le temps : tu actives la rareté en plus du prix attractif", "Non : sans valeur établie, un prix bas éveille la méfiance et un rabais confirme la médiocrité", "Oui : un premier prix réduit crée un petit oui qui engage pour la suite", "Oui, en version essai : le prospect touche la solution et l'effet de dotation fait le reste"], "a": 1}, {"q": "Quel appariement entre moteur de motivation et neurochimie est exact ?", "o": ["Approche : cortisol, le carburant du désir ; évitement : dopamine, l'alarme de survie", "Approche : adrénaline ; évitement : dopamine et cortisol", "Approche : dopamine, moteur du désir ; évitement : cortisol et adrénaline, moteur de la survie", "Les deux systèmes produisent de la dopamine, à des doses différentes"], "a": 2}, {"q": "Un prospect ouvre le RDV : \"Concrètement ça donne quoi, et en combien de temps ? Je vous ai réservé 20 minutes.\" Quel profil, et quel réflexe ?", "o": ["Jaune : raconte-lui une belle histoire d'un autre client", "Rouge (peur de l'échec) : va droit au résultat et au ROI, respecte ses 20 minutes", "Vert : prends le temps de créer du lien avant tout", "Bleu : sors immédiatement un tableau de données exhaustif"], "a": 1}, {"q": "Un profil vert (stable) hésite en fin de RDV. Sa peur dominante et ton geste ?", "o": ["Peur de l'échec : rends-lui le contrôle", "Peur du changement : rassure sur la continuité et le suivi, ne le bouscule pas", "Peur du rejet : mets-le en avant devant les autres", "Peur de mal faire : accumule les preuves techniques"], "a": 1}]}, {"id": "m3", "num": "Module 3", "icon": "🎯", "title": "Communication persuasive", "subtitle": "Framing, reformulation, charge cognitive, non-verbal, voix", "gated": true, "videos": [{"id": "m3v1", "num": "Vidéo 1", "title": "Les mots qui activent le Système 1", "videoUrl": "https://www.skool.com/persua-7488/classroom/1e7d3b68?md=63d89f0fcc424999a2058ee2da55c111"}, {"id": "m3v2", "num": "Vidéo 2", "title": "Un storytelling efficace", "videoUrl": "https://www.skool.com/persua-7488/classroom/1e7d3b68?md=c0a9e678d7844f3ea2a5d2ee46cab40f"}, {"id": "m3v3", "num": "Vidéo 3", "title": "Le framing : mêmes faits, autre décision", "videoUrl": "https://www.skool.com/persua-7488/classroom/1e7d3b68?md=696462c068d24762bc1bc8a0fa4035d7"}, {"id": "m3v4", "num": "Vidéo 4", "title": "La reformulation : ses mots valent dix fois les tiens", "videoUrl": "https://www.skool.com/persua-7488/classroom/1e7d3b68?md=88eeac044d40446fb733d8b068bd0c2d"}, {"id": "m3v5", "num": "Vidéo 5", "title": "La charge cognitive : en dire moins pour vendre plus", "videoUrl": "https://www.skool.com/persua-7488/classroom/1e7d3b68?md=c64e270bf0544d3c8368d09104053df5"}, {"id": "m3v6", "num": "Vidéo 6", "title": "Le non-verbal : ton corps parle avant toi", "videoUrl": "https://www.skool.com/persua-7488/classroom/1e7d3b68?md=f29c1833c4154c50ace6896480f0a415"}, {"id": "m3v7", "num": "Vidéo 7", "title": "La voix et le silence", "videoUrl": "https://www.skool.com/persua-7488/classroom/1e7d3b68?md=9a92a8c3e41447c480b283ca9f75dced"}, {"id": "m3f1", "num": "Fiche", "title": "Fiche neuro : à lire et garder", "type": "fiche", "fiche": "<p class=\"lead\">Un bon vendeur parle moins de 30 pour cent du temps. Dans sa bouche, il n'y a que trois choses : des questions, des reformulations, des histoires. Le reste est du bruit.<\/p><h4>Tes 3 seuls outils<\/h4><ul><li><b>Questions<\/b> : elles gardent le prospect actif et te donnent la matière.<\/li><li><b>Reformulations<\/b> : il se sent compris, il baisse la garde.<\/li><li><b>Histoires<\/b> : un cas client parle à l'émotion et se retient. Un argument s'oublie.<\/li><\/ul><p>Ratio de référence : 80 pour cent d'écoute, 20 pour cent de parole.<\/p><h4>Ton pitch, dans le bon ordre<\/h4><p>Neuf pitchs sur dix commencent par \"qui je suis et mon entreprise\". C'est l'erreur, ça n'intéresse pas ton interlocuteur. Commence par la promesse, ce que tu apportes d'essentiel. Qui tu es vient en quatrième. Prépare trois formats : 15 secondes, 2 minutes, 20 minutes.<\/p><h4>Sur le terrain<\/h4><p>Prépare une histoire par objection récurrente. Quand elle arrive, tu ne débats pas, tu racontes, puis tu demandes : \"voyez-vous une raison pour que ça marche pour lui et pas pour vous ?\"<\/p>"}], "quiz": [{"q": "Tu ouvres ton rendez-vous par : \"Nous accompagnons les PME depuis 15 ans et nos process ont fait leurs preuves.\" Ton prospect hoche la tête poliment puis jette un œil à son téléphone. Que vient-il de se passer dans sa tête ?", "o": ["Son Système 2 a jugé l'argument trop léger : ajoute des références et des chiffres pour crédibiliser ton ancienneté", "Le message était trop simple pour un dirigeant : il attend un discours plus construit avant d'engager son attention", "Son Système 1 a décroché : tu parles de toi et en abstrait, or il ne traite vraiment que ce qui concerne le prospect", "Il manque un contraste avant/après, le seul format capable de tenir son attention au-delà de 30 secondes"], "a": 2}, {"q": "En plein pitch, tu glisses : \"Sur vos 10 derniers devis restés sans relance, combien ont fini par signer ?\" Ton prospect se redresse d'un coup. Quel mécanisme vient de jouer ?", "o": ["La surprise : son Système 1 détecte ce qui change, et un chiffre inattendu ou un paradoxe le réveille", "La question a forcé son Système 2 à faire un calcul rationnel, et c'est ce calcul qui a capté son attention", "Tu as activé son aversion à la perte : toute question sur des devis perdus déclenche l'alarme du cerveau", "Une question ouverte crée de la confiance : il se redresse parce qu'il se sent enfin écouté"], "a": 0}, {"q": "Tu déroules tes arguments chiffrés et ton prospect contre-argumente chaque point. Tu passes sur l'histoire d'un dirigeant qui lui ressemble, même blocage, et il se penche en avant pour connaître la suite. Pourquoi ce basculement ?", "o": ["Le cas client apporte la preuve concrète qui manquait à tes chiffres, et son Système 2 la juge plus crédible qu'une promesse", "L'histoire a simplifié la décision : tu as réduit la charge intrinsèque, donc son cerveau peut enfin comparer", "Les récits endorment la vigilance : son Système 2 s'est mis en veille, c'est le moment de closer", "Un argument, son Système 2 le filtre ; une histoire, son Système 1 la vit : projection et anticipation tiennent son attention"], "a": 3}, {"q": "Tu annonces : \"Avec nous, tu pourrais économiser 2 000 euros par mois.\" Le prospect sourit, note le chiffre et conclut par \"je vais réfléchir\". D'après la règle de distribution, où est l'erreur ?", "o": ["Le chiffre est trop rond pour être crédible : donne une fourchette précise, calculée avec lui pendant la découverte", "Cadre gain posé sur le statu quo : reformule en fuite, \"chaque mois sans solution, 2 000 euros partent\", une perte pèse presque deux fois plus lourd", "La peur devait porter sur ta solution : \"sans notre accompagnement, tu continueras de perdre\", c'est là que le cadre perte frappe le plus fort", "L'économie est bien cadrée, le problème vient d'ailleurs : il manquait un silence de cinq à huit secondes après le chiffre"], "a": 1}, {"q": "Ton associé te souffle : \"Gonfle un peu le coût de son problème, le cadre perte frappera plus fort.\" Que réponds-tu d'après le module ?", "o": ["Non : le framing change le cadre, jamais les faits, c'est la ligne entre influence et manipulation", "Oui, tant que tu restes sur le statu quo : c'est exactement là que le cadre perte est prévu par la règle de distribution", "Oui, si le prospect valide l'ordre de grandeur en séance : un chiffre accepté devient un signal interne, donc vrai pour lui", "Non : gonfle plutôt le gain de ta solution, exagérer une perte déclenche l'alarme et braque le Système 1"], "a": 0}, {"q": "Ton prospect lâche : \"Je perds mes ventes entre le premier rendez-vous et la relance, ça me bouffe.\" Tu réponds : \"OK, donc tu as un problème de pipe et de nurturing.\" Il se referme. Qu'est-ce qui vient de casser ?", "o": ["Tu as reformulé trop tôt : la reformulation se garde pour la synthèse de fin de rendez-vous", "Le jargon est trop technique pour lui : simplifie le vocabulaire et il se sentira à nouveau à l'aise", "Tu as sauté le niveau 2 : il fallait chiffrer le coût du problème avant de reformuler la situation", "Tu as traduit ses mots dans ta grille : tes mots sont un signal externe passé au scepticisme, il se sent plaqué, pas compris"], "a": 3}, {"q": "En fin de découverte, tu dis : \"Tu m'as dit que ça représentait deux ventes perdues par mois.\" Quel levier actives-tu exactement ?", "o": ["Le niveau 1 de la reformulation : tu reposes les faits de sa situation avec ses termes exacts", "L'affect labeling : tu mets un mot sur ce qu'il ressent et l'intensité redescend d'un cran", "Le niveau 2 : tu réactives l'aversion à la perte avec son propre calcul, pas le tien", "Le cadre perte du framing : c'est toi qui transformes son économie en fuite d'argent"], "a": 2}, {"q": "Rendez-vous tendu : ton prospect ressasse sa mauvaise expérience avec un prestataire précédent. Tu poses : \"J'ai l'impression que cette situation te frustre pas mal.\" Que va-t-il probablement se passer ?", "o": ["Risqué : pointer une émotion négative l'amplifie, mieux vaut recentrer vite la conversation sur du positif", "Sa frustration va baisser d'un cran sans qu'il décide de se calmer : une émotion nommée est une émotion qui se calme", "Ça ne marchera que s'il confirme l'émotion à voix haute : sinon ton mot reste un signal externe sans effet", "Tu viens d'utiliser le niveau 3 de la reformulation : il va se projeter dans le désir, la vie d'après"], "a": 1}, {"q": "Tu présentes trois offres avec options, un deck de vingt slides et tes meilleurs chiffres en rafale. Le prospect est attentif vingt minutes, puis conclut : \"Je vais réfléchir.\" Quel est le vrai diagnostic ?", "o": ["La décision était trop complexe en elle-même : la charge intrinsèque a dépassé son budget, tu ne pouvais rien y faire", "Il manquait de charge pertinente : ajoute un calcul de retour sur investissement pour l'aider à comparer", "Son Système 1 a pris le relais de la décision et il est parti comparer avec un concurrent moins cher", "Ta charge extrinsèque a saturé sa mémoire de travail : Système 2 disjoncté, retour à l'option par défaut, ne rien faire"], "a": 3}, {"q": "En découverte, tu enchaînes : \"Comment tu gères tes relances aujourd'hui, et d'ailleurs, qui décide du budget chez toi ?\" Il ne répond qu'à la question du budget. Pourquoi ?", "o": ["Deux questions enchaînées, et la première disparaît : sa mémoire de travail n'a gardé que la dernière", "La question du budget active son aversion à la perte : le cerveau traite toujours l'argent en priorité", "Il esquive la question des relances parce qu'elle le met en difficulté : creuse, c'est là que ça fait mal", "Question trop ouverte : commence par des questions fermées pour installer un rythme de réponses"], "a": 0}, {"q": "Tu doutes de ton nouveau prix, alors tu bosses ta posture et ton sourire avant le rendez-vous. À l'annonce du montant, ton débit accélère et le prospect recule légèrement. Que dit le module ?", "o": ["Sa transition posturale est une réaction normale au prix : tiens le silence cinq à huit secondes et elle passera", "La cohérence ne se simule pas : ton corps publie ton doute, et ça se règle avant, conviction retrouvée ou offre réparée", "Ta posture était bonne mais il manquait la synchronisation : cale ton débit sur le sien dès les cinq premières minutes", "Le problème est vocal, pas corporel : tu as annoncé le montant avec une fin de phrase montante"], "a": 1}, {"q": "Face à un prospect au débit lent et aux gestes rares, tu copies chacun de ses mouvements dans la seconde pour créer du lien. L'ambiance devient bizarre. Quelle est la bonne lecture ?", "o": ["La synchronisation se joue surtout à la voix : c'est ton débit qu'il fallait caler, pas tes gestes", "Tu aurais dû faire l'inverse : c'est au prospect de se régler sur ton état, pas à toi de suivre le sien", "L'effet caméléon fonctionne discrètement : tu calibres le rythme et l'ouverture, tu ne singes pas", "Le mimétisme était bon mais trop tardif : la synchronisation doit être installée dans les cinq premières minutes"], "a": 2}, {"q": "Ton prospect arrive stressé : débit mitraillette, gestes nerveux, il veut \"faire vite\". Ton réflexe commercial serait de matcher son énergie pour créer du rapport. Que fais-tu ?", "o": ["Tu restes ancré : posture stable, respiration basse, rythme posé. Sous stress, son état se règle sur le tien, pas sur tes mots", "Tu cales ton débit sur le sien, comme le prévoit la synchronisation, puis vous ralentirez ensemble progressivement", "Tu écourtes et tu recales un rendez-vous : un cerveau stressé retombe toujours sur l'option par défaut", "Tu montes ton énergie au même niveau pour créer le lien, puis tu redescends une fois la connexion établie"], "a": 0}, {"q": "Tu annonces \"c'est 4 000 euros\" avec la voix qui monte en fin de phrase, tu tiens deux secondes de blanc puis tu enchaînes sur les bénéfices. Il attaque la négociation. Quelles erreurs viens-tu d'empiler ?", "o": ["Une seule vraie erreur : le blanc de deux secondes lui a laissé le temps de douter, il fallait enchaîner tout de suite", "Fin de phrase montante et justification après le prix : ton montant est devenu une question, et chaque mot ajouté est lu comme un doute", "Tu n'as pas assez articulé le chiffre : un prix mâché signale qu'on n'y croit pas, d'où la négociation", "Le prix est tombé trop tôt : sans reformulation du coût de son problème juste avant, tout montant paraît cher"], "a": 1}, {"q": "Tu demandes : \"Concrètement, ça te coûte combien par mois, ce problème ?\" Il lève les yeux, silence de six secondes. Tu reformules ta question pour l'aider. Bonne ou mauvaise idée ?", "o": ["Bonne : reformuler soulage sa mémoire de travail et lui prouve ta théorie de l'esprit", "Bonne, à condition de proposer une fourchette chiffrée : un cerveau guidé calcule plus vite qu'un cerveau seul", "Mauvaise : il calculait le coût de son problème, ce calcul travaille pour toi, et parler par-dessus sature sa charge au pire moment", "Mauvaise, mais pour une autre raison : le silence ne se tient qu'après le prix et après un closing, pas en découverte"], "a": 2}, {"q": "Tu prépares ton pitch. Par quoi commencer pour ne pas perdre ton interlocuteur ?", "o": ["Qui tu es et la présentation de ton entreprise", "La promesse : ce que tu apportes d'essentiel à sa situation", "Tes tarifs et tes conditions", "Ton process de mise en oeuvre"], "a": 1}, {"q": "Ton prospect vient de poser une objection. Le meilleur outil à sortir en premier ?", "o": ["Un contre-argument solide pour la démonter", "Une reformulation puis une question ouverte pour isoler la vraie crainte", "Une remise pour débloquer", "Une nouvelle fonctionnalité qu'il ne connaissait pas"], "a": 1}]}, {"id": "m4", "num": "Module 4", "icon": "🩺", "title": "Le diagnostic clinique", "subtitle": "Le processus de vente neuroscientifique : découverte → closing", "gated": true, "videos": [{"id": "m4v1", "num": "Vidéo 1", "title": "La découverte neuro : activer la douleur et le désir", "videoUrl": "https://www.skool.com/persua-7488/classroom/b4374723?md=287bc0058d214766b77f7e93b9bed1ff"}, {"id": "m4v2", "num": "Vidéo 2", "title": "Présentation de l'offre : structurer pour le cerveau", "videoUrl": "https://www.skool.com/persua-7488/classroom/b4374723?md=872987478533451b9e460f61e9a132ad"}, {"id": "m4v3", "num": "Vidéo 3", "title": "Gestion des objections : rassurer le cerveau en alerte", "videoUrl": "https://www.skool.com/persua-7488/classroom/b4374723?md=5803c5f05f0248359e32c480879237f5"}, {"id": "m4v4", "num": "Vidéo 4", "title": "Le closing neuropsychologique : réduire le risque perçu", "videoUrl": "https://www.skool.com/persua-7488/classroom/b4374723?md=c7e03acdb2664a158a908ae0cae33666"}, {"id": "m4v5", "num": "Vidéo 5", "title": "La négociation basée sur l'aversion à la perte", "videoUrl": "https://www.skool.com/persua-7488/classroom/b4374723?md=783de507c48b488ea326cc3e58edcd30"}, {"id": "m4v6", "num": "Vidéo 6", "title": "Urgence et rareté : activer sans manipuler", "videoUrl": "https://www.skool.com/persua-7488/classroom/b4374723?md=9f482bd86be84185bd4f2d87b46c01ba"}, {"id": "m4f1", "num": "Fiche", "title": "Fiche neuro : à lire et garder", "type": "fiche", "fiche": "<p class=\"lead\">Sous pression, ton cortisol monte et tu improvises. Un rail te libère l'esprit pour écouter. Voici la structure, étape par étape, avec la phrase à dire.<\/p><h4>Le script C.L.O.S.E.R<\/h4><ul><li><b>Clarify<\/b> : pourquoi il a pris ce RDV. \"Qu'est-ce qui vous a poussé à réserver cet échange aujourd'hui ?\"<\/li><li><b>Label<\/b> : reformule sa problématique avec SES mots, attends un oui net.<\/li><li><b>Overview<\/b> : ce qu'il a déjà tenté et raté. \"Depuis combien de temps ? Qu'avez-vous essayé ?\" Puis déculpabilise.<\/li><li><b>Sell the vacation<\/b> : vends la destination vécue, pas le billet. Le résultat, pas les fonctionnalités.<\/li><li><b>Explain concerns<\/b> : traite les objections écran de fumée.<\/li><li><b>Reinforce<\/b> : verrouille dans les 24 heures. Promets moins, délivre plus.<\/li><\/ul><h4>Les 3 craintes derrière toute objection<\/h4><p>Derrière \"trop cher\", \"je réfléchis\", \"pas le moment\", il n'y a que trois manques de confiance : en TOI, en ton PRODUIT, en ton ENTREPRISE. Ton job : trouver lequel, puis rassurer sur celui-là seul. Tu ne désamorces jamais une menace que tu n'as pas localisée.<\/p><h4>Sur le terrain<\/h4><p>\"Je vais réfléchir\" est une info qui manque, pas un non. Demande : \"qu'est-ce qui vous manque pour être certain ?\", puis tais-toi.<\/p>"}], "quiz": [{"q": "En RDV, ton prospect répond tranquillement à tes questions factuelles : effectif, outils, organisation. Tu en es à ta huitième question de ce type et l'échange reste plat. Que se passe-t-il ?", "o": ["Rien d'anormal : il faut cartographier toute la situation avant d'oser parler des problèmes", "Il est en Système 1 et tu dois le faire basculer en Système 2 pour qu'il analyse sa situation", "Tu le maintiens en Système 2 factuel : au-delà de 2-3 questions de situation, le reste devait être préparé en amont", "Tu crées du rapport de confiance, la partie émotionnelle viendra naturellement ensuite"], "a": 2}, {"q": "Ton prospect lâche : \"oui, on perd pas mal de temps avec la ressaisie, c'est pénible\". Tu enchaînes aussitôt sur ta solution. Qu'est-ce que tu viens de rater ?", "o": ["L'implication : sans mesure de ce que ça lui coûte, \"j'ai un problème\" ne pèse rien face au statu quo", "Le ROI : tu aurais dû chiffrer toi-même le coût de sa ressaisie pour appuyer là où ça fait mal", "Rien : la douleur est sortie, il faut battre le fer tant qu'il est chaud avant qu'elle retombe", "La question de désir : il fallait d'abord lui faire imaginer sa vie sans ressaisie"], "a": 0}, {"q": "Question d'implication posée, ton prospect calcule : \"entre les erreurs et le temps perdu, ça doit nous coûter 40 000 euros par an\". Quel est ton coup d'après ?", "o": ["Tu présentes ton offre : la douleur est chiffrée par lui-même, les conditions sont réunies", "Tu affines son estimation avec tes propres chiffres pour crédibiliser le montant", "Tu creuses encore la douleur : plus le montant grossit, plus l'aversion à la perte travaille", "Tu bascules sur le désir : \"si c'était réglé demain, qu'est-ce qui changerait ?\" pour remonter la courbe"], "a": 3}, {"q": "Découverte réussie, ton prospect est ému en parlant de son équipe qui sature. Tu ouvres ta présentation par vos 15 ans d'expérience et vos références pour asseoir ta crédibilité. Quel est l'effet réel ?", "o": ["Tu rassures son amygdale : la confiance d'abord, l'émotion pourra ensuite s'appuyer dessus", "Tu forces la bascule en Système 2 : l'analyse froide fait retomber l'émotion que tu venais de construire", "Tu actives la preuve sociale au bon moment, avant qu'il ne compare avec tes concurrents", "Tu perds un peu de temps mais sans conséquence : la douleur mesurée en découverte reste acquise"], "a": 1}, {"q": "Fin de présentation, tu conclus par un poli : \"alors, qu'en pensez-vous ?\". Pourquoi c'est une erreur ?", "o": ["Tu rallumes le mode analyse : tu lui demandes littéralement de critiquer ton offre", "La question est trop vague, il fallait demander ce qui lui plaît le plus dans l'offre", "Aucune erreur : une question ouverte montre l'écoute et laisse la décision au prospect", "Tu aurais dû annoncer le prix d'abord, une invitation sans prix n'engage à rien"], "a": 0}, {"q": "Tu as deux cas clients : une grosse boîte connue avec des résultats spectaculaires, et une PME du même secteur que ton prospect avec des résultats corrects. Ton prospect dirige une PME. Tu montres quoi ?", "o": ["La grosse référence : le prestige crédibilise et fait le travail de réassurance", "Les deux : plus tu empiles de preuves, plus la validation est solide", "La PME similaire : la ressemblance déclenche l'identification, bien plus que le spectaculaire", "Une statistique agrégée sur tous tes clients : plus fiable qu'une histoire isolée"], "a": 2}, {"q": "Ton offre a 12 fonctionnalités et ton prospect semble intéressé. Pour maximiser la valeur perçue avant d'annoncer le prix, tu décides de tout lui montrer. Que prédit le module ?", "o": ["L'équation valeur-prix devient plus favorable, condition clé d'un closing naturel", "Sa mémoire de travail sature au-delà de 3-4 éléments : surchargé, il ne dit pas oui, il reporte", "Il restera en Système 1 émerveillé si tu enchaînes les démonstrations avec rythme", "Ça fonctionne s'il a un profil analytique qui aime l'exhaustivité"], "a": 1}, {"q": "\"C'est trop cher.\" Tu as un comparatif ROI béton dans ta sacoche et une furieuse envie de le sortir. Quel est ton tout premier geste selon le protocole ?", "o": ["Sortir le ROI : une objection prix se traite par la démonstration de valeur chiffrée", "Demander tout de suite \"trop cher comparé à quoi ?\" pour reprendre la main", "Réancrer la valeur avant de reparler du prix, comme en négociation", "Une pause de 2 secondes : elle empêche ta défensive automatique de prendre le volant"], "a": 3}, {"q": "\"Je dois en parler à mon associé avant de décider.\" Quelle est la lecture du module, et la bonne réponse ?", "o": ["Objection de processus : il ne veut pas porter seul la décision, équipe-le pour vendre en interne", "Objection de timing : explore le coût de l'attente plutôt que le calendrier", "Une excuse polie pour sortir du RDV : reviens à la douleur pour vérifier qu'elle est réelle", "Demande un RDV à trois : personne ne défendra ton offre mieux que toi face à l'associé"], "a": 0}, {"q": "Ton prospect soupire : \"on a déjà essayé un outil comme ça, ça n'a rien changé\". Tu classes ça comment, et tu fais quoi ?", "o": ["Objection de valeur : retourne à la valeur avant de reparler du prix", "Un défi technique : démontre point par point en quoi ta solution diffère de l'ancienne", "Objection de peur, biais de statu quo : nomme la peur et réduis le risque concrètement", "Objection de processus : implique les utilisateurs qui ont vécu le premier échec"], "a": 2}, {"q": "Douleur chiffrée par le prospect, valeur validée par lui, confiance visible : les trois conditions sont là et il est enthousiaste. Quel closing choisis-tu ?", "o": ["Réduction du risque : propose un premier pas limité, on ne brusque jamais une décision", "Confirmation : \"on est alignés, quelle est la prochaine étape concrète de ton côté ?\"", "Coût de l'inaction : \"attendre 3 mois, qu'est-ce que ça aura coûté ?\" pour verrouiller", "Closing de vérité : vérifie qu'aucun frein caché ne dort avant d'avancer"], "a": 1}, {"q": "Tu annonces ton prix, posture ancrée. Silence. Sept secondes passent, l'inconfort monte. Tu fais quoi ?", "o": ["Rien, tu attends : la question ouverte n'arrive qu'à 10 secondes, et jamais d'arguments dans le silence", "Tu rappelles calmement le bénéfice principal pour l'aider à trancher", "Tu proposes un paiement en plusieurs fois pour lever le blocage évident", "Tu poses tout de suite une question ouverte : 7 secondes de silence, c'est déjà une alerte"], "a": 0}, {"q": "Ton prospect convaincu demande 15 % de remise. Tu acceptes dans la seconde pour sécuriser la signature. Qu'est-ce qui vient de se passer ?", "o": ["Il se sent gagnant : la réciprocité de ton geste va accélérer sa signature", "Tu as bien joué si ta marge l'absorbe : le prix est une variable d'ajustement comme une autre", "Tu as calmé son aversion à la perte : il a évité de payer trop cher, il est rassuré", "Ta propre aversion à la perte a cédé en premier, et son cerveau conclut que ton prix initial était gonflé"], "a": 3}, {"q": "\"Il faut faire un effort sur le prix.\" Tu as accueilli sans céder et réancré la valeur chiffrée. Avant toute concession, que dois-tu encore déterminer ?", "o": ["La contrepartie exacte que tu vas exiger en échange de la remise", "Le plancher que ta marge autorise pour ne pas vendre à perte", "Si le blocage vient du budget global, de la trésorerie, ou d'un doute sur la valeur", "S'il a une offre concurrente moins chère sur la table"], "a": 2}, {"q": "Tu n'as réellement que 2 créneaux d'accompagnement ce mois-ci. Tu le dis, ton prospect hésite, alors tu le répètes deux fois de plus dans l'échange. Verdict ?", "o": ["Correct : la rareté est authentique, donc la marteler ne pose aucun problème", "Erreur : même vraie, la deuxième fois signale l'anxiété et la troisième la pression", "Erreur : la disponibilité du vendeur n'est pas une source d'urgence authentique", "Correct : l'aversion à la perte a besoin de répétition pour s'installer"], "a": 1}, {"q": "En fin de RDV : \"C'est clair, c'est intéressant, je vais réfléchir.\" Le meilleur premier geste ?", "o": ["Sortir une remise limitée dans le temps", "Demander \"qu'est-ce qui vous manque aujourd'hui pour être certain de prendre la bonne décision ?\" puis te taire", "Renvoyer une plaquette plus complète", "Le laisser réfléchir et le relancer dans trois jours"], "a": 1}, {"q": "Un prospect dit \"c'est trop cher\". Selon le modèle des 3 craintes, tu dois d'abord identifier...", "o": ["S'il a réellement le budget", "Laquelle des trois confiances manque : en toi, en ton produit, ou en ton entreprise", "Son profil DISC exact", "Son planning de décision"], "a": 1}]}, {"id": "m5", "num": "Module 5", "icon": "🏛️", "title": "L'architecture de l'offre", "subtitle": "Expérience client & fidélisation", "gated": true, "videos": [{"id": "m5v1", "num": "Vidéo 1", "title": "Dopamine et fidélisation : créer l'envie de revenir", "videoUrl": "https://www.skool.com/persua-7488/classroom/0c8f7c05?md=3dc34a5a7f4346b09523ecc63e441165"}, {"id": "m5v2", "num": "Vidéo 2", "title": "L'effet de pic et de fin : ce dont le client se souviendra", "videoUrl": "https://www.skool.com/persua-7488/classroom/0c8f7c05?md=eef507af098a4c49a79593ed72770bdb"}, {"id": "m5v3", "num": "Vidéo 3", "title": "Confiance et ocytocine : bâtir des relations durables", "videoUrl": "https://www.skool.com/persua-7488/classroom/0c8f7c05?md=b90629ab427b4647b3d31a49d60c11b2"}, {"id": "m5v4", "num": "Vidéo 4", "title": "Boucles de récompense et programmes de fidélité", "videoUrl": "https://www.skool.com/persua-7488/classroom/0c8f7c05?md=3ebd81dceaa0403ab8db7b9bbbed3c19"}, {"id": "m5v5", "num": "Vidéo 5", "title": "Transformer un client en ambassadeur grâce à la psychologie sociale", "videoUrl": "https://www.skool.com/persua-7488/classroom/0c8f7c05?md=d9308c063dea4fff901fdbd215296075"}, {"id": "m5f1", "num": "Fiche", "title": "Fiche neuro : à lire et garder", "type": "fiche", "fiche": "<p class=\"lead\">Ton client ne retient pas la moyenne de ton accompagnement. Il retient deux choses : le pic émotionnel et la fin. Et son cerveau adore ce qu'il peut prédire.<\/p><h4>Pic et fin<\/h4><p>Soigne le dernier moment de chaque interaction, c'est lui qui reste. Un bon closing suivi d'une fin tiède efface le closing.<\/p><h4>Les 24 heures qui décident<\/h4><p>Juste après l'achat, le cerveau cherche à confirmer qu'il a bien fait. Promets moins, délivre plus : un message de bienvenue, un bonus non annoncé. Ces 24 heures décident s'il devient fidèle ou s'il doute.<\/p><h4>La prévisibilité fidélise<\/h4><p>Un produit correct mais 100 pour cent prévisible fidélise plus qu'un excellent mais incohérent. Le Doliprane, c'est du paracétamol deux à trois fois plus cher, on le reprend parce qu'on connaît le résultat. Zéro surprise, zéro doute.<\/p><h4>Sur le terrain<\/h4><p>Après chaque étape, annonce la suivante précisément. Une prochaine action datée réduit l'incertitude et ramène le client.<\/p>"}], "quiz": [{"q": "48h après avoir signé, ton client t'envoie un mail avec des questions pointues qu'il n'avait jamais posées et un « tu es sûr que c'est la bonne solution pour nous ? ». Quelle est la bonne lecture ?", "o": ["Un concurrent est passé derrière toi : reprends rendez-vous pour redéfendre ton offre point par point avant qu'il ne bascule", "Ton closing a été trop rapide : il faut re-vendre les bénéfices tant que la décision est encore chaude", "C'est la dissonance cognitive des 24 à 72h : son cerveau cherche à valider sa décision, traite le doute de front avec un message humain", "Ne réponds pas trop vite pour ne pas paraître inquiet : ce genre de doute retombe tout seul en quelques jours"], "a": 2}, {"q": "Tu démarres une mission de 6 mois dont le premier livrable majeur tombe au mois 3. D'après le module, que fais-tu ?", "o": ["Tu planifies une quick win, même petite, dans les 2 premières semaines : sans premier résultat tangible, le doute a le temps de laisser des traces", "Tu avances le livrable majeur au mois 2 quitte à réduire le périmètre : c'est la taille du premier résultat qui réengage le client", "Tu envoies un point d'avancement détaillé chaque semaine : un client bien informé n'a aucune raison de douter de son investissement", "Tu offres une surprise positive dès la première semaine pour compenser neurologiquement l'attente du livrable"], "a": 0}, {"q": "Tu prépares un bilan trimestriel. Ton client a trois problèmes bloquants à régler d'urgence. Comment structures-tu la réunion ?", "o": ["Tu attaques par les trois problèmes puisqu'ils sont urgents, et tu gardes les réussites pour la fin afin de soigner la dernière impression", "Tu commences par mesurer le chemin parcouru, puis tu ouvres sur les problèmes : sinon tu actives le système d'évitement avant le système d'approche", "Tu alternes un problème puis une réussite pour que la moyenne émotionnelle de la réunion reste positive", "Tu laisses le client choisir l'ordre du jour : son cerveau se sentira en contrôle et donc en sécurité"], "a": 1}, {"q": "Mission A : un retard sérieux au milieu, mais un dernier mois brillant et une clôture soignée. Mission B : irréprochable de bout en bout, terminée par un simple envoi de facture. Six mois plus tard, laquelle génère des recommandations ?", "o": ["La B : le cerveau garde la trace de l'ensemble des moments, et son ensemble est objectivement meilleur", "Aucune : un retard sérieux tue la recommandation, et une facture n'a jamais empêché un client content de parler", "La B, à condition que le résultat chiffré soit supérieur : c'est le résultat final qui fait parler un client", "La A : le cerveau résume l'expérience à son pic et à sa fin, le retard du milieu pèse peu dans le souvenir"], "a": 3}, {"q": "Tu veux créer un pic mémorable pour ton meilleur client. D'après les trois critères du module, quelle action a le plus de chances de marcher ?", "o": ["Une remise surprise de 10 % sur sa prochaine facture : inattendue et directement valorisable dans ses comptes", "Un dîner dans un grand restaurant pour marquer le coup à la fin de la mission", "Une note manuscrite, envoyée sans occasion, qui relie son résultat à ce qu'il t'avait confié compter vraiment pour lui", "Un reporting mensuel d'un niveau de détail qui écrase celui de tous ses autres prestataires"], "a": 2}, {"q": "Fin de collaboration : ton client n'a atteint que 80 % de l'objectif. Comment mènes-tu la dernière réunion ?", "o": ["Tu la consacres aux 20 % manquants avec un plan d'action : c'est la preuve de ton exigence jusqu'au bout", "Tu montres le delta en chiffres concrets, tu reconnais ce qu'il a investi en temps, énergie et courage, puis tu ouvres la suite sans pression", "Tu termines sur une proposition de renouvellement avec une remise limitée dans le temps pour transformer l'élan en signature", "Tu restes factuel et sobre : célébrer 80 % d'un objectif, c'est risquer de perdre ta crédibilité"], "a": 1}, {"q": "En séminaire, un formateur affirme : « offre un petit cadeau dès le premier rendez-vous, ça libère l'ocytocine, l'hormone de la confiance, et le client te fait confiance ». Que répond ce module ?", "o": ["C'est vrai : le don sans contrepartie immédiate est justement un des cinq comportements déclencheurs de confiance", "C'est vrai sur le fond, mais le geste doit venir après la première vente, une fois la compétence prouvée", "C'est faux : la confiance est rationnelle, elle repose uniquement sur l'accumulation de preuves de compétence", "C'est un raccourci trompeur : l'ocytocine n'est pas un interrupteur, des résultats n'ont pas tenu à la reproduction ; la confiance se construit preuve après preuve, par la sécurité"], "a": 3}, {"q": "Tu as fait une erreur qui coûte deux semaines de délai à ton client. Il ne s'en est pas encore rendu compte. Que fais-tu ?", "o": ["Tu l'admets de front : la vulnérabilité authentique construit la confiance, et minimiser une difficulté est interprété comme une trahison", "Tu compenses discrètement par un geste commercial sans t'étendre sur l'erreur : les actes valent mieux que les excuses", "Tu attends de voir s'il le remarque : soulever un problème qu'il n'a pas vu, c'est créer une inquiétude inutile", "Tu expliques les causes externes du retard pour protéger ta crédibilité technique, puis tu présentes ton plan de rattrapage"], "a": 0}, {"q": "Un concurrent approche ton client de trois ans avec la même prestation 15 % moins chère. Ton client décline sans même te demander de t'aligner. Qu'est-ce qui l'a retenu ?", "o": ["La qualité technique de ton travail : un client bien servi n'a aucune raison rationnelle de partir", "La peur du risque : changer de prestataire est objectivement dangereux pour son activité", "La réserve de confiance accumulée et l'attachement : dans sa tête le changement coûte, l'aversion à la perte fait le reste", "Les gestes commerciaux forts que tu lui as faits : la générosité ponctuelle verrouille la relation"], "a": 2}, {"q": "Ton associé propose un programme de fidélité : « 1 point par euro dépensé, cadeau fixe garanti à 500 points ». Quelle est la critique du module ?", "o": ["Le seuil est trop lointain : à 100 points, le client serait récompensé plus vite et plus souvent", "Il récompense la dépense au lieu de l'engagement, et un cadeau fixe et prévisible crée moins d'anticipation qu'une récompense variable et des paliers", "Il manque un avantage immédiat à l'inscription : le cerveau préfère toujours une récompense immédiate à une récompense différée", "Rien à redire : c'est simple et lisible, et le cerveau aime les règles claires"], "a": 1}, {"q": "Depuis six mois, tu envoies chaque vendredi un point d'avancement que ton client attend. Cette semaine, tu ne l'envoies pas. D'après les travaux de Schultz, que se passe-t-il dans son cerveau ?", "o": ["Un signal dopaminergique négatif : la récompense annoncée par le signal manque, son cerveau produit de la déception", "Rien de particulier : une absence d'information n'est pas une information pour le cerveau", "Un effet de manque qui augmente son désir : l'imprévisibilité rend la récompense encore plus puissante", "Une simple baisse d'attention : il ne le remarquera que si le projet a réellement pris du retard"], "a": 0}, {"q": "Ton travail est impeccable, tes livrables irréprochables, et pourtant tes clients restent tièdes entre deux résultats. Quel est le diagnostic du module ?", "o": ["La valeur perçue est trop basse : monte tes prix pour que l'engagement suive l'investissement", "Il manque un programme de fidélité formel, avec points et niveaux, pour structurer l'engagement", "La qualité ne suffit plus : il te faut un grand geste spectaculaire qui marque durablement la relation", "La relation est riche en routine mais pauvre en récompenses explicites : nomme la progression, célèbre les jalons"], "a": 3}, {"q": "Fin d'un bilan très positif avec un dirigeant. Tu veux ouvrir la porte aux recommandations. Quelle formulation choisis-tu ?", "o": ["« Est-ce que tu connais d'autres dirigeants qui cherchent à progresser comme toi ? »", "« À qui pourrais-tu me présenter dans ton réseau ? » : une demande directe et assumée passe toujours mieux", "Aucune : un client vraiment satisfait recommande spontanément, demander casse la sincérité de la démarche", "« Si tu es content, tu penseras à moi ? » : léger, sans pression, dans l'esprit de l'ouverture vers la suite"], "a": 0}, {"q": "Deux clients ont obtenu le même résultat et se disent aussi satisfaits l'un que l'autre. Le premier te mentionne spontanément dans des conversations où ton nom n'avait aucune raison d'apparaître, le second ne parle jamais de toi. Quelle est la différence ?", "o": ["Le premier est plus extraverti : l'ambassadorat est d'abord une affaire de tempérament", "Travailler avec toi fait désormais partie de l'identité du premier : il se recommande lui-même à travers toi", "Le premier a une histoire plus facile à raconter parce que son secteur est plus visible", "Le premier a reçu plus d'attentions de ta part : la réciprocité l'oblige à te renvoyer l'ascenseur"], "a": 1}, {"q": "Tu dis à un client engagé : « tu es exactement le profil pour qui cette approche fait une vraie différence ». Quel mécanisme actives-tu ?", "o": ["La réciprocité : valorisé, il se sentira redevable et voudra te rendre la pareille", "La récompense surprise : un compliment inattendu déclenche un pic de dopamine qui le réengage", "La cohérence identitaire : comme dans l'expérience du vote de Cialdini, son cerveau va chercher à confirmer cette identité", "L'aversion à la perte : il ne voudra pas risquer de perdre ce statut de client à part"], "a": 2}, {"q": "Ton client vient de signer. Quel moment soignes-tu en priorité pour la fidélité ?", "o": ["La moyenne de la prestation sur toute la durée", "La toute fin de chaque interaction et les 24 premières heures après l'achat", "Le milieu de l'accompagnement", "Le niveau de prix pratiqué"], "a": 1}, {"q": "Deux offres : une excellente mais floue sur le déroulé, une correcte mais 100 pour cent prévisible. Laquelle fidélise le mieux selon le cerveau ?", "o": ["L'excellente floue, car le potentiel de plaisir est plus haut", "La prévisible : le cerveau préfère réduire l'incertitude", "Ça dépend uniquement du prix", "Les deux fidélisent de la même façon"], "a": 1}]}, {"id": "m6", "num": "Module 6", "icon": "🛡️", "title": "La maîtrise des résistances", "subtitle": "Script neuro-optimisé & cas pratiques (B2B, B2C, distanciel)", "gated": true, "videos": [{"id": "m6v0", "num": "Vidéo 1", "title": "Le modèle SONCASE : les 7 leviers de motivation d'achat"}, {"id": "m6v1", "num": "Vidéo 2", "title": "Le script de vente neuro-optimisé : structure complète", "videoUrl": "https://www.skool.com/persua-7488/classroom/35209095?md=f5cf04bbc60342958853421448e332a9"}, {"id": "m6v2", "num": "Vidéo 3", "title": "Atelier : analyser et reformuler ton pitch", "type": "atelier", "calUrl": "https://cal.com/steven-lfrs-persua/atelier-pitch"}, {"id": "m6v3", "num": "Vidéo 4", "title": "Atelier : vente B2B, cycle long", "type": "atelier", "calUrl": "https://cal.com/steven-lfrs-persua/atelier-b2b"}, {"id": "m6v4", "num": "Vidéo 5", "title": "Atelier : vente B2C, émotion immédiate", "type": "atelier", "calUrl": "https://cal.com/steven-lfrs-persua/atelier-b2c"}, {"id": "m6v5", "num": "Vidéo 6", "title": "Atelier : vente par téléphone et visio", "type": "atelier", "calUrl": "https://cal.com/steven-lfrs-persua/atelier-distance"}, {"id": "m6v6", "num": "Vidéo 7", "title": "La checklist : préparer chaque rendez-vous", "type": "fiche", "fiche": "<p class=\"lead\">Les pilotes utilisent une checklist avant chaque décollage. Pas parce qu'ils ne savent pas piloter : parce que sous pression, le cerveau oublie. Même l'expert. En rendez-vous, le cortisol monte, ta mémoire de travail sature, et tes meilleurs réflexes s'effacent au moment exact où tu en as besoin. Cette checklist prend cinq minutes et t'assure d'entrer dans chaque rendez-vous avec tous les leviers activés.<\/p><h4>Avant le rendez-vous<\/h4><p><b>Préparation personnelle<\/b><\/p><ul><li>Deux minutes de respiration lente, montre en main. Ton calme se transmet au prospect avant tes mots.<\/li><li>Un objectif unique et comportemental. Pas « signer » : « comprendre le vrai problème en profondeur ».<\/li><li>Reconnecte-toi à ta conviction sincère sur la valeur de ce que tu proposes.<\/li><\/ul><p><b>Préparation prospect<\/b><\/p><ul><li>Son profil DISC probable, son moteur probable (douleur ou plaisir), sa douleur la plus vraisemblable.<\/li><li>Un cas client similaire en tête pour la preuve.<\/li><li>Deux questions préparées par niveau : situation, problème, implication, désir.<\/li><\/ul><p><b>Préparation du cadre<\/b><\/p><ul><li>En présentiel : apparence et supports cohérents avec ton positionnement.<\/li><li>En visio : cadre, lumière et son irréprochables, notifications coupées.<\/li><\/ul><h4>Pendant le rendez-vous<\/h4><p><b>Ancrage<\/b><\/p><ul><li>Ai-je signalé l'absence de pression ?<\/li><li>Mon prospect s'est-il détendu (épaules, respiration, débit de parole) ?<\/li><li>Suis-je moi-même calme et présent ?<\/li><\/ul><p><b>Découverte<\/b><\/p><ul><li>Est-ce que je parle moins de 30 % du temps ?<\/li><li>Est-ce que j'utilise ses mots à lui ?<\/li><li>A-t-il mesuré lui-même le coût de son problème et verbalisé son désir ?<\/li><\/ul><p><b>Présentation<\/b><\/p><ul><li>Ai-je commencé par le miroir de sa situation ?<\/li><li>Est-ce que je présente des transformations, pas des fonctionnalités ?<\/li><li>Ai-je raconté une histoire client ?<\/li><\/ul><p><b>Closing<\/b><\/p><ul><li>Les trois conditions sont-elles réunies : douleur mesurée, valeur perçue, confiance établie ?<\/li><li>Ai-je choisi le closing adapté au profil ?<\/li><li>Ai-je tenu les huit secondes de silence après le prix ?<\/li><\/ul><h4>Après le rendez-vous<\/h4><p><b>Analyse<\/b><\/p><ul><li>Quel profil ai-je identifié ? Quel levier a fonctionné, lequel manquait ?<\/li><li>La découverte est-elle allée jusqu'à l'implication ?<\/li><\/ul><p><b>Actions<\/b><\/p><ul><li>Décision prise : message de bienvenue sous 24 heures.<\/li><li>Pas encore de décision : une prochaine micro-action, datée.<\/li><li>Dans tous les cas : noter la douleur principale et les mots exacts du prospect.<\/li><\/ul><h4>Comment l'utiliser<\/h4><ul><li><b>Débutant<\/b> : parcours la checklist entière, par écrit, avant et après chaque rendez-vous.<\/li><li><b>Intermédiaire<\/b> : avant et après ; pendant, fais confiance à ton intégration et note deux ou trois observations.<\/li><li><b>Avancé<\/b> : elle est intégrée. Tu l'utilises surtout après, pour maintenir ton niveau d'exigence.<\/li><\/ul><p><b>Exercice<\/b> : imprime-la, garde-la sur ton bureau, et remplis la partie « après » à chaud dès la fin de ton prochain rendez-vous, avant même d'ouvrir tes mails.<\/p>"}], "quiz": [{"q": "Que t'indique le levier SONCASE dominant d'un client ?", "o": ["Comment il prend ses décisions", "Pourquoi il achète : sa motivation dominante", "Son budget disponible"], "a": 1}, {"q": "Face à un client au levier Sécurité, quel est le bon réflexe ?", "o": ["Mettre en avant la nouveauté de l'offre", "Apporter garanties, preuves et références", "Accélérer vers le closing pour éviter les doutes"], "a": 1}, {"q": "À 12 minutes de rendez-vous, ton prospect vient de nommer sa douleur et semble prêt à écouter ton offre. Tu es tenté d'ouvrir ta présentation. Que dit la structure en 7 phases ?", "o": ["Bascule maintenant : l'émotion est active, et le pont sert justement à la garder pendant la transition", "Présente une seule transformation tout de suite pour battre le fer tant qu'il est chaud, tu détailleras après", "Reste en découverte : descends vers la douleur, puis fais-lui verbaliser son désir, sinon tu présentes dans le vide", "Réduis ta présentation à un seul des trois temps pour compenser la découverte écourtée"], "a": 2}, {"q": "Ton prospect vient de verbaliser son désir. Tu prends alors trois minutes pour lancer ton partage d'écran en parlant de tout et de rien, puis tu démarres ta présentation. Quelle est la lecture neuro ?", "o": ["Tu as raté le pont : l'émotion a refroidi pendant la bascule et tu présentes à froid", "Aucun impact : la présentation en 3 temps et la preuve sociale vont relancer l'émotion", "Bonne pratique : cette pause logistique calme l'amygdale juste avant la présentation", "Utile : ce temps mort laisse son Système 2 analyser tranquillement ce qu'il vient de dire"], "a": 0}, {"q": "Tu demandes « Comment prenez-vous vos décisions sur ce type de projet ? ». Réponse : « Je compare plusieurs offres en détail, je vérifie tous les chiffres, et je ne décide jamais à chaud. » Comment pilotes-tu la suite ?", "o": ["Tu raccourcis le rendez-vous, tu files à la découverte et tu vises un closing de confirmation", "Tu ralentis tout, tu multiplies la validation et tu proposes un démarrage progressif", "Tu prépares un closing de réduction du risque pour sécuriser une décision en fin de séance", "Tu sors des données solides, tu laisses de la place à ses questions et tu n'attends pas de décision en séance"], "a": 3}, {"q": "Ton offre a six bénéfices différenciants et ton prospect est bien engagé. En phase de présentation, que fais-tu de ces six bénéfices ?", "o": ["Tu les présentes tous : plus la valeur perçue est haute, plus le closing sera simple derrière", "Transformation principale, une preuve sociale ciblée, deux compléments maximum : au-delà, il sature et reporte", "Tu les présentes tous, mais espacés de silences pour laisser sa mémoire de travail respirer", "Tu n'en gardes qu'un seul, comme pour un profil D, quel que soit le profil en face"], "a": 1}, {"q": "Un collègue te lit son pitch : 12 ans d'expérience, 200 entreprises accompagnées, +25% de résultats. Tout est vrai, et pourtant tu ne ressens rien. Quel est le diagnostic ?", "o": ["Exact de bout en bout, mais aucune image : il ne parle qu'au Système 2, il informe sans rien faire ressentir", "Les références manquent de poids : avec des chiffres plus impressionnants, le déclic se ferait naturellement", "Il manque une histoire client chiffrée en ouverture : la preuve sociale est le levier absent de ce pitch", "Le pitch est trop court : il faudrait détailler la méthodologie pour rassurer le Système 2 du prospect"], "a": 0}, {"q": "Tu as réécrit ton pitch avec les 5 filtres et tu arrives à la dernière phrase, face à un prospect attentif. Laquelle choisis-tu ?", "o": ["« On se cale un rendez-vous pour voir comment ça s'appliquerait chez vous ? »", "« En résumé, la transformation principale que j'apporte à mes clients, c'est ça. »", "« C'est quoi, le moment où vous sentez que vous perdez des ventes qui auraient dû être gagnées ? »", "« Un client de votre secteur a vécu exactement cette situation, je vous raconte ? »"], "a": 2}, {"q": "En rendez-vous B2B, ton prospect lâche : « On a déjà investi dans une formation il y a deux ans, ça n'a rien donné. » Que fais-tu ?", "o": ["Tu enchaînes sur ce qui te différencie précisément de ce prestataire pour créer le contraste", "Tu creuses ce qui n'avait pas fonctionné, en annonçant que c'est pour ne pas reproduire les mêmes erreurs", "Tu rassures tout de suite : avec ta méthode, ce scénario ne peut pas se reproduire", "Tu notes le point et tu y reviendras plus tard, une fois l'ancrage de sécurité bien installé"], "a": 1}, {"q": "Comité B2B : Thomas le directeur commercial (profil C), le DRH et le PDG. Tu as préparé un dossier d'études de cas ultra chiffré. Comment gères-tu la réunion ?", "o": ["Tu déroules le dossier chiffré pour tous : en comité, c'est la rigueur rationnelle qui emporte la décision", "Tu concentres ton discours sur le PDG : c'est lui qui signe, les deux autres suivront sa position", "Tu laisses Thomas porter le dossier en interne : un pair convainc toujours mieux qu'un vendeur", "Tu gardes les chiffres pour Thomas, tu parles accompagnement des équipes au DRH et ROI daté au PDG"], "a": 3}, {"q": "Ton comité B2B se dit convaincu, mais repousse la signature de mois en mois sans objection claire. Quelle lecture, et quelle riposte ?", "o": ["Biais de statu quo : tu proposes un pilote réversible avec trois volontaires, mesuré ensemble, qui plafonne la perte possible", "Manque d'urgence : tu poses une offre à durée limitée pour forcer l'arbitrage avant la fin du mois", "ROI pas assez démontré : tu retravailles le calcul présenté au PDG avec des projections plus ambitieuses", "Cycle qui s'enlise : tu demandes une décision ferme, quitte à perdre le deal, pour sortir du flou"], "a": 0}, {"q": "Cycle long : ta prochaine réunion avec le comité est dans six semaines. Qu'est-ce qui entretient le mieux l'élan d'ici là ?", "o": ["Une relance par semaine pour vérifier où en est le dossier et rester présent dans les esprits", "Le silence : tu as semé, insister maintenant réactiverait la méfiance héritée du passé", "Une veille sectorielle envoyée spontanément et un client similaire qui accepte d'être contacté", "Une proposition ajustée avec un geste commercial pour redonner une bonne raison d'avancer"], "a": 2}, {"q": "B2C coaching haut de gamme : tu arrives au moment du prix et tu sais que le « c'est un gros investissement » va tomber. Que fais-tu juste avant d'annoncer le chiffre ?", "o": ["Rien de spécial : tu annonces le prix et tu tiens le silence de huit secondes, c'est lui qui travaille", "Tu nommes la réaction à l'avance et tu déplaces le critère : la direction d'abord, le prix ensuite", "Tu réactives l'identité désirée pour que son circuit de la récompense amortisse le chiffre", "Tu découpes le montant en mensualités pour réduire la perte perçue au moment de l'annonce"], "a": 1}, {"q": "Fin d'entretien B2C, ta prospecte te dit : « Je vais y réfléchir. » D'après le module, quelle est ta meilleure carte ?", "o": ["« Juste une question honnête : y a-t-il quelque chose qui vous retient que vous n'avez pas encore dit ? »", "Tu respectes son rythme et tu proposes un rappel sous 48h, la fenêtre où la décision se joue", "Tu reformules la version d'elle-même dans six mois pour raviver son circuit de la récompense", "Tu redemandes si c'est le bon moment pour elle, indépendamment de la logistique"], "a": 0}, {"q": "En visio, ton prospect raconte son problème en détail depuis deux minutes. Où poses-tu ton regard, et comment montres-tu ton écoute ?", "o": ["Caméra en continu : c'est le seul moyen de garder un vrai contact visuel à distance", "Tu hoches la tête et tu souris comme en présentiel, le non-verbal passe très bien à l'écran", "Tu prends des notes sur papier hors champ pour lui montrer que ce qu'il dit compte", "Tu regardes l'écran pendant qu'il parle et tu poses des marqueurs verbaux : « je note ça », « continuez »"], "a": 3}, {"q": "Au téléphone, tu parles à ton débit habituel, celui qui passe très bien en présentiel, et tu te sens calme. Quel est le problème ?", "o": ["Aucun : ton calme se transmet par corégulation, le débit n'a pas d'importance au téléphone", "Tu devrais plutôt accélérer : sans visuel, un rythme trop posé fait décrocher l'attention", "Ta parole arrive plus pressée qu'elle ne part : ralentis de 10 à 15% et articule plus nettement", "Le débit est bon, c'est le volume qu'il faut monter pour compenser la distance"], "a": 2}, {"q": "Cinq minutes avant un rendez-vous décisif, tu sens la pression monter. Que prévoit la checklist neuro-vente ?", "o": ["Tu relis une dernière fois toute ta présentation pour sécuriser ta mémoire de travail", "Deux minutes de respiration lente montre en main, et un objectif comportemental unique comme « comprendre le vrai problème »", "Tu te fixes l'objectif de signer aujourd'hui : un but clair canalise le stress", "Tu visualises le rendez-vous réussi pour activer ton propre circuit de la récompense"], "a": 1}, {"q": "\"Je dois d'abord en parler à mon associé.\" La meilleure suite ?", "o": ["\"Pas de souci, rappelez-moi quand c'est fait\"", "\"Et qu'est-ce qui se passe si votre associé vous déconseille d'y aller ?\" pour révéler sa vraie crainte", "Réciter trois arguments de plus pour le convaincre", "Proposer une remise pour accélérer"], "a": 1}]}, {"id": "m7", "num": "Module 7", "icon": "🚀", "title": "Performance & développement du vendeur", "subtitle": "Stress, intelligence émotionnelle, mindset, plan d'action", "gated": true, "videos": [{"id": "m7v1", "num": "Vidéo 1", "title": "Gestion du stress : le cortisol, ennemi n°1 du vendeur", "videoUrl": "https://www.skool.com/persua-7488/classroom/da77a1fd?md=614a9b9a97e7424c86b90392588fd400"}, {"id": "m7v2", "num": "Vidéo 2", "title": "Intelligence émotionnelle et vente : les 4 piliers", "videoUrl": "https://www.skool.com/persua-7488/classroom/da77a1fd?md=af86b0ad3e2c4c048705089bc4a1a560"}, {"id": "m7v3", "num": "Vidéo 3", "title": "Mindset de croissance : neuroplasticité et progression", "videoUrl": "https://www.skool.com/persua-7488/classroom/da77a1fd?md=c4793274cb794fb3930f46c0e22ce581"}, {"id": "m7v4", "num": "Vidéo 4", "title": "Rituels de préparation mentale avant un rendez-vous", "videoUrl": "https://www.skool.com/persua-7488/classroom/da77a1fd?md=936cd69219274679aa6821f9868f574f"}, {"id": "m7v5", "num": "Vidéo 5", "title": "Plan d'action personnel : mettre en pratique la neuro-vente", "videoUrl": "https://www.skool.com/persua-7488/classroom/da77a1fd?md=1b179f002c454d0c87b849b4c6591cf0"}, {"id": "m7f1", "num": "Fiche", "title": "Fiche neuro : à lire et garder", "type": "fiche", "fiche": "<p class=\"lead\">Plus tu as besoin de faire cette vente, moins tu as de chances de la faire. Ton prospect sent ton énergie avant tes mots.<\/p><h4>Pipe vide, pipe plein<\/h4><p>Un pipe vide, c'est l'énergie du désespoir : tu pousses, il se braque. Un pipe plein, c'est le détachement : tu closes plus facilement parce que tu n'en as pas besoin. Ta priorité n'est pas ce deal, c'est ton flux.<\/p><h4>Le prix, ta source numéro 1 de cortisol<\/h4><p>53 pour cent des vendeurs n'osent pas parler d'argent. Résultat : le stress monte et fuit vers la fin du RDV. Aborde le budget tôt, calmement, ça désamorce l'objection prix avant qu'elle arrive.<\/p><h4>Sur le terrain<\/h4><p>Avant chaque appel : deux minutes de respiration lente et un objectif comportemental, pas un objectif de résultat. \"Comprendre son vrai problème\", pas \"signer\". Le cerveau le plus stable prend le contrôle.<\/p>"}], "quiz": [{"q": "Gros trimestre en jeu, tu sens la pression monter en plein rendez-vous. Tu gardes le sourire, ton pitch est propre, mais le prospect se ferme sans raison apparente et finit par lâcher « je ne le sens pas ». Que s'est-il probablement passé ?", "o": ["Ton pitch était trop technique : il fallait simplifier le discours pour le remettre à l'aise.", "Il a senti que tu cherchais à vendre : il fallait annoncer ton objectif dès le départ.", "Son cerveau a capté tes signaux de stress sans les identifier, et il a mis ce malaise sur le compte de ton offre.", "Il n'était pas le vrai décisionnaire et cherchait une porte de sortie polie."], "a": 2}, {"q": "Avant un rendez-vous décisif, tu sens une tension nette mais tu restes lucide et concentré. Ton collègue te conseille de « te détendre complètement » avant d'entrer. D'après la loi de Yerkes-Dodson, que fais-tu ?", "o": ["Tu gardes cette tension modérée : à ce dosage, elle réveille l'énergie et aiguise l'attention.", "Tu suis son conseil : moins il y a de stress, mieux le cortex préfrontal fonctionne.", "Tu pars marcher 20 minutes sans téléphone pour redescendre à zéro avant d'entrer.", "Tu montes encore d'un cran : plus l'enjeu est haut, plus l'activation doit l'être."], "a": 0}, {"q": "Un deal important traîne depuis six semaines : le prospect ne dit ni oui ni non, et tu y penses en fond toute la journée. Quelle est la parade enseignée dans le module ?", "o": ["Relancer plus souvent pour forcer une réponse rapide, dans un sens ou dans l'autre.", "Accepter l'incertitude : elle fait partie du métier, il fau
