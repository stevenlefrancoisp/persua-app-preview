t apprendre à vivre avec.", "Te reconnecter à la signature pour transformer ce stress en motivation.", "Créer de la clarté toi-même : décider toi-même quand ce deal est mort."], "a": 3}, {"q": "Pendant ta présentation, ton prospect était penché en avant et posait des questions. Depuis deux minutes, il s'est redressé, répond plus court, son ton a baissé. Que t'enseigne le pilier de l'empathie ?", "o": ["Accélérer vers la conclusion avant qu'il ne refroidisse complètement.", "Cette transition d'état (énergie, posture, ton) est le signal à percevoir au-delà de ses mots.", "Continuer ta présentation : tant qu'il ne formule pas d'objection, rien n'est perdu.", "Ressentir son inconfort comme le tien pour créer une vraie connexion émotionnelle."], "a": 1}, {"q": "Un prospect te lance sèchement : « Franchement, votre offre est deux fois trop chère. » Tu sens la moutarde monter. D'après la pratique du pilier de la régulation émotionnelle, que fais-tu dans la seconde qui suit ?", "o": ["Deux secondes de pause, puis la question : « quelle est la réponse la plus utile ici ? »", "Tu nommes ton agacement à voix haute devant lui pour en réduire l'intensité.", "Tu supprimes l'agacement et tu réponds avec un sourire parfaitement professionnel.", "Tu réponds du tac au tac pour montrer que le prix ne te fait pas peur."], "a": 0}, {"q": "Tu t'évalues sur les quatre piliers : conscience de soi 4/5, régulation 4/5, empathie 3/5, compétences sociales 2/5. Tu adores le contact et tu es à l'aise en soirée réseau. Que travailles-tu en priorité ?", "o": ["L'empathie : c'est le fondement de tout, donc toujours la priorité.", "La conscience de soi : sans elle, impossible de progresser sur les trois autres.", "Les compétences sociales : ton pilier le plus faible définit ton plafond de performance.", "L'empathie et les compétences sociales en parallèle, pour progresser plus vite."], "a": 2}, {"q": "Tu sors d'un rendez-vous raté : le prospect a coupé court au bout de vingt minutes. Ton premier réflexe : « je suis nul en découverte ». Si tu restes sur cette lecture, que se passe-t-il dans ton cerveau ?", "o": ["Rien de particulier : c'est de la lucidité, et la lucidité fait progresser.", "Il lit l'échec comme une menace et passe en mode défense, où tu apprends mal.", "Il consolidera quand même la leçon pendant la nuit, quelle que soit ta lecture.", "Il renforce malgré tout les connexions de la découverte, même sur un rendez-vous raté."], "a": 1}, {"q": "Trois semaines que tu répètes la même trame de découverte, et tu la déroules maintenant plus vite, plus fluide, sans y penser. Quel mécanisme du module explique ce gain de vitesse ?", "o": ["L'affect labeling, qui réduit l'intensité de l'effort ressenti à chaque passage.", "Le flow : l'état émotionnel optimal atteint à force de répéter.", "L'ancrage conditionné : ton cerveau associe la trame à un état de performance.", "La myélinisation : la connexion répétée s'enveloppe d'une gaine qui multiplie sa vitesse."], "a": 3}, {"q": "Un collègue t'affirme : « Le mindset de croissance, c'est prouvé, c'est une loi du cerveau. » D'après le module, quelle est la position juste ?", "o": ["Les chercheurs débattent de la taille réelle de l'effet : c'est un outil de terrain, pas une loi du cerveau.", "Il a raison : Dweck l'a démontré en 2006 et c'est définitivement validé depuis.", "C'est l'inverse : l'effet a été réfuté, seule la neuroplasticité compte.", "C'est vrai pour l'apprentissage scolaire, mais pas transposable à la vente."], "a": 0}, {"q": "Tu fais quinze rendez-vous par semaine depuis deux ans, toujours de la même façon, et tu ne progresses plus. D'après les conditions d'optimisation de la plasticité, qu'est-ce qui manque ?", "o": ["Du volume : il faut passer à vingt rendez-vous pour franchir le palier.", "De la pratique délibérée : objectif précis, feedback immédiat, sortie de la zone de confort.", "Un mentor dont tu copies le geste jusqu'à le reproduire parfaitement.", "De la confiance : c'est le doute qui bloque la progression, pas la méthode."], "a": 1}, {"q": "Avant le rendez-vous le plus important du trimestre, tu fermes les yeux deux minutes et tu te visualises en train de signer le contrat, poignée de main, sourire du client. Quel est le problème ?", "o": ["Aucun : visualiser le succès active les mêmes circuits que la pratique réelle.", "La visualisation ne fonctionne pas sans le geste d'ancrage physique exécuté en même temps.", "Il faut visualiser ton comportement idéal des cinq premières minutes, pas la signature.", "Deux minutes, c'est trop court : un enjeu pareil exige le rituel complet la veille au soir."], "a": 2}, {"q": "Pendant ta minute de reconnexion à la conviction, tu n'arrives pas à répondre à « pourquoi ce que je propose va vraiment aider cette personne ». Que t'enseigne le module ?", "o": ["Passe cette composante et compense avec une visualisation plus longue.", "Force une réponse positive : la conviction se construit en la répétant.", "Remplace la question par ton intention comportementale du jour.", "C'est une information précieuse en soi : prends-la au sérieux."], "a": 3}, {"q": "Journée marathon : sept rendez-vous enchaînés, dix minutes de battement entre chaque. Comment adaptes-tu ta préparation mentale ?", "o": ["Un rituel allégé de deux minutes entre chaque interaction.", "Le rituel complet de six minutes avant le premier rendez-vous, qui couvre toute la journée.", "Le rituel complet la veille au soir et le matin même.", "Respiration 4-6 seule : l'intention unique se fixe le matin pour toute la journée."], "a": 0}, {"q": "Un commercial de ton équipe finit la formation à fond : il veut appliquer la découverte, la présentation, les objections et les closings dès lundi. Que va-t-il probablement se passer, et pourquoi ?", "o": ["Il va progresser vite sur tout : l'enthousiasme du départ est le meilleur moment pour tout changer.", "Dans deux semaines, retour aux automatismes : le cerveau n'intègre qu'un ou deux nouveaux comportements à la fois.", "Il const DAY=86400000;
function lastBilan(){return ST.bilans.length?ST.bilans[ST.bilans.length-1]:null;}

function bilanDue(){const l=lastBilan();return !l||(Date.now()-l.t)>=21*DAY;}
function daysToBilan(){const l=lastBilan();return l?Math.max(0,Math.ceil((l.t+21*DAY-Date.now())/DAY)):0;}
function dashboardHTML(){
  const l=lastBilan(),p=prevBilan();
  if(!l) return `<div class="card"><div class="nm">Ton tableau de bord</div><div class="mt">Fais ton premier bilan pour situer ton niveau sur les 4 axes, puis suis ton évolution tous les 21 jours.</div><button class="cta" onclick="openBilan()">📊 Faire mon 1er bilan (16 questions, 7 min)</button></div>`;
  const rows=AXES.map(function(a){const k=a[0],v=l[k],pv=p?p[k]:null,delta=pv==null?null:v-pv;
    const arrow=delta==null?'':delta>0?`<span style="color:#16a34a">▲+${delta}</span>`:delta<0?`<span style="color:#dc2626">▼${delta}</span>`:`<span style="color:#7a7f92">=</span>`;
    const hist=ST.bilans.length>1?`<div style="margin:1px 0 9px 92px;display:flex;align-items:flex-end;gap:2px;height:26px">`+ST.bilans.slice(-8).map(function(b){return `<span style="display:inline-block;width:6px;height:${3+b[k]*2.2}px;background:#c7ccf5;border-radius:2px"></span>`;}).join('')+`</div>`:'';
    return `<div class="axrow"><span class="lb">${a[1]}</span><span class="bar"><i style="width:${v*10}%"></i></span><span class="vv" style="width:52px">${v}/10 ${arrow}</span></div>${hist}`;
  }).join('');
  const due=bilanDue();
  return `<div class="card"><div class="habhead"><div class="nm">Ton tableau de bord</div><div class="streakbig" style="color:var(--indigo)">${ST.bilans.length} bilan${ST.bilans.length>1?'s':''}</div></div>${rows}

  BILAN.forEach(function(q,i){tot[q.ax]++;if(BL.ans[i]===q.a)sc[q.ax]++;});
  const b={t:Date.now(),d:Math.round(sc.d/tot.d*10),o:Math.round(sc.o/tot.o*10),c:Math.round(sc.c/tot.c*10),m:Math.round(sc.m/tot.m*10)};
  ST.bilans.push(b);save();refreshHeader();
  const p=prevBilan();
  const msg=p?"Compare à ton dernier bilan, les flèches montrent ton évolution.":"C'est ta base de départ. Reviens dans 21 jours pour mesurer tes progrès.";

   {av:"S",bg:"#0e1020",who:"Steven · Coach 📌",when:"Épinglé · il y a 2h",body:'Défi de la semaine : après un "je vais réfléchir", demandez QUELLE info manque, puis taisez-vous. Postez ce que ça donne.',k:24,c:8},

}
const SCREENS={accueil:accueilHTML,parcours:parcoursHTML,gestes:gestesHTML,rdv:rdvHTML,assistant:assistantHTML,communaute:communauteHTML};

/* Navigation */
const TABS=[["accueil","🏠","Accueil"],["parcours","🗺️","Parcours"],["gestes","✅","Gestes"],["rdv","📅","Séances"],["assistant","🤖","Assistant"],["communaute","👥","Communauté"]];
document.getElementById('tabbar').innerHTML=TABS.map((t,i)=>`<div class="tab${i===0?' on':''}" data-k="${t[0]}"><span class="e">${t[1]}</span><span>${t[2]}</span></div>`).join('');
function go(k){document.getElementById('screen').innerHTML=SCREENS[k]();document.getElementById('screen').scrollTop=0;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.k===k));if(k==='rdv')setTimeout(mountCal,60);refreshHeader();}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>go(t.dataset.k)));

/* Modal */
function openModal(){document.getElementById('modal').classList.add('open');document.querySelector('#modal .ov-body').scrollTop=0;}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function setM(tl,body){document.getElementById('mtl').textContent=tl;document.getElementById('mbd').innerHTML=body;}

/* Module : contenu réel (vidéo / atelier 1:1 / fiche) + quiz réel */
function openModule(mId){
  const m=M(mId),req=reqV(m),watched=vDone(m),passed=!!ST.quiz[mId],canQuiz=allWatched(m);
  setM(m.num,`
    <div class="card" style="background:#eef0ff;border-color:#e0e3ff"><div class="nm">${m.icon} ${m.t}</div><div class="mt">${m.sub}</div>
      <div class="pbar" style="margin-top:8px"><i style="width:${req.length?Math.round(watched/req.length*100):0}%"></i></div>
      <div class="mt" style="margin-top:5px">${watched}/${req.length} complétés${passed?' · quiz validé ✓':''}</div></div>
    ${canQuiz?`<div class="card" style="background:#dcfce7;border-color:#bbf7d0;color:#166534"><b>✅ Vidéos vues.</b> Entraîne-toi, puis valide le quiz.</div>`:`<div class="card" style="background:#fff7ed;border-color:#fdba74;color:#9a3412"><b>👀 Regarde la vidéo avant de répondre.</b> Les questions te font travailler ce que la vidéo t'apprend. Le quiz de validation se débloque une fois les vidéos et fiches vues.</div>`}
    <h3 class="sh">Le module, vidéo par vidéo</h3>
    ${m.V.map(v=>{
      const t=iType(v),done=!!ST.done[v.id];
      if(t==='atelier') return `<div class="lrow" onclick="bookAtelier('${mId}','${v.id}')"><div class="chk2 ${done?'ok':''}" style="${done?'':'background:#fff7ed;color:#c2410c'}">${done?'✓':'📅'}</div><div class="g">${v.title}<div class="mt">${v.num} · Atelier 1:1 avec Steven · Réserver ↗</div></div></div>`;
      if(t==='fiche') return `<div class="lrow" onclick="openFiche('${mId}','${v.id}')"><div class="chk2 ${done?'ok':''}" style="${done?'':'background:#eff6ff;color:#1d4ed8'}">${done?'✓':'📄'}</div><div class="g">${v.title}<div class="mt">${v.num} · Fiche pratique à lire</div></div></div>`;
      if(!v.videoUrl) return `<div class="lrow" style="opacity:.55;cursor:default"><div class="chk2">🔒</div><div class="g">${v.title}<div class="mt">${v.num} · bientôt disponible</div></div></div>`;
      return `<div class="card" style="padding:12px"><div style="display:flex;gap:11px;align-items:center"><div class="chk2 ${done?'ok':''}">${done?'✓':'▶'}</div><div style="flex:1"><div style="font-weight:600;font-size:13.5px;line-height:1.3">${v.title}</div><div class="mt">${v.num}</div></div></div><div style="display:flex;gap:8px;margin-top:10px"><button class="cta" style="margin:0;flex:1;background:#eef0ff;color:#3730a3;font-size:12.5px;padding:10px" onclick="watchVideo('${mId}','${v.id}')">▶ Regarder ↗</button><button class="cta" style="margin:0;flex:1;background:#0e1020;font-size:12.5px;padding:10px" onclick="openTrainV('${mId}','${v.id}')">🎮 Exercice</button></div></div>`;
    }).join('')}
    <h3 class="sh" style="margin-top:16px">Valider le module</h3>
    <button class="cta" style="margin-top:0;${canQuiz?'':'opacity:.45;pointer-events:none'}" onclick="openQuiz('${mId}')">${passed?'✅ Refaire le quiz de validation':'✅ Quiz de validation ('+m.Q.length+' questions)'} ${canQuiz?'':'🔒'}</button>`);
  openModal();
}
function watchVideo(mId,vId){const m=M(mId),v=m.V.find(x=>x.id===vId);if(v&&v.videoUrl){window.open(v.videoUrl,'_blank','noopener');}ST.done[vId]=true;save();refreshHeader();openModule(mId);}
function bookAtelier(mId,vId){const m=M(mId),v=m.V.find(x=>x.id===vId);if(v&&v.calUrl){window.open(v.calUrl,'_blank','noopener');}ST.done[vId]=true;save();refreshHeader();openModule(mId);}
function openFiche(mId,vId){const m=M(mId),v=m.V.find(x=>x.id===vId);ST.done[vId]=true;save();refreshHeader();setM(v.title,`<div class="fiche">${v.fiche||'<p>Fiche à venir.</p>'}</div><button class="cta" style="margin-top:16px" onclick="openModule('${mId}')">← Retour au module</button>`);document.querySelector('#modal .ov-body').scrollTop=0;}

/* Entraînement : jeu d'apprentissage, correction immédiate à chaque carte (sans note, sans blocage) */
let TR=null;
function qForVideo(m,vId){var vids=m.V.filter(function(v){return iType(v)==='video';});var j=vids.findIndex(function(v){return v.id===vId;});if(j<0)return m.Q;var per=Math.max(1,Math.ceil(m.Q.length/(vids.length||1)));var s=m.Q.slice(j*per,j*per+per);return s.length?s:m.Q.slice(0,per);}
function openTrain(mId){TR={mId:mId,vId:null,qs:M(mId).Q,i:0,ans:{},rev:{},score:0};renderTrain();openModal();}
function openTrainV(mId,vId){TR={mId:mId,vId:vId,qs:qForVideo(M(mId),vId),i:0,ans:{},rev:{},score:0};renderTrain();openModal();}
function renderTrain(){
  const m=M(TR.mId),qs=TR.qs,q=qs[TR.i],last=TR.i===qs.length-1,rev=!!TR.rev[TR.i],picked=TR.ans[TR.i];
  const v=TR.vId?m.V.find(x=>x.id===TR.vId):null;
  const vlink=(v&&v.videoUrl)?`<div class="card" style="background:#eef0ff;border-color:#e0e3ff;padding:11px"><div class="mt" style="color:#3730a3;font-weight:600">Exercice sur : ${v.title}</div><button class="cta" style="margin-top:8px;background:#4f46e5" onclick="window.open('${v.videoUrl}','_blank','noopener')">▶ Revoir la vidéo ↗</button></div>`:'';
  setM('Exercice · '+m.num,`
    ${vlink}
    <div class="mt" style="margin-bottom:8px">Carte ${TR.i+1} / ${qs.length} · score ${TR.score}</div>
    <div class="pbar" style="margin-bottom:14px"><i style="width:${Math.round(TR.i/qs.length*100)}%"></i></div>
    <div class="card"><div class="nm" style="font-size:14px;line-height:1.5">${q.q}</div>
      ${q.o.map((o,oi)=>{let st='';if(rev){if(oi===q.a)st='background:#dcfce7;border-color:#16a34a;color:#166534;font-weight:600';else if(oi===picked)st='background:#fee2e2;border-color:#dc2626;color:#991b1b';}return `<div class="qopt" style="${st}" onclick="pickTrain(${oi})">${o}</div>`;}).join('')}
      ${rev?`<div class="mt" style="margin-top:10px;font-weight:700;color:${picked===q.a?'#166534':'#991b1b'}">${picked===q.a?'✓ Juste. Tu as capté le mécanisme.':"✗ Presque. La bonne réponse est en vert, relis-la, c'est comme ça qu'on apprend."}</div>`:`<div class="mt" style="margin-top:8px">Choisis, la correction s'affiche direct.</div>`}
    </div>
    <button class="cta" style="${rev?'':'opacity:.45;pointer-events:none'}" onclick="${last?'finishTrain()':'trainNav()'}">${last?'Voir mon récap':'Carte suivante →'}</button>`);
  document.querySelector('#modal .ov-body').scrollTop=0;
}
function pickTrain(oi){if(TR.rev[TR.i])return;TR.ans[TR.i]=oi;TR.rev[TR.i]=true;if(oi===TR.qs[TR.i].a)TR.score++;renderTrain();}
function trainNav(){TR.i++;renderTrain();}
function finishTrain(){const m=M(TR.mId),n=TR.qs.length,rejouer=TR.vId?`openTrainV('${TR.mId}','${TR.vId}')`:`openTrain('${TR.mId}')`;
  setM('Exercice · '+m.num,`
    <div class="card" style="text-align:center;background:#eef0ff;border-color:#e0e3ff">
      <div style="font-size:34px;font-weight:800;color:#3730a3">${TR.score}/${n}</div>
      <div class="mt" style="color:#3730a3;font-weight:600">C'est un entraînement, pas une note. Rejoue autant que tu veux : chaque erreur t'apprend le mécanisme.</div></div>
    <button class="cta" onclick="${rejouer}">🎮 Rejouer</button>
    <button class="cta" style="margin-top:8px;background:#eef0ff;color:#3730a3" onclick="openModule('${TR.mId}')">← Retour au module</button>`);
  document.querySelector('#modal .ov-body').scrollTop=0;
}

/* Quiz réel, une question à la fois, avec correction */
let QZ=null;
function openQuiz(mId){QZ={mId,i:0,ans:{}};renderQ();openModal();}
function renderQ(){
  const m=M(QZ.mId),q=m.Q[QZ.i],last=QZ.i===m.Q.length-1,picked=QZ.ans[QZ.i];
  setM('Quiz · '+m.num,`
    <div class="mt" style="margin-bottom:8px">Question ${QZ.i+1} / ${m.Q.length}</div>
    <div class="pbar" style="margin-bottom:14px"><i style="width:${Math.round(QZ.i/m.Q.length*100)}%"></i></div>
    <div class="card"><div class="nm" style="font-size:14px;line-height:1.5">${q.q}</div>
      ${q.o.map((o,oi)=>`<div class="qopt ${picked===oi?'on':''}" onclick="pickQ(${oi})">${o}</div>`).join('')}</div>
    <div style="display:flex;gap:8px">
      ${QZ.i>0?'<button class="cta" style="background:#eef0ff;color:#3730a3" onclick="qnav(-1)">Précédent</button>':''}
      <button class="cta" style="${picked==null?'opacity:.45;pointer-events:none':''}" onclick="${last?`submitQuiz('${QZ.mId}')`:'qnav(1)'}">${last?'Voir mon score':'Suivant →'}</button>
    </div>`);
  document.querySelector('#modal .ov-body').scrollTop=0;
}
function pickQ(oi){QZ.ans[QZ.i]=oi;renderQ();}
function qnav(d){QZ.i+=d;renderQ();}
function submitQuiz(mId){
  const m=M(mId);let sc=0;m.Q.forEach((q,qi)=>{if(QZ.ans[qi]===q.a)sc++;});
  const need=Math.ceil(m.Q.length*0.7),pass=sc>=need;
  if(pass){ST.quiz[mId]=true;save();refreshHeader();}
  setM('Résultat · '+m.num,`
    <div class="card" style="text-align:center;background:${pass?'#dcfce7':'#fee2e2'};border-color:${pass?'#bbf7d0':'#fecaca'}">
      <div style="font-size:34px;font-weight:800;color:${pass?'#166534':'#991b1b'}">${sc}/${m.Q.length}</div>
      <div class="mt" style="color:${pass?'#166534':'#991b1b'};font-weight:600">${pass?'Module validé, le suivant est débloqué.':'Il te faut '+need+'/'+m.Q.length+'. Revois les vidéos et réessaie.'}</div>
    </div>
    <h3 class="sh">Ta correction</h3>
    ${m.Q.map((q,qi)=>{const ok=QZ.ans[qi]===q.a;return `<div class="card"><div class="mt" style="font-weight:700;color:${ok?'#166534':'#991b1b'}">${ok?'✓ Juste':'✗ Faux'} · Q${qi+1}</div><div style="font-size:12.5px;margin:5px 0;color:#2a2e3d;line-height:1.45">${q.q}</div><div class="mt" style="color:#166534"><b>Bonne réponse :</b> ${q.o[q.a]}</div>${ok?'':`<div class="mt" style="color:#991b1b;margin-top:3px">Ta réponse : ${QZ.ans[qi]!=null?q.o[QZ.ans[qi]]:'(vide)'}</div>`}</div>`;}).join('')}
    <button class="cta" onclick="${pass?"closeModal();go('parcours')":`openQuiz('${mId}')`}" style="margin-top:6px">${pass?'Continuer le parcours':'Refaire le quiz'}</button>`);
}

/* Profil (test) */
function openProfil(){
  if(ST.test){profResult();openModal();return;}
  setM('Diagnostic de vendeur',`
    <div class="card"><div class="plabel">5 min</div><div class="mt" style="font-size:13px;color:#2a2e3d">Réponds au feeling, il n'y a pas de mauvaise réponse.</div></div>

      <div class="qopt" onclick="pick(this)">En voyant du monde</div><div class="qopt on" onclick="pick(this)">Au calme, seul</div></div>
    <div class="card"><div class="nm" style="font-size:14px;margin-bottom:4px">Quand tu prépares un RDV, tu te fies d'abord...</div>
      <div class="qopt on" onclick="pick(this)">Aux faits concrets</div><div class="qopt" onclick="pick(this)">À ton intuition</div></div>
    <div class="card"><div class="nm" style="font-size:14px;margin-bottom:4px">En rendez-vous, ton réflexe...</div>

}

function profResult(){
  setM('Ton profil de vendeur',`
    <div class="card" style="background:#eef0ff;border-color:#e0e3ff"><div class="plabel">Ton résultat</div><div class="nm" style="margin-top:3px">L'Expert · ISTP « Le Pragmatique »</div></div>
    <div class="pchips"><span class="pchip">DISC · C Consciencieux</span><span class="pchip">Archétype · L'Expert</span><span class="pchip">ISTP</span></div>
    <div class="card"><div class="plabel">Ta force</div><div class="mt" style="font-size:13px;color:#2a2e3d">Tu maîtrises ton offre et tes chiffres. Ta rigueur crée une vraie crédibilité, le client achète ta compétence. Concret et calme, tu vas à l'essentiel.</div></div>
    <div class="card"><div class="plabel">Ton angle mort</div><div class="mt" style="font-size:13px;color:#2a2e3d">Tu sur-analyses et tu hésites au closing. Le mieux est l'ennemi du closé : décide plus vite, ose demander l'engagement.</div></div>
    <div class="card"><div class="plabel">Ton moteur</div><div class="mt" style="font-size:13px;color:#2a2e3d">La maîtrise et l'excellence. Tu te recharges dans un sujet creusé à fond, seul et au calme.</div></div>
    <h3 class="sh">Lire ton prospect · SONCAS</h3>
    <div class="soncas"><div><b>Sécurité</b> · preuves, garanties</div><div><b>Orgueil</b> · statut, exclusivité</div><div><b>Nouveauté</b> · innovation</div><div><b>Confort</b> · simple, sans effort</div><div><b>Argent</b> · ROI chiffré</div><div><b>Sympathie</b> · relation</div></div>`);
}
function pick(el){el.parentElement.querySelectorAll('.qopt').forEach(c=>c.classList.remove('on'));el.classList.add('on');}

/* Gestes / Assistant / Communauté */
function togGeste(id){ST.gestes[id]=!ST.gestes[id];save();go('gestes');}
function amode(m,btn){document.getElementById('a-quick').style.display=m==='quick'?'':'none';document.getElementById('a-chat').style.display=m==='chat'?'':'none';btn.parentElement.querySelectorAll('.segb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function publier(){const el=document.getElementById('cinp');const v=el.value.trim();if(!v)return;ST.posts.unshift({av:"M",who:"Marc D. (toi)",when:"à l'instant",body:v,k:0,c:0});save();go('communaute');}

go('accueil');
</script>
